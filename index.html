/* ================= Guest links: read-only, time-limited views for other people =================
   A guest link looks like  <this site>/#guest=<script id>~<key>~<ends at>.  This block runs BEFORE everything else on the page.
   It moves the key into this TAB's session storage (gone when the tab closes), removes it from the address bar, and gives the page a
   private in-memory copy of "localStorage" so a guest never reads, overwrites or leaves behind anything saved by the owner in this browser.
   The script (not this page) is what really limits a guest: a guest key can only read, only what its preset allows. */
(function () {
  'use strict';
  var GKEY = 'mm.guest', ENDED = 'mm.guestEnded';
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
  var MSG = {
    expired: ['This guest link has expired', 'It may also have been turned off by the owner. Ask for a new link if you still need access.'],
    unsupported: ['This browser cannot open guest links safely', 'Try another browser, or ask the owner for a different way to share.'],

  };

  function take() {
    var m = /^#guest=([A-Za-z0-9_-]{20,120})~([0-9a-f]{64})~(\d{10,14})$/.exec(location.hash || '');
    if (!/^#guest=/.test(location.hash || '')) return false;

  }

    var t = MSG[reason] || MSG.expired;
    function go() {

      var d = document.createElement('div'); d.id = 'guest-ended'; d.setAttribute('role', 'alert');
      d.style.cssText = 'position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:24px;background:#0e1116;color:#e9ecf1;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center';

      var p = document.createElement('p'); p.textContent = t[1]; p.style.cssText = 'margin:0 0 22px;color:#a2abb9';

      b.style.cssText = 'background:none;border:0;color:#7fb0ff;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer';

    getItem: function (k) { k = String(k); return k in mem ? mem[k] : null; },
    setItem: function (k, v) { mem[String(k)] = String(v); },
    removeItem: function (k) { delete mem[String(k)]; },
    clear: function () { mem = Object.create(null); mem['mm.lgUrl'] = G.u; mem['mm.lgSecret'] = G.k; },
    key: function (i) { var ks = Object.keys(mem); return i >= 0 && i < ks.length ? ks[i] : null; }

  window.mmGuest = { active: true, exp: G.e, end: function (reason) { if (ended) return; ended = true; endGuest(reason); } };
  document.documentElement.classList.add('mm-guest');

  function fmt(ms) {
    var d = new Date(ms), t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString([], { weekday: 'short' }) + ' ' + t;
  }
  function banner() {
    if (document.getElementById('guest-banner')) return;
    var b = document.createElement('div'); b.id = 'guest-banner'; b.setAttribute('role', 'status');

  function tick() { if (Date.now() >= window.mmGuest.exp) window.mmGuest.end('expired'); }

  /* Belt and braces: anything that could write or open owner screens is stopped before it runs. The script refuses them anyway. */
  var BLOCK = '[data-sec],[data-lg],.lg-fab,#syncpill,[data-act="rowedit"],[data-act="rowdel"],[data-act="rowdelgo"],[data-act="devedit"],[data-act="devdel"],[data-act="devdelgo"],[data-act="idfill"],[data-act="matchfix"],[data-act="matchrefix"],[data-act="issuefix"],[data-act="connect"],[data-act="useemb"]';

    if (t) { e.stopImmediatePropagation(); e.preventDefault(); }

/* ===== STATUS SIGNALS CSS START ===== */
:root {
  --ss-yellow: #854d0e;
  --ss-yellow-soft: #fef9c3;
  --ss-yellow-solid: #facc15;
  --ss-yellow-ink: #422006;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ss-yellow: #fde047;
    --ss-yellow-soft: #422006;
  }
}
:root[data-theme="dark"] {
  --ss-yellow: #fde047;
  --ss-yellow-soft: #422006;
}

/* Flagged Row States */
.li.ss .ic { position: relative; cursor: pointer; transition: filter 0.15s ease; }
.li.ss .ic:hover { filter: brightness(1.08); }
.li.ss .ic:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

/* Level Themes for Icons: yellow = mild, red = heavier, blinking red = extra heavy */
.li.ss-pending .ic { background: var(--ss-yellow-soft); color: var(--ss-yellow); }
.li.ss-issue .ic { background: var(--bad-soft); color: var(--bad); }
.li.ss-overdue .ic {
  background: var(--bad-soft);
  color: var(--bad);
  box-shadow: 0 0 0 2px var(--bad), 0 0 8px var(--bad);
  animation: ss-blink 1.4s ease-in-out infinite;
}
@keyframes ss-blink {
  0%, 100% { box-shadow: 0 0 0 2px var(--bad), 0 0 4px var(--bad); opacity: 1; }
  50% { box-shadow: 0 0 0 2px var(--bad), 0 0 12px var(--bad); opacity: 0.85; }
}

/* Count badges: a different shape per level so colour is never the only signal */
.ss-b {
  position: absolute; top: -4px; right: -4px; height: 16px; min-width: 16px; padding: 0 4px;
  font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; box-sizing: border-box;
  outline: 2px solid var(--surface); font-style: normal; display: inline-flex; align-items: center;
  justify-content: center; z-index: 1;
}
.ss-b-pending { border-radius: 9999px; background: var(--ss-yellow-solid); color: var(--ss-yellow-ink); }
.ss-b-issue { border-radius: 9999px; background: var(--bad); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8); }
.ss-b-overdue { border-radius: 5px; background: var(--bad); color: #fff; min-width: 18px; }

/* Popover panel (sits right under the row) */
.ss-pop {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px; margin: 4px 0 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); animation: ss-pop-in 120ms ease-out;
}
.ss-pop.ss-preview { box-shadow: 0 2px 8px rgba(0,0,0,0.08); pointer-events: auto; }
@keyframes ss-pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .ss-pop { animation: none !important; } }
.ss-pop::before {
  content: ""; position: absolute; top: -6px; left: 14px; width: 10px; height: 10px; background: var(--surface);
  border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: rotate(45deg);
}
.ss-pop-h {
  display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 6px; padding: 0 4px;
}
.ss-pop-x { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; line-height: 1; border-radius: 4px; }
.ss-pop-x:hover { color: var(--text); background: var(--surface2); }
.ss-pop-bdy { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.ss-it {
  display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left; background: transparent; border: none;
  border-radius: 8px; padding: 8px; cursor: pointer; box-sizing: border-box; color: var(--text);
}
.ss-it:hover, .ss-it:focus-visible { background: var(--surface2); outline: none; }
.ss-it.ss-hover { background: var(--surface2); }
.ss-it.ss-hover:has(.ss-dot-pending) { border-left: 3px solid var(--ss-yellow); }
.ss-it.ss-hover:has(.ss-dot-issue) { border-left: 3px solid var(--bad); }
.ss-it.ss-hover:has(.ss-dot-overdue) { border-left: 3px solid var(--bad); }
.ss-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex: none; }
.ss-dot-pending { background: var(--ss-yellow-solid); }
.ss-dot-issue { background: var(--bad); }
.ss-dot-overdue { background: var(--bad); }
.ss-it-m { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.ss-it-t { font-size: 13px; font-weight: 700; line-height: 1.2; }
.ss-it-r { font-size: 12px; color: var(--muted); line-height: 1.3; word-break: break-word; }
/* ===== STATUS SIGNALS CSS END ===== */
/* ===== CHECK MATCHING STATUS CSS START ===== */
/* The check-mark button in the top bar uses the same colors as the Log menu icons: yellow = mild, red = heavier, blinking red = extra heavy. */
.ibtn.mf { position: relative; }
.ibtn.mf-pending { background: var(--ss-yellow-soft); color: var(--ss-yellow); border-color: var(--ss-yellow); }
.ibtn.mf-issue { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.ibtn.mf-overdue { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad), 0 0 8px var(--bad); animation: ss-blink 1.4s ease-in-out infinite; }
.ibtn.mf-pending:hover { border-color: var(--ss-yellow); }
.ibtn.mf-issue:hover, .ibtn.mf-overdue:hover { border-color: var(--bad); }
@media (prefers-reduced-motion: reduce) { .ibtn.mf-overdue { animation: none; } }
/* ===== CHECK MATCHING STATUS CSS END ===== */
/* ===== GLOW + DRAFT STATES START ===== */
/* Glow means "this needs you and time matters". Violet means "not finished yet". Each glow keeps a static shadow so it still shows under reduced motion. */

@keyframes urgent-glow{0%,100%{box-shadow:0 0 8px 1px color-mix(in srgb,var(--glow) 40%,transparent)}50%{box-shadow:0 0 16px 3px color-mix(in srgb,var(--glow) 55%,transparent)}}
.glow-draft{--glow:var(--draft);box-shadow:0 0 8px 1px color-mix(in srgb,var(--glow) 40%,transparent);animation:urgent-glow 2.4s ease-in-out infinite}
.li.ss-issue .ic{--glow:var(--bad);box-shadow:0 0 8px 1px color-mix(in srgb,var(--glow) 40%,transparent);animation:urgent-glow 3s ease-in-out infinite}
.lg-gh+.list .li .ic{position:relative}

.lg-gh+.list .li .ic[data-dr="stale"]{--glow:var(--draft);box-shadow:0 0 8px 1px color-mix(in srgb,var(--glow) 40%,transparent);animation:urgent-glow 2.4s ease-in-out infinite}

.chip.bad.glow-urgent{border-radius:inherit}

    return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits'])
      .then(function(k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: it }, k, 256); })
      .then(function(bits) { return new Uint8Array(bits); });
  }
  function eq(a, b) {
    if (a.length !== b.length) return false;
    var d = 0;
    for (var i = 0; i < a.length; i++) d |= a[i] ^ b[i];
    return d === 0;
  }
  function normUser(u) { return String(u == null ? '' : u).trim().toLowerCase(); }
  function readCred() {
    try {
      var r = JSON.parse(lsGet(CRED_KEY) || 'null');
      return (r && r.u && r.s && r.h) ? r : null;
    } catch (e) { return null; }
  }
  function hasCreds() { return !!readCred(); }
  function savedUsername() { var r = readCred(); return r ? r.u : ''; }

  function waitSecs() {
    var u = parseInt(lsGet(UNTIL_KEY) || '0', 10) || 0;
    return Math.max(0, Math.ceil((u - Date.now()) / 1000));
  }
  function noteFail() {
    var f = (parseInt(lsGet(FAIL_KEY) || '0', 10) || 0) + 1;
    lsSet(FAIL_KEY, String(f));
    if (f >= 5) lsSet(UNTIL_KEY, String(Date.now() + Math.min(900, 30 * Math.pow(2, f - 5)) * 1000));
  }
  function noteOk() { lsDel(FAIL_KEY); lsDel(UNTIL_KEY); }

  /* password alone (used to confirm changes) */
  function checkPassword(pass) {
    var r = readCred();
    if (!r) return Promise.resolve(false);
    return derive(pass, unb64(r.s), r.i || ITER).then(function(h) { return eq(h, unb64(r.h)); });
  }
  /* username + password (sign-in). Always hashes, so timing does not reveal whether the username matched. */
  function verifyCreds(user, pass) {
    var r = readCred();
    if (!r) return Promise.resolve(false);
    if (waitSecs() > 0) return Promise.resolve(false); /* lockout is enforced here too, not only by the caller */
    return derive(pass, unb64(r.s), r.i || ITER).then(function(h) {
      var okHash = eq(h, unb64(r.h));
      var okUser = normUser(user) === r.u;
      return okHash && okUser;
    });
  }

  function setCreds(user, pass, currentPass) {
    var u = normUser(user);
    pass = String(pass == null ? '' : pass);
    if (!canHash()) return Promise.resolve({ ok: false, msg: 'Username sign-in needs a secure page (https or localhost).' });
    if (u.length < 3) return Promise.resolve({ ok: false, msg: 'Username must be at least 3 characters.' });
    if (/\s/.test(u)) return Promise.resolve({ ok: false, msg: 'Username cannot contain spaces.' });
    if (pass.length < 8) return Promise.resolve({ ok: false, msg: 'Password must be at least 8 characters.' });
    var w = waitSecs();
    if (hasCreds() && w > 0) return Promise.resolve({ ok: false, msg: 'Too many attempts. Try again in ' + w + ' seconds.' });
    var gate = hasCreds() ? checkPassword(currentPass || '') : Promise.resolve(true);
    return gate.then(function(ok) {
      if (!ok) { noteFail(); return { ok: false, msg: 'Current password is incorrect.' }; }
      var salt = crypto.getRandomValues(new Uint8Array(16));
      return derive(pass, salt, ITER).then(function(h) {
        var saved = lsSet(CRED_KEY, JSON.stringify({ u: u, s: b64(salt), h: b64(h), i: ITER }));
        if (!saved) return { ok: false, msg: 'Could not save: browser storage is unavailable or full.' };
        noteOk();
        return { ok: true, msg: 'Username and password saved.' };
      });
    }).catch(function() { return { ok: false, msg: 'Could not save. Try again.' }; });
  }
  function clearCreds(currentPass) {
    if (!hasCreds()) return Promise.resolve({ ok: true, msg: 'Nothing to remove.' });
    if (!canHash()) return Promise.resolve({ ok: false, msg: 'This needs a secure page (https or localhost).' });
    var w = waitSecs();
    if (w > 0) return Promise.resolve({ ok: false, msg: 'Too many attempts. Try again in ' + w + ' seconds.' });
    return checkPassword(currentPass || '').then(function(ok) {
      if (!ok) { noteFail(); return { ok: false, msg: 'Current password is incorrect.' }; }
      lsDel(CRED_KEY); noteOk();
      return { ok: true, msg: 'Username and password removed. Google sign-in still works.' };
    }).catch(function() { return { ok: false, msg: 'Could not remove. Try again.' }; });
  }

  function endServerSession() {
    try {
      var url = (lsGet('mm.lgUrl') || '').trim(), tok = lsGet('mm.lgSecret') || '';
      if (/^https:\/\//i.test(url) && tok) {
        fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'logout', secret: tok }), keepalive: true, redirect: 'follow' }).catch(function() {});
      }
    } catch (e) {}
    lsDel('mm.lgSecret');
  }
  /* The script said our session is no longer valid. Forget it and go back to the sign-in screen (only if we are past it, so this can never loop). */
  function expired() {
    if (window.mmGuest && window.mmGuest.active) { window.mmGuest.end('expired'); return; }   /* a guest key that ended or was revoked: show "This guest link has expired", never the sign-in screen */
    if (ssGet('user_authenticated') !== 'true') return;
    lsDel('mm.lgSecret');
    try { sessionStorage.setItem('mm.signedOutNote', 'Your sign-in expired. Please sign in again.'); } catch (e) {}
    signOut(true);
  }
  function signOut(skipServer) {
    if (skipServer !== true) endServerSession();
    ssDel('user_authenticated');
    ssDel(METHOD_KEY);
    ssDel('mm.unlocked');
    try { if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); } catch (e) {}
    location.reload();
  }

  window.mmAuth = {
    allowedEmail: ALLOWED_EMAIL,
    hasCreds: hasCreds,
    savedUsername: savedUsername,
    canHash: canHash,
    setCreds: setCreds,
    clearCreds: clearCreds,
    signOut: signOut,
    expired: expired,
    clientId: CLIENT_ID,
    method: function() { return ssGet(METHOD_KEY) || ''; }
  };

  /* ---------- Google Identity Services ---------- */
  function decodeJwtPayload(token) {
    try {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(
        atob(base64)
          .split('')
          .map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
          })
          .join('')
      );
      return JSON.parse(jsonPayload);
    } catch (e) {
      console.error('Failed to decode JWT response:', e);
      return null;
    }
  }

  var gsiInit = false;
  var gsiRendered = false;
  /* Draws the single Google button. Safe to call repeatedly: it initializes once and never adds a second button. */
  function renderGsi() {
    if (gsiRendered) return true;
    var btn = byId('google-signin-btn');
    if (!btn) return true;
    if (!(window.google && window.google.accounts && window.google.accounts.id)) return false;
    try {
      if (!gsiInit) {
        window.google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: window.handleCredentialResponse,
          auto_select: false
        });
        gsiInit = true;
      }
      btn.innerHTML = '';
      var host = btn.parentNode;
      var avail = host && host.clientWidth ? host.clientWidth : 280;
      window.google.accounts.id.renderButton(btn, {
        theme: 'filled_black',
        size: 'large',
        shape: 'rectangular',
        text: 'sign_in_with',
        width: Math.max(200, Math.min(280, avail))
      });
      gsiRendered = true;
    } catch (err) {
      console.warn('GSI render notice:', err);
    }
    return gsiRendered;
  }
  /* The GSI script loads async, so retry for a few seconds until it is ready. */
  function ensureGsi() {
    if (renderGsi()) return;
    var tries = 0;
    var t = setInterval(function() {
      tries++;
      if (renderGsi() || tries > 40) clearInterval(t);
    }, 250);
  }

  window.handleCredentialResponse = function(response) {
    if (!response || !response.credential) {
      showError('Sign-in failed. Please try again.');
      return;
    }

    var payload = decodeJwtPayload(response.credential);
    var email = payload && payload.email ? payload.email.trim().toLowerCase() : '';

    if (email !== ALLOWED_EMAIL) {
      showError('Access Restricted: Authentication Failed');
      return;
    }
    /* The check above is only a courtesy. Your sheet script is the real gate: it asks Google to verify this sign-in and, if it is
       really you, hands back a session key. Without that key the script returns no data and accepts no changes. */
    var url = (lsGet('mm.lgUrl') || '').trim();
    if (!/^https:\/\//i.test(url)) { markAuthenticated('google'); return; }   /* no sheet linked yet: this page only holds demo data */
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'login', credential: response.credential }), redirect: 'follow' })
      .then(function(r) { return r.json(); })
      .then(function(j) {
        if (j && j.ok && j.token) {
          lsSet('mm.lgSecret', j.token);
          markAuthenticated('google');
          location.reload();   /* start fresh so every screen loads with the new key */
        } else {
          var said = j && typeof j.error === 'string' ? j.error.slice(0, 80) : 'no reply';
          var why = j && typeof j.reason === 'string' ? j.reason.slice(0, 90) : '';
          var hint;
          if (/^tab not allowed|^unknown|^bad/i.test(said) || !j || j.error === undefined) hint = 'The link saved in this app is answered by an OLD version of your script. Update the same deployment to a New version (Deploy > Manage deployments > pencil > New version).';
          else if (/^fetch/.test(why)) hint = 'Your script is not allowed to call Google yet. In the script editor run revokeAllSessions once, click Review permissions, then Allow, then redeploy as a New version.';
          else if (why === 'client-id-mismatch') hint = 'GOOGLE_CLIENT_ID at the top of the script does not match this site. Paste the script from the PRIVATE file again.';
          else if (why === 'email-mismatch') hint = 'ALLOWED_EMAIL at the top of the script does not match the Google account you signed in with.';
          else if (why === 'expired') hint = 'That sign-in had already expired. Try again.';
          else if (said === 'auth' && !why) hint = 'The script answered but gave no reason, so it is the version before the reasons were added. Paste the newest script and redeploy as a New version.';
          else hint = 'Check the script and redeploy it.';
          var idm = (url.match(/\/macros\/s\/([^\/?#]+)/) || [])[1] || '';
          var where = idm ? ' This app is calling the script link that starts with ' + idm.slice(0, 22) + ' (it must be the deployment you updated).' : '';
          showError('Google accepted you, but your sheet script refused this sign-in. Script said: "' + said + '"' + (why ? ' (' + why + ')' : '') + '. ' + hint + where);
        }
      })
      .catch(function() { showError('Could not reach your sheet script. Check your connection and try again.'); });
  };

  /* ---------- Username / password form ---------- */
  function bindForm() {
    var form = byId('auth-local-form');
    if (!form || form.__mmBound) return;
    form.__mmBound = true;
    var busy = false;
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (busy) return;
      var userEl = byId('auth-user'), passEl = byId('auth-pass'), btn = byId('auth-submit');
      var user = userEl ? userEl.value : '', pass = passEl ? passEl.value : '';
      var w = waitSecs();
      if (w > 0) { showError('Too many attempts. Try again in ' + w + ' seconds.'); return; }
      if (!normUser(user) || !pass) { showError('Enter your username and password.'); return; }
      if (!hasCreds()) {
        showError('No username and password is set up on this device yet. Sign in with Google, then add them under Security & Settings (the $ icon, top left).');
        return;
      }
      if (!canHash()) { showError('Username sign-in needs a secure page (https or localhost). Use Google sign-in instead.'); return; }
      /* SCREEN LOCK: the username and password are only a quick unlock for a device that Google already verified. With a sheet linked,
         this device must hold a sheet session key (given at Google sign-in). Otherwise the lock would open a page with no real data. */
      if (/^https:\/\//i.test((lsGet('mm.lgUrl') || '').trim()) && !lsGet('mm.lgSecret')) {
        showError('This device is not signed in to your sheet yet. Sign in with Google once. After that, your username and password work as a quick lock.');
        return;
      }
      busy = true;
      if (btn) btn.disabled = true;
      verifyCreds(user, pass).then(function(ok) {
        busy = false;
        if (btn) btn.disabled = false;
        if (passEl) passEl.value = '';
        if (ok) {
          noteOk();
          markAuthenticated('local');
          /* with a sheet linked, start fresh so the data loads under the unlocked page (and a stale key is caught right away) */
          if (/^https:\/\//i.test((lsGet('mm.lgUrl') || '').trim())) location.reload();
        } else {
          noteFail();
          var w2 = waitSecs();
          showError(w2 > 0 ? 'Incorrect username or password. Try again in ' + w2 + ' seconds.' : 'Incorrect username or password.');
        }
      }, function() {
        busy = false;
        if (btn) btn.disabled = false;
        showError('Could not check the credentials. Try again.');
      });
    });
    var clear = function() { clearError(); };
    var u = byId('auth-user'), p = byId('auth-pass');
    if (u) u.addEventListener('input', clear);
    if (p) p.addEventListener('input', clear);
    /* nothing behind the modal should react to keys typed into it */
    var modal = byId('auth-modal');
    if (modal) modal.addEventListener('keydown', function(e) { e.stopPropagation(); });
  }

  document.addEventListener('DOMContentLoaded', function() {
    var isAuth = false;
    try {
      isAuth = sessionStorage.getItem('user_authenticated') === 'true';
    } catch (e) {}

    var modal = byId('auth-modal');
    if (modal) {
      if (isAuth) {
        hideModal();
      } else {
        modal.classList.remove('hidden');
        modal.style.display = 'flex';
        modal.style.pointerEvents = 'auto';
        bindForm();
        ensureGsi();
        try {   /* say why we are back here (for example: the sheet key expired) */
          var note = sessionStorage.getItem('mm.signedOutNote');
          if (note) { sessionStorage.removeItem('mm.signedOutNote'); showError(note); }
        } catch (e) {}
      }
    }
  });

  window.addEventListener('load', function() {
    try {
      if (sessionStorage.getItem('user_authenticated') !== 'true') {
        bindForm();
        ensureGsi();
      }
    } catch (e) {}
  });
})();
</script>

<style id="mm-hover-fx">
/* HOVER EFFECTS: things you can click enlarge a little and get a soft under-glow while the pointer is on them.

<script id="mm-appearance-v3-core">
/* Appearance v3, part 1 (runs early so there is no flash): reads the saved fine-tuning choices and puts them on <html>.
   Keys (all strings, all synced with the sheet through the settings sync): mm.hfx.round, mm.hfx.text, mm.hfx.enl, mm.hfx.bg, mm.hfx.anim
   (percentages; 100 = how it looked before, and 100 is stored as "nothing saved"), mm.hfx.amoled ("1"), mm.hfx.ink ("1").
   Anything out of range or not a plain number is ignored. Fully wrapped so it can never break the page. */
(function () {
  try {
    if (window.__mmAp3Core) return;
    var NAMES = ['round', 'text', 'enl', 'bg', 'anim'];
    var DEF = { round: 100, text: 100, enl: 100, bg: 100, anim: 100 };
    var RANGE = { round: [0, 200], text: [85, 130], enl: [0, 500], bg: [50, 100], anim: [0, 200] };
    var KEY = { round: 'mm.hfx.round', text: 'mm.hfx.text', enl: 'mm.hfx.enl', bg: 'mm.hfx.bg', anim: 'mm.hfx.anim' };
    var K_AMOLED = 'mm.hfx.amoled', K_INK = 'mm.hfx.ink', K_BGC = 'mm.hfx.bgc';   /* K_BGC: custom page background, "#rrggbb"; stays on this device (not in the sheet sync list) */
    var cur = { round: 100, text: 100, enl: 100, bg: 100, anim: 100, amoled: false, ink: false, bgc: '' };

    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

    function load() {
      for (var i = 0; i < NAMES.length; i++) {
        var n = NAMES[i], raw = lsGet(KEY[n]);
        cur[n] = DEF[n];
        if (raw !== null && /^\d{1,3}$/.test(raw)) {
          var v = parseInt(raw, 10);
          if (v >= RANGE[n][0] && v <= RANGE[n][1]) cur[n] = v;
        }
      }
      cur.amoled = lsGet(K_AMOLED) === '1';
      cur.ink = lsGet(K_INK) === '1';
      var rawBgc = lsGet(K_BGC);
      cur.bgc = (typeof rawBgc === 'string' && /^#[0-9a-fA-F]{6}$/.test(rawBgc)) ? rawBgc.toLowerCase() : '';
    }
    function setGate(d, attr, prop, val) {
      if (val === null) { d.removeAttribute(attr); d.style.removeProperty(prop); }
      else { d.setAttribute(attr, '1'); d.style.setProperty(prop, val); }
    }
    function apply() {
      try {
        var d = document.documentElement; if (!d) return;
        setGate(d, 'data-ap3-round', '--ap3-rf', cur.round !== DEF.round ? (cur.round / 100).toFixed(3) : null);
        setGate(d, 'data-ap3-text', '--ap3-zoom', cur.text !== DEF.text ? (cur.text / 100).toFixed(3) : null);
        setGate(d, 'data-ap3-enl', '--ap3-enl', cur.enl !== DEF.enl ? (cur.enl / 100).toFixed(3) : null);
        setGate(d, 'data-ap3-bg', '--ap3-bg', cur.bg !== DEF.bg ? cur.bg + '%' : null);
        setGate(d, 'data-ap3-anim', '--ap3-td', cur.anim !== DEF.anim ? (cur.anim === 0 ? '0s' : (0.16 / (cur.anim / 100)).toFixed(3) + 's') : null);
        if (cur.amoled) d.setAttribute('data-ap3-amoled', '1'); else d.removeAttribute('data-ap3-amoled');
        setGate(d, 'data-ap3-bgc', '--ap3-bgc', cur.bgc ? cur.bgc : null);
      } catch (e) {}
    }
    function saveNum(n) { if (cur[n] === DEF[n]) lsDel(KEY[n]); else lsSet(KEY[n], String(cur[n])); }

    load();
    apply();
    window.__mmAp3Core = { names: NAMES, def: DEF, range: RANGE, key: KEY, kAmoled: K_AMOLED, kInk: K_INK, kBgc: K_BGC, cur: cur, load: load, apply: apply, saveNum: saveNum, lsGet: lsGet, lsSet: lsSet, lsDel: lsDel };
  } catch (e) {}
})();
</script>
<script id="mm-hover-fx-js">
/* Appearance (glow) settings. Saved on this device only (localStorage), never touches the sheet.
   Keys: "mm.hfx.s" (glow strength 0-100, 0 = off), "mm.hfx.dir" (bottom|top|left|right|all), "mm.hfx.col" (theme|blue|green|purple|orange|white),
   and the original "mm.hoverfx" ("0" = off) which is still read and written so an old "Off" choice keeps working.
   Strength 0 adds class "mm-fx-off" on <html> (the original off switch); otherwise --hfx-s is set inline and data-hfx-dir / data-hfx-col are set
   so the CSS in "mm-appearance" can draw the glow. Supplies the Appearance card the Security & Settings panel shows.
   Fully wrapped so it can never break the page. First draft by Gemini, reviewed and tightened by Claude. */
(function () {
  try {
    // Default appearance settings (these reproduce the original look exactly)
    var DEFAULTS = { s: 55, dir: 'bottom', col: 'theme', acc: 'blue', tile: 'default', out: 'default' };
    var cur = { s: DEFAULTS.s, dir: DEFAULTS.dir, col: DEFAULTS.col, acc: DEFAULTS.acc, tile: DEFAULTS.tile, out: DEFAULTS.out };

    // Valid option whitelists (anything else read from storage is ignored)
    var VALID_DIRS = ['bottom', 'top', 'left', 'right', 'all'];
    var VALID_COLS = ['theme', 'blue', 'green', 'purple', 'orange', 'white'];
    var VALID_ACCS = ['blue', 'green', 'purple', 'orange', 'rose', 'teal'];   // accent color of the whole app (blue = the original)
    var VALID_TILES = ['default', 'cream', 'mint', 'lavender', 'sky', 'graphite'];   // card / tile colors (default = the original)
    var VALID_OUTS = ['default', 'soft', 'strong', 'accent'];   // outline colors (default = the original)

    function inArray(arr, val) {
      for (var i = 0; i < arr.length; i++) {
        if (arr[i] === val) return true;
      }
      return false;
    }

    // Load saved choices; blocked or odd storage just leaves the defaults
    function load() {
      try {
        var rawS = localStorage.getItem('mm.hfx.s');
        if (rawS !== null && /^\d+$/.test(rawS)) {
          cur.s = Math.max(0, Math.min(100, parseInt(rawS, 10)));
        } else {
          var rawLegacy = null;
          try { rawLegacy = localStorage.getItem('mm.hoverfx'); } catch (_) {}
          cur.s = rawLegacy === '0' ? 0 : DEFAULTS.s;
        }
      } catch (_) {}
      try {
        var rawDir = localStorage.getItem('mm.hfx.dir');
        if (inArray(VALID_DIRS, rawDir)) cur.dir = rawDir;
      } catch (_) {}
      try {
        var rawCol = localStorage.getItem('mm.hfx.col');
        if (inArray(VALID_COLS, rawCol)) cur.col = rawCol;
      } catch (_) {}
      try {
        var rawAcc = localStorage.getItem('mm.hfx.acc');
        if (inArray(VALID_ACCS, rawAcc)) cur.acc = rawAcc;
      } catch (_) {}
      try {
        var rawTile = localStorage.getItem('mm.hfx.tile');
        if (inArray(VALID_TILES, rawTile)) cur.tile = rawTile;
      } catch (_) {}
      try {
        var rawOut = localStorage.getItem('mm.hfx.out');
        if (inArray(VALID_OUTS, rawOut)) cur.out = rawOut;
      } catch (_) {}
    }

    // Push the current choices onto <html> (the CSS reads them)
    function apply() {
      try {
        var doc = document.documentElement;
        if (!doc) return;
        if (cur.s === 0) { doc.classList.add('mm-fx-off'); } else { doc.classList.remove('mm-fx-off'); }
        if (doc.style && typeof doc.style.setProperty === 'function') { doc.style.setProperty('--hfx-s', String(cur.s)); }
        if (typeof doc.setAttribute === 'function') {
          doc.setAttribute('data-hfx-dir', cur.dir);
          doc.setAttribute('data-hfx-col', cur.col);
          doc.setAttribute('data-accent', cur.acc);
          doc.setAttribute('data-tile', cur.tile);
          doc.setAttribute('data-outline', cur.out);
        }
      } catch (_) {}
    }

    // Each write is separate so one failing never blocks the others
    function save() {
      try { localStorage.setItem('mm.hfx.s', String(cur.s)); } catch (_) {}
      try { localStorage.setItem('mm.hfx.dir', cur.dir); } catch (_) {}
      try { localStorage.setItem('mm.hfx.col', cur.col); } catch (_) {}
      try { localStorage.setItem('mm.hfx.acc', cur.acc); } catch (_) {}
      try { localStorage.setItem('mm.hfx.tile', cur.tile); } catch (_) {}
      try { localStorage.setItem('mm.hfx.out', cur.out); } catch (_) {}
      try { localStorage.setItem('mm.hoverfx', cur.s === 0 ? '0' : '1'); } catch (_) {}
    }

    // Reset: back to today's look, and forget the saved choices
    function resetAll() {
      cur.s = DEFAULTS.s;
      cur.dir = DEFAULTS.dir;
      cur.col = DEFAULTS.col;
      cur.acc = DEFAULTS.acc;
      cur.tile = DEFAULTS.tile;
      cur.out = DEFAULTS.out;
      try { if (localStorage.removeItem) localStorage.removeItem('mm.hfx.s'); } catch (_) {}
      try { if (localStorage.removeItem) localStorage.removeItem('mm.hfx.dir'); } catch (_) {}
      try { if (localStorage.removeItem) localStorage.removeItem('mm.hfx.col'); } catch (_) {}
      try { if (localStorage.removeItem) localStorage.removeItem('mm.hfx.acc'); } catch (_) {}
      try { if (localStorage.removeItem) localStorage.removeItem('mm.hfx.tile'); } catch (_) {}
      try { if (localStorage.removeItem) localStorage.removeItem('mm.hfx.out'); } catch (_) {}
      try { if (localStorage.removeItem) localStorage.removeItem('mm.hoverfx'); } catch (_) {}
      apply();
    }

    // Keep the highlighted chips in step with the current choice
    function updateChipAria(card) {
      if (!card || !card.querySelectorAll) return;
      var dirBtns = card.querySelectorAll('button[data-hfx-dir]');
      for (var i = 0; i < dirBtns.length; i++) {
        dirBtns[i].setAttribute('aria-pressed', dirBtns[i].getAttribute('data-hfx-dir') === cur.dir ? 'true' : 'false');
      }
      var colBtns = card.querySelectorAll('button[data-hfx-col]');
      for (var j = 0; j < colBtns.length; j++) {
        colBtns[j].setAttribute('aria-pressed', colBtns[j].getAttribute('data-hfx-col') === cur.col ? 'true' : 'false');
      }
      var accBtns = card.querySelectorAll('button[data-hfx-acc]');
      for (var k = 0; k < accBtns.length; k++) {
        accBtns[k].setAttribute('aria-pressed', accBtns[k].getAttribute('data-hfx-acc') === cur.acc ? 'true' : 'false');
      }
      var tileBtns = card.querySelectorAll('button[data-hfx-tile]');
      for (var t = 0; t < tileBtns.length; t++) {
        tileBtns[t].setAttribute('aria-pressed', tileBtns[t].getAttribute('data-hfx-tile') === cur.tile ? 'true' : 'false');
      }
      var outBtns = card.querySelectorAll('button[data-hfx-out]');
      for (var o = 0; o < outBtns.length; o++) {
        outBtns[o].setAttribute('aria-pressed', outBtns[o].getAttribute('data-hfx-out') === cur.out ? 'true' : 'false');
      }
    }

    // Charts read their colors (accent, grid lines) when they are drawn, so after the accent, tile or outline changes the page is redrawn (the same call the Theme button makes)
    function redraw() {
      try { if (typeof render === 'function') render(); } catch (_) {}
    }

    function setStatus(card, text) {
      if (!card || !card.querySelector) return;
      var st = card.querySelector('#hfx-st');
      if (st) { st.className = 'lg-st good'; st.textContent = text; }
    }

    load();
    apply();

    // The card shown in Security & Settings (built from the in-memory choices, so it also works when storage is blocked)
    window.__mmHoverFxSettingsHtml = function () {
      try {
        var html = '';
        var sValText = cur.s === 0 ? 'Off' : String(cur.s);

        html += '<section class="m3-card" id="hfx-card">';
        html += '<div class="m3-card-head">';
        html += '<span class="m3-icon" aria-hidden="true">palette</span>';
        html += '<div>';
        html += '<div class="m3-card-title">Appearance</div>';
        html += '<div class="m3-card-sub">Glow and look of this device. Saved on this device only.</div>';
        html += '</div></div>';

        html += '<div class="lg-f" style="margin-top:12px;">';
        html += '<div class="lg-l">Glow strength</div>';
        html += '<input type="range" id="hfx-s" min="0" max="100" step="1" value="' + cur.s + '" aria-label="Glow strength" aria-valuetext="' + sValText + '">';
        html += '<output id="hfx-sv" for="hfx-s">' + sValText + '</output>';
        html += '<small class="hint">0 turns the hover enlarge and glow off. Computers only.</small>';
        html += '</div>';

        html += '<div class="lg-f">';
        html += '<div class="lg-l">Glow direction</div>';
        html += '<div class="lg-chips" role="group" aria-label="Glow direction">';
        var dirs = [
          { k: 'bottom', t: 'Bottom' },
          { k: 'top', t: 'Top' },
          { k: 'left', t: 'Left' },
          { k: 'right', t: 'Right' },
          { k: 'all', t: 'All sides' }
        ];
        for (var i = 0; i < dirs.length; i++) {
          var d = dirs[i];
          html += '<button type="button" class="chip-b" data-hfx-dir="' + d.k + '" aria-pressed="' + (cur.dir === d.k ? 'true' : 'false') + '">' + d.t + '</button>';
        }
        html += '</div></div>';

        // live preview: drawn by CSS from the same variables the real hover effect uses
        html += '<div class="hfx-pv-wrap"><div id="hfx-pv" class="hfx-pv" aria-hidden="true">Live preview</div><span class="hfx-pv-btn" aria-hidden="true">Button</span><span class="hfx-pv-pill" aria-hidden="true">Highlight</span><span class="hfx-pv-tile" aria-hidden="true">Tile</span></div>';

        // everything about colors lives in one drawer that remembers whether it was open
        var drawerOpen = false;
        try { drawerOpen = localStorage.getItem('mm.ap.drawer') === '1'; } catch (_) {}
        html += '<details class="hfx-drawer" id="hfx-drawer"' + (drawerOpen ? ' open' : '') + '>';
        html += '<summary class="hfx-drawer-sum"><span class="hfx-drawer-t">Colors and looks</span><span class="hfx-drawer-s">Quick looks, custom colors, share a look</span></summary>';
        html += '<div class="hfx-drawer-body">';
        try { if (typeof window.__mmApPlusHtml === 'function') html += window.__mmApPlusHtml('top'); } catch (_) {}
        try { if (typeof window.__mmColorToolsHtml === 'function') html += window.__mmColorToolsHtml(); } catch (_) {}
        try { if (typeof window.__mmApPlusHtml === 'function') html += window.__mmApPlusHtml('bottom'); } catch (_) {}
        html += '</div></details>';

        html += '<div class="hfx-actions">';
        html += '<button type="button" class="chip-b" id="hfx-reset" data-hfx-reset="1">Reset to default</button>';
        html += '</div>';

        html += '<p class="lg-st" id="hfx-st" role="status"></p>';
        html += '</section>';
        return html;
      } catch (_) {
        return '';
      }
    };

    // Re-read the saved choices and show them (used when settings sync brings in a change from another device)
    window.__mmHfxReload = function () {
      try {
        cur.s = DEFAULTS.s; cur.dir = DEFAULTS.dir; cur.col = DEFAULTS.col; cur.acc = DEFAULTS.acc; cur.tile = DEFAULTS.tile; cur.out = DEFAULTS.out;
        load();
        apply();
        var card = document.getElementById ? document.getElementById('hfx-card') : null;
        if (card) {
          var sl = card.querySelector('#hfx-s'), ov = card.querySelector('#hfx-sv'), txt = cur.s === 0 ? 'Off' : String(cur.s);
          if (sl) { sl.value = String(cur.s); sl.setAttribute('aria-valuetext', txt); }
          if (ov) ov.textContent = txt;
          updateChipAria(card);
        }
      } catch (_) {}
      return window.__mmHfxState();
    };

    // Read-only view of the current choices (used by the tests)
    window.__mmHfxState = function () {
      try { return { s: cur.s, dir: cur.dir, col: cur.col, acc: cur.acc, tile: cur.tile, out: cur.out }; }
      catch (_) { return { s: 55, dir: 'bottom', col: 'theme', acc: 'blue', tile: 'default', out: 'default' }; }
    };

    // Set strength and/or direction from code (quick looks, look codes). Validated; anything else is ignored. Returns the state.
    window.__mmHfxSet = function (o) {
      try {
        if (o && typeof o === 'object') {
          if (typeof o.s === 'number' && isFinite(o.s)) cur.s = Math.max(0, Math.min(100, Math.round(o.s)));
          if (typeof o.dir === 'string' && inArray(VALID_DIRS, o.dir)) cur.dir = o.dir;
          apply();
          save();
          var card = document.getElementById ? document.getElementById('hfx-card') : null;
          if (card) {
            var sl = card.querySelector('#hfx-s'), ov = card.querySelector('#hfx-sv'), txt = cur.s === 0 ? 'Off' : String(cur.s);
            if (sl) { sl.value = String(cur.s); sl.setAttribute('aria-valuetext', txt); }
            if (ov) ov.textContent = txt;
            updateChipAria(card);
          }
        }
      } catch (_) {}
      return window.__mmHfxState();
    };

    if (!window.__mmHfxBound) {
      window.__mmHfxBound = true;

      // remember whether the colors drawer is open (the toggle event does not bubble, so listen while capturing)
      document.addEventListener('toggle', function (e) {
        try {
          if (!e || !e.target || e.target.id !== 'hfx-drawer') return;
          try { localStorage.setItem('mm.ap.drawer', e.target.open ? '1' : '0'); } catch (_) {}
        } catch (_) {}
      }, true);

      // slider
      document.addEventListener('input', function (e) {
        try {
          if (!e || !e.target || e.target.id !== 'hfx-s') return;
          var val = parseInt(e.target.value, 10);
          if (isNaN(val)) return;
          cur.s = Math.max(0, Math.min(100, val));
          apply();
          save();
          var card = e.target.closest ? e.target.closest('#hfx-card') : null;
          if (card) {
            var sValText = cur.s === 0 ? 'Off' : String(cur.s);
            var outEl = card.querySelector ? card.querySelector('#hfx-sv') : null;
            if (outEl) outEl.textContent = sValText;
            e.target.setAttribute('aria-valuetext', sValText);
            setStatus(card, 'Saved');
          }
        } catch (_) {}
      });

      // direction chips, color chips and the Reset button
      document.addEventListener('click', function (e) {
        try {
          var btn = (e.target && e.target.closest) ? e.target.closest('#hfx-card button') : null;
          if (!btn) return;
          var card = btn.closest('#hfx-card');
          var dirAttr = btn.getAttribute('data-hfx-dir');
          var colAttr = btn.getAttribute('data-hfx-col');
          var accAttr = btn.getAttribute('data-hfx-acc');
          var tileAttr = btn.getAttribute('data-hfx-tile');
          var outAttr = btn.getAttribute('data-hfx-out');
          var isReset = btn.getAttribute('data-hfx-reset') === '1';

          if (dirAttr && inArray(VALID_DIRS, dirAttr)) {
            cur.dir = dirAttr;
            apply();
            save();
            updateChipAria(card);
            setStatus(card, 'Saved');
          } else if (colAttr && inArray(VALID_COLS, colAttr)) {
            cur.col = colAttr;
            apply();
            save();
            updateChipAria(card);
            setStatus(card, 'Saved');
          } else if (accAttr && inArray(VALID_ACCS, accAttr)) {
            cur.acc = accAttr;
            apply();
            save();
            updateChipAria(card);
            setStatus(card, 'Saved');
            redraw();
          } else if (tileAttr && inArray(VALID_TILES, tileAttr)) {
            cur.tile = tileAttr;
            apply();
            save();
            updateChipAria(card);
            setStatus(card, 'Saved');
            redraw();
          } else if (outAttr && inArray(VALID_OUTS, outAttr)) {
            cur.out = outAttr;
            apply();
            save();
            updateChipAria(card);
            setStatus(card, 'Saved');
            redraw();
          } else if (isReset) {
            var lookBefore = cur.acc + '|' + cur.tile + '|' + cur.out;
            resetAll();
            if (card) {
              var slider = card.querySelector ? card.querySelector('#hfx-s') : null;
              if (slider) {
                slider.value = String(DEFAULTS.s);
                slider.setAttribute('aria-valuetext', String(DEFAULTS.s));
              }
              var outEl = card.querySelector ? card.querySelector('#hfx-sv') : null;
              if (outEl) outEl.textContent = String(DEFAULTS.s);
              updateChipAria(card);
              setStatus(card, 'Reset to default');
            }
            if (lookBefore !== cur.acc + '|' + cur.tile + '|' + cur.out) redraw();
          }
        } catch (_) {}
      });
    }
  } catch (_) {}
})();
</script>

const num=v=>{if(v==null||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;const s=String(v).replace(/[$,\s]/g,'');return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):null};
/* ---------- Trade columns (optional): Trade ID / Source / Cash Paid / Payment Type.
   A blank Source or Payment Type means plain Purchase / Cash, so every number for rows without trade data stays exactly the same.
   cashSpent is REAL cash that left your pocket; tradeValue is trade-in credit and is never added to cash spent. ---------- */
/* Computes trade-in metrics, cash spent, and trade value for a item row. */
function tradeFields(r, buyPrice) {
  const t = v => { const s = v == null ? '' : String(v).trim(); return s || null; };
  const row = r || {};
  const tradeId = t(row['Trade ID']);
  const sourceRaw = t(row['Source']);
  const payTypeRaw = t(row['Payment Type']);
  const isTradeIn = sourceRaw != null && /trade/i.test(sourceRaw);
  const isTradeSale = payTypeRaw != null && /^(trade|mixed)$/i.test(payTypeRaw);
  const isTrade = isTradeIn || isTradeSale || tradeId != null;
  const cp = num(row['Cash Paid']);
  let cashSpent = null;
  if (buyPrice != null) {
    if (isTradeIn && cp != null) {
      cashSpent = Math.max(0, Math.min(cp, buyPrice));
    } else {
      cashSpent = buyPrice;
    }
  }
  let tradeValue = null;
  if (buyPrice != null && cashSpent != null) {
    tradeValue = Math.round((buyPrice - cashSpent) * 100) / 100;
  }
  return {
    tradeId,
    source: sourceRaw || 'Purchase',
    payType: payTypeRaw || 'Cash',
    isTradeIn,
    isTradeSale,
    isTrade,
    cashSpent,
    tradeValue
  };
}

/* Aggregates cash spent and trade value totals across an array of items. */
function tradeSplit(items) {
  const list = Array.isArray(items) ? items : [];
  const cash = Math.round(sum(list, i => i ? i.cashSpent : 0) * 100) / 100;
  const trade = Math.round(sum(list, i => i ? i.tradeValue : 0) * 100) / 100;
  return { cash, trade };
}

/* Return trade badge HTML or empty string */
function tradeBadge(o){
  if(!o||!o.isTrade)return '';
  var t=o.tradeId?'Trade ID '+esc(o.tradeId):'Trade';
  return '<span class="pill acc" style="margin-left:6px" title="'+t+'">Trade</span>';
}

/* Return formatted cost cell with title tooltip for trades */
function costCell(r){
  if(!(r.tradeValue>0))return M(r.buyPrice);
  return `<span title="Cash spent ${mny(r.cashSpent)} · Trade value received ${mny(r.tradeValue)}">${M(r.buyPrice)}</span>`;
}

}

function normalize(raw){
  const flags=new Map();
  const flag=(sev,sheet,row,field,msg,fix)=>{const k=[sev,sheet,field,msg].join('|');if(!flags.has(k))flags.set(k,{sev,sheet,field,msg,fix,rows:[]});flags.get(k).rows.push(row)};

  const byId=new Map();

  const expenses=[];

    const rowN=i+2;let date=pd(r['Date of Purchase']);
    if(!date){date=pd(r['Timestamp']);if(date)flag('warn','Expenses',rowN,'Date of Purchase','Purchase date is missing, so the entry date was used','Fill in the purchase date')}
    if(!date){flag('warn','Expenses',rowN,'Date of Purchase','No date at all, so the row is left out','Add a date to this row');return}
    let amount=num(r['Amount']);
    if(amount==null){flag('warn','Expenses',rowN,'Amount',`Amount "${r['Amount']}" is not a number, so it counts as $0`,'Enter a dollar value (for example, convert points to dollars)');amount=0}
    const rawCat=(r['Category']||'').toString().trim();let category=CAT_MAP[rawCat.toLowerCase()]||rawCat||'Other';
    if(category!==rawCat&&rawCat)flag('fixed','Expenses',rowN,'Category',`Category "${rawCat}" was merged into "${category}"`,'Use one spelling in the sheet dropdown');
    if(category==='Other')flag('info','Expenses',rowN,'Category','Filed under "Other", which hides what the money was for','Pick a specific category');
    const e={id:'e'+i,date,amount,category,item:(r['Item Purchased']||'Untitled').toString().trim(),place:r['Establishment']||null,payment:r['Payment Method']||null,tag:r['Personal or Business Expense?']||null,notes:r['Notes']||null,isRefund:amount<0,row:rowN};
    if(e.isRefund)flag('info','Expenses',rowN,'Amount','Negative amount treated as a refund and kept out of spending totals','Nothing to fix unless it was a typo');
    expenses.push(e);byId.set(e.id,{type:'expense',o:e});
  });
  /* ---- inventory ---- */
  const items=[];
  const defs=[
    {key:'Phones',kind:'Phone',sheet:'Master Inventory',name:r=>(r['Model']||'').trim(),buyDate:'Purchase Date',buyer:'Sold To',seller:'Bought From',notes:r=>r['Notes'],sheetKeys:{status:'Status'}},
    {key:'PCs',kind:'PC',sheet:'PCs',name:r=>(r['PC model']||'').trim(),buyDate:'Purchase Date',buyer:'Sold to',seller:'Bought From',notes:r=>r['Notes (Bought)']},
    {key:'Accessories',kind:'Accessory',sheet:'PnA',name:r=>[r['Brand'],r['Model']].filter(Boolean).map(s=>String(s).trim()).join(' ')||String(r['Item Type']||'Accessory'),buyDate:'Date Purchased',buyer:'Sold To',seller:'Bought From',notes:r=>r['Notes']}
  ];
  defs.forEach(def=>rowsOf(def.key).forEach((r,i)=>{
    const rowN=i+2,sheet=def.sheet;
    const sold=String(r['Status']||'').trim().toUpperCase()==='SOLD';
    const rawCond=r['Condition'];const condition=canonCondition(rawCond);
    if(rawCond&&condition!==String(rawCond).trim())flag('fixed',sheet,rowN,'Condition',`Condition "${String(rawCond).trim()}" was standardised`,'Use the same dropdown wording');
    const it={id:'i'+items.length,kind:def.kind,name:def.name(r)||'Unnamed',label:r['Device Label']||r['Item Label']||null,condition,
      buyPrice:num(r['Purchase Price']),buyDate:pd(r[def.buyDate]),seller:r[def.seller]||null,sold,status:sold?'SOLD':'IN INVENTORY',
      sellPrice:num(r['Sale Price']),sellDate:pd(r['Sale Date']),buyer:r[def.buyer]||null,profit:null,roi:null,days:null,age:null,
      clicks:num(r['Clicks on Listing']),notes:def.notes(r)||r['Notes (Sold)']||r['Sale Notes']||null,specs:{},row:rowN,sheet};
    Object.assign(it,tradeFields(r,it.buyPrice));
    if(def.kind==='Phone'){it.specs={Color:r['Color'],Storage:r['Storage (GB)'],'Original box':r['Original Box'],Case:r['Case'],Charger:r['Charger'],IMEI:r['IMEI']}}
    if(def.kind==='PC'){it.serial=typeof pcSerialOf==='function'?pcSerialOf(r):null;const ram=canonRam(r['RAM']);if(r['RAM']&&ram!==String(r['RAM']).trim())flag('fixed',sheet,rowN,'RAM',`RAM "${String(r['RAM']).trim()}" was standardised to ${ram}`,'Use values like 16GB');
      it.specs={Color:r['Color'],RAM:ram,CPU:r['CPU (and specs)'],GPU:[r['GPU 1 (and specs)'],r['GPU 2 (and specs)']].filter(Boolean).join(' + '),Storage:r['Storage (SSD, HDD or NVME)'],Screen:r['Screen Size / Hertz'],'Original charger':r['Original Charger']}}
    if(def.kind==='Accessory'){const t=String(r['Item Type']||'').trim();const tt=TYPE_MAP[t.toLowerCase()]||t;if(tt!==t)flag('fixed',sheet,rowN,'Item Type',`Type "${t}" was corrected to "${tt}"`,'Fix the spelling');
      it.type=tt;it.specs={Type:tt,Color:r['Color'],Specs:r['Specs'],Connection:r['Connection Type'],Included:r['Included Accessories']}}
    if(it.sold&&it.sellPrice!=null&&it.buyPrice!=null){it.profit=it.sellPrice-it.buyPrice;it.roi=it.buyPrice?it.profit/it.buyPrice:null}
    else if(it.sold){it.profit=num(r['Profit']);it.roi=num(r['ROI%']??r['ROI']??r['ROI %'])}
    if(it.sold){
      it.days=(it.sellDate&&it.buyDate)?diffD(it.buyDate,it.sellDate):num(r['Days Held']);
      if(!it.sellDate)flag('warn',sheet,rowN,'Sale Date','Marked sold but has no sale date, so it is left out of date-range stats','Add the sale date');
      if(it.sellPrice==null)flag('warn',sheet,rowN,'Sale Price','Marked sold but has no sale price, so profit is unknown','Add the sale price');
      if(!it.buyer)flag('info',sheet,rowN,'Sold To','No buyer name recorded','Add the buyer if you want repeat-buyer stats');
      if(it.sellDate&&it.buyDate&&it.sellDate<it.buyDate)flag('warn',sheet,rowN,'Sale Date','Sale date is before the purchase date','Check both dates');
    }else{
      if(it.buyDate)it.age=diffD(it.buyDate,TODAY);

    }

    items.push(it);byId.set(it.id,{type:'item',o:it});
  }));
  /* ---- investments ---- */
  const investments=rowsOf('Investments').map((r,i)=>{
    const o={id:'v'+i,date:pd(r['Date'])||pd(r['Timestamp']),portfolio:(r['Investment Type']||'Other').toString().trim(),value:num(r['Total Portfolio Value']),pct:num(r['Percentage (All-Time)']),flow:num(r['Amount Added / Subtracted'])||0,notes:r['Notes']||null,type:r['Transaction Type']||null,row:i+2};

  return {expenses,items,investments,issues,counts,byId};
}

  if (!Array.isArray(items)) return result;
  const clean = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
  const get = (r, h) => { if (!r || typeof r !== 'object') return undefined; const t = clean(h); for (const k of Object.keys(r)) if (clean(k) === t) return r[k]; };

    } else if (item.kind === 'Accessory') {

function spark(arr){
  if(!arr||arr.length<2)return '<span class="spark"></span>';
  const mn=Math.min(...arr),mx=Math.max(...arr),rg=(mx-mn)||1;
  const pts=arr.map((v,i)=>[i/(arr.length-1)*96+2,24-((v-mn)/rg)*20]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 100 28" aria-hidden="true"><polygon points="2,26 ${line} 98,26" fill="var(--accent)" opacity=".12"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${l[0]}" cy="${l[1]}" r="2.6" fill="var(--accent)"/></svg>`;
}
function deltaChip(d,inverse){
  if(d===undefined)return '';
  if(d===null)return '<span class="chip">new</span>';
  if(Math.abs(d)<.005)return '<span class="chip">no change</span>';
  const up=d>0,good=inverse?!up:up;
  return `<span class="chip ${good?'good':'bad'}">${up?ICON.up:ICON.down}${Math.abs(d*100).toFixed(0)}%</span>`;
}
function kpi(o){
  const tag=o.act?'button':'div';

    <span class="foot"><span>${o.delta!==undefined?deltaChip(o.delta,o.inverse):''}${o.sub?`<span class="sub"> ${o.sub}</span>`:''}</span>${spark(o.spark)}</span></${tag}>`;
}
function card(title,body,right='',cls=''){return `<section class="card ${cls}"><header><h3>${title}</h3>${right}</header>${body}</section>`}
function bars(list,o={}){
  if(!list.length)return '<div class="empty">Nothing here for this range.</div>';
  const mx=Math.max(...list.map(x=>Math.abs(x.v)))||1,tot=sum(list,x=>x.v)||1;

    const sel=o.sel===x.k;const tag=o.act?'button':'div';

      <span class="nv">${o.fmt?o.fmt(x):M(x.v)}<small>${o.share===false?'':pct(x.v/tot)}</small></span></${tag}>`}).join('')}</div>`;

/* ----- Money in/out chart helpers (pure, unit-tested) ----- */
// Top of the Y axis: the next $500 step above the biggest value, plus 12% headroom so peaks and tooltips do not touch the border.
function homeYMax(vals){const mx=Math.max(0,...(vals||[]).map(v=>+v||0));const top=Math.max(500,Math.ceil(mx/500)*500);return Math.round(top*1.12)}
// Bottom of the Y axis: $0 unless the Net Profit line is shown and dips below zero.
function homeYMin(net,showNet){if(!showNet)return 0;const mn=Math.min(0,...(net||[]).map(v=>+v||0));return mn<0?Math.floor(mn*1.12/500)*500:0}
// Index of the highest positive value (first one wins on ties), or -1 when there is no positive value.
function homePeak(vals){let k=-1,mx=0;(vals||[]).forEach((v,i)=>{v=+v||0;if(v>mx){mx=v;k=i}});return k}
// Net profit per month = reselling profit minus spending.
function homeNet(pr,sp){return (pr||[]).map((v,i)=>(+v||0)-(+(sp||[])[i]||0))}
// Fade a #rrggbb colour to the given alpha (anything else is returned unchanged).
function fadeColor(c,a){const m=/^#([0-9a-f]{6})$/i.exec(c||'');if(!m)return c;const n=parseInt(m[1],16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

function homeChartConfig(labels,sp,pr,ui){

      const c=ch.ctx;c.save();c.shadowColor=fadeColor(bar,.85);c.shadowBlur=22;c.fillStyle=bar;c.beginPath();
      if(c.roundRect)c.roundRect(p.x-p.width/2,p.y,p.width,h,6);else c.rect(p.x-p.width/2,p.y,p.width,h);

      c.fillStyle=ui.bg;c.textAlign='center';c.textBaseline='middle';c.fillText(t,x+w/2,y+h/2+.5);c.restore()}catch(e){}}};
  return {data:{labels,datasets:[
    {type:'bar',label:'Spending',data:sp,backgroundColor:bar,borderRadius:6,order:2},
    {type:'line',label:'Reselling profit',data:pr,borderColor:ln,backgroundColor:ln,cubicInterpolationMode:'monotone',tension:0,pointRadius:3,borderWidth:2.5,order:1},

  options:{responsive:true,maintainAspectRatio:false,animation:ui.still?false:{duration:350},layout:{padding:{top:18}},
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false},tooltip:{enabled:!ui.privacy,backgroundColor:ui.ink2,titleColor:ui.bg,bodyColor:ui.bg,cornerRadius:10,padding:10,boxWidth:10,boxHeight:10,boxPadding:6,usePointStyle:false,

const TS={},TC={};
function tableShell(id,cfg){

function tableRows(id){
  const cfg=TC[id],st=TS[id];let rows=cfg.rows();
  if(st.q){const q=st.q.toLowerCase().split(/\s+/).filter(Boolean);rows=rows.filter(r=>{const t=cfg.text(r).toLowerCase();return q.every(w=>t.includes(w))})}
  if(st.sort){const c=cfg.cols.find(c=>c.k===st.sort.k);if(c){const f=c.val||(r=>r[c.k]);rows=[...rows].sort((a,b)=>{const x=f(a),y=f(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*st.sort.dir})}}

}
function fillTable(id){
  const host=$(`[data-tbl="${id}"]`);if(!host||!TC[id])return;
  const cfg=TC[id],st=TS[id];const rows=tableRows(id);const cols=cfg.cols.filter(c=>!st.hidden.has(c.k));
  const total=cfg.sumKey?sum(rows,cfg.sumKey):null;const shown=rows.slice(0,st.shown);

  const colMenu=st.menu?`<div class="cols">${cfg.cols.map(c=>`<label><input type="checkbox" data-act="tcol" data-t="${id}" data-k="${c.k}" ${st.hidden.has(c.k)?'':'checked'}> ${esc(c.h)}</label>`).join('')}</div>`:'';
  host.innerHTML=colMenu+`<div class="tmeta"><span>${plural(rows.length,'row')}${total!=null?` · ${M(total)} ${cfg.sumLabel||'total'}`:''}</span><span>${cfg.metaRight?cfg.metaRight(rows):''}</span></div>`+
    (rows.length?`<div class="tscroll ${st.dense?'dense':''}"><table><thead><tr>${cols.map(c=>`<th class="${c.num?'n':''}" data-act="tsort" data-t="${id}" data-k="${c.k}" aria-sort="${st.sort&&st.sort.k===c.k?(st.sort.dir>0?'ascending':'descending'):'none'}">${esc(c.h)}<span class="ar">${st.sort&&st.sort.k===c.k?(st.sort.dir>0?'↑':'↓'):''}</span></th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`+
      (rows.length>st.shown?`<button class="btn sec more" data-act="tmore" data-t="${id}">Show ${Math.min(50,rows.length-st.shown)} more (${rows.length-st.shown} left)</button>`:''):
      empty('No rows match',st.q?'Try a different search.':'Nothing here for the current filters.',`<button class="btn sec" data-act="clearall" data-t="${id}">Clear filters</button>`));
}
function tableCSV(id){

/* The optional "Row ID" column of the Expenses tab, found the way the script finds it (letters and digits only, any case).
   hasCol: the loaded tab has that column. id: this row's ID ('' when its cell is empty). blocked: the column exists, the row is in the sheet, and its ID is empty.
   No such column = {hasCol:false}: nothing changes from today (row number plus expect). */
function rowIdInfo(o){
  const base=store.base||store.raw,tab=base&&base.Expenses;if(!tab||!Array.isArray(tab.rows))return {hasCol:false,id:'',blocked:false};
  const hs=Array.isArray(tab.headers)&&tab.headers.length?tab.headers:Object.keys(tab.rows[0]||{});
  const h=hs.find(x=>String(x).toLowerCase().replace(/[^a-z0-9]/g,'')==='rowid');

async function sheetCall(payload,need){
  const url=LS.get('lgUrl');if(!url)throw new Error('nourl');
  /* An older script would treat an edit as a new entry, so it must say it supports edits before anything is sent. */
  const chk=await fetch(url,{cache:'no-store',redirect:'follow'}).then(r=>r.json());
  if(!chk||chk.edit!==true)throw new Error('oldscript');
  if(need&&chk[need]!==true)throw new Error('oldscript');   /* optional: the script must also say it supports this specific action */
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({secret:LS.get('lgSecret')||''},payload)),redirect:'follow'});
  const j=await r.json();if(!j.ok){if(j.error==='auth')mmAuthFail();throw new Error(j.error||'rejected')}return j;
}

  if(m==='oldscript')return 'Your entry script needs the newest version before it can edit or delete rows. Paste the updated script into Apps Script and redeploy it. Nothing was changed.';
  if(m==='row changed')return 'That row has changed in your sheet since this page loaded. Press Refresh, then try again. Nothing was changed.';
  if(m==='row has formulas')return 'That row contains formulas, so it is protected. Delete it directly in Google Sheets. Nothing was changed.';
  if(/tab not allowed/.test(m))return 'That tab is protected, so My Money will not change it. Nothing was changed.';
  if(m==='noid')return 'Run the ID backfill first. Nothing was changed.';
  if(m==='noexpect')return 'Not enough unchanged details on this row to verify it safely. Nothing was changed.';
  if(m==='bad row'||m==='norow')return 'This entry has not reached your sheet yet. Press Refresh and try again. Nothing was changed.';
  if(m==='rejected'||/^expect|^no tab/.test(m))return 'Your sheet refused the change. Nothing was changed.';

}
