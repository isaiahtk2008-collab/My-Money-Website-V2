      .then(function(k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: it }, k, 256); })
      .then(function(bits) { return new Uint8Array(bits); });
  }
  function eq(a, b) {
    if (a.length !== b.length) return false;
    var d = 0;
    for (var i = 0; i < a.length; i++) d |= a[i] ^ b[i];

    try {
      var r = JSON.parse(lsGet(CRED_KEY) || 'null');
      return (r && r.u && r.s && r.h) ? r : null;
    } catch (e) { return null; }
  }

  function waitSecs() {
    var u = parseInt(lsGet(UNTIL_KEY) || '0', 10) || 0;
    return Math.max(0, Math.ceil((u - Date.now()) / 1000));
  }
  function noteFail() {
    var f = (parseInt(lsGet(FAIL_KEY) || '0', 10) || 0) + 1;
    lsSet(FAIL_KEY, String(f));
    if (f >= 5) lsSet(UNTIL_KEY, String(Date.now() + Math.min(900, 30 * Math.pow(2, f - 5)) * 1000));

      return okHash && okUser;

    }).catch(function() { return { ok: false, msg: 'Could not remove. Try again.' }; });

    ssDel('user_authenticated');
    ssDel(METHOD_KEY);
    ssDel('mm.unlocked');
    try { if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); } catch (e) {}

    allowedEmail: ALLOWED_EMAIL,
    hasCreds: hasCreds,
    savedUsername: savedUsername,
    canHash: canHash,
    setCreds: setCreds,

        atob(base64)

        size: 'large',
        shape: 'rectangular',
        text: 'sign_in_with',

    if (p) p.addEventListener('input', clear);
    /* nothing behind the modal should react to keys typed into it */
    var modal = byId('auth-modal');
    if (modal) modal.addEventListener('keydown', function(e) { e.stopPropagation(); });
  }

  document.addEventListener('DOMContentLoaded', function() {
    var isAuth = false;
    try {
      isAuth = sessionStorage.getItem('user_authenticated') === 'true';
    } catch (e) {}

    var modal = byId('auth-modal');
    if (modal) {
      if (isAuth) {
        hideModal();
      } else {
        modal.classList.remove('hidden');
        modal.style.display = 'flex';
        modal.style.pointerEvents = 'auto';
        bindForm();
        ensureGsi();
      }
    }
  });

  window.addEventListener('load', function() {
    try {
      if (sessionStorage.getItem('user_authenticated') !== 'true') {
        bindForm();
        ensureGsi();
      }
    } catch (e) {}
  });
})();
</script>

const num=v=>{if(v==null||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;const s=String(v).replace(/[$,\s]/g,'');return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):null};
const CAT_MAP={'transportation & vehicle':'Transportation','trasportation':'Transportation'};
const TYPE_MAP={'heaphones':'Headphones','wifi adapter':'WiFi Adapter'};
function canonCondition(v){if(!v)return null;const s=String(v).replace(/\s+/g,' ').trim();const l=s.toLowerCase();
  if(/unusable|parts/.test(l))return 'Unusable / Parts';if(/like new/.test(l))return 'Used - Like New';if(/good/.test(l))return 'Used - Good';
  if(/fair/.test(l))return 'Used - Fair';if(/bad|poor/.test(l))return 'Used - Bad';if(/^new/.test(l))return 'New';return s}
function canonRam(v){if(!v)return null;const m=String(v).match(/(\d+)\s*gb/i);return m?m[1]+'GB':String(v).trim()}

function normalize(raw){
  const flags=new Map();
  const flag=(sev,sheet,row,field,msg,fix)=>{const k=[sev,sheet,field,msg].join('|');if(!flags.has(k))flags.set(k,{sev,sheet,field,msg,fix,rows:[]});flags.get(k).rows.push(row)};
  const rowsOf=k=>(raw&&raw[k]&&raw[k].rows)||[];
  const byId=new Map();
  /* ---- expenses ---- */
  const expenses=[];
  rowsOf('Expenses').forEach((r,i)=>{
    const rowN=i+2;let date=pd(r['Date of Purchase']);
    if(!date){date=pd(r['Timestamp']);if(date)flag('warn','Expenses',rowN,'Date of Purchase','Purchase date is missing, so the entry date was used','Fill in the purchase date')}
    if(!date){flag('warn','Expenses',rowN,'Date of Purchase','No date at all, so the row is left out','Add a date to this row');return}
    let amount=num(r['Amount']);
    if(amount==null){flag('warn','Expenses',rowN,'Amount',`Amount "${r['Amount']}" is not a number, so it counts as $0`,'Enter a dollar value (for example, convert points to dollars)');amount=0}
    const rawCat=(r['Category']||'').toString().trim();let category=CAT_MAP[rawCat.toLowerCase()]||rawCat||'Other';
    if(category!==rawCat&&rawCat)flag('fixed','Expenses',rowN,'Category',`Category "${rawCat}" was merged into "${category}"`,'Use one spelling in the sheet dropdown');
    if(category==='Other')flag('info','Expenses',rowN,'Category','Filed under "Other", which hides what the money was for','Pick a specific category');
    const e={id:'e'+i,date,amount,category,item:(r['Item Purchased']||'Untitled').toString().trim(),place:r['Establishment']||null,payment:r['Payment Method']||null,tag:r['Personal or Business Expense?']||null,notes:r['Notes']||null,isRefund:amount<0,row:rowN};
    if(e.isRefund)flag('info','Expenses',rowN,'Amount','Negative amount treated as a refund and kept out of spending totals','Nothing to fix unless it was a typo');
    expenses.push(e);byId.set(e.id,{type:'expense',o:e});
  });
  /* ---- inventory ---- */
  const items=[];
  const defs=[
    {key:'Phones',kind:'Phone',sheet:'Master Inventory',name:r=>(r['Model']||'').trim(),buyDate:'Purchase Date',buyer:'Sold To',seller:'Bought From',notes:r=>r['Notes'],sheetKeys:{status:'Status'}},
    {key:'PCs',kind:'PC',sheet:'PCs',name:r=>(r['PC model']||'').trim(),buyDate:'Purchase Date',buyer:'Sold to',seller:'Bought From',notes:r=>r['Notes (Bought)']},
    {key:'Accessories',kind:'Accessory',sheet:'PnA',name:r=>[r['Brand'],r['Model']].filter(Boolean).map(s=>String(s).trim()).join(' ')||String(r['Item Type']||'Accessory'),buyDate:'Date Purchased',buyer:'Sold To',seller:'Bought From',notes:r=>r['Notes']}
  ];
  defs.forEach(def=>rowsOf(def.key).forEach((r,i)=>{
    const rowN=i+2,sheet=def.sheet;
    const sold=String(r['Status']||'').trim().toUpperCase()==='SOLD';
    const rawCond=r['Condition'];const condition=canonCondition(rawCond);
    if(rawCond&&condition!==String(rawCond).trim())flag('fixed',sheet,rowN,'Condition',`Condition "${String(rawCond).trim()}" was standardised`,'Use the same dropdown wording');
    const it={id:'i'+items.length,kind:def.kind,name:def.name(r)||'Unnamed',label:r['Device Label']||r['Item Label']||null,condition,
      buyPrice:num(r['Purchase Price']),buyDate:pd(r[def.buyDate]),seller:r[def.seller]||null,sold,status:sold?'SOLD':'IN INVENTORY',
      sellPrice:num(r['Sale Price']),sellDate:pd(r['Sale Date']),buyer:r[def.buyer]||null,profit:null,roi:null,days:null,age:null,
      clicks:num(r['Clicks on Listing']),notes:def.notes(r)||r['Notes (Sold)']||r['Sale Notes']||null,specs:{},row:rowN,sheet};
    if(def.kind==='Phone'){it.specs={Color:r['Color'],Storage:r['Storage (GB)'],'Original box':r['Original Box'],Case:r['Case'],Charger:r['Charger'],IMEI:r['IMEI']}}
    if(def.kind==='PC'){const ram=canonRam(r['RAM']);if(r['RAM']&&ram!==String(r['RAM']).trim())flag('fixed',sheet,rowN,'RAM',`RAM "${String(r['RAM']).trim()}" was standardised to ${ram}`,'Use values like 16GB');
      it.specs={Color:r['Color'],RAM:ram,CPU:r['CPU (and specs)'],GPU:[r['GPU 1 (and specs)'],r['GPU 2 (and specs)']].filter(Boolean).join(' + '),Storage:r['Storage (SSD, HDD or NVME)'],Screen:r['Screen Size / Hertz'],'Original charger':r['Original Charger']}}
    if(def.kind==='Accessory'){const t=String(r['Item Type']||'').trim();const tt=TYPE_MAP[t.toLowerCase()]||t;if(tt!==t)flag('fixed',sheet,rowN,'Item Type',`Type "${t}" was corrected to "${tt}"`,'Fix the spelling');
      it.type=tt;it.specs={Type:tt,Color:r['Color'],Specs:r['Specs'],Connection:r['Connection Type'],Included:r['Included Accessories']}}
    if(it.sold&&it.sellPrice!=null&&it.buyPrice!=null){it.profit=it.sellPrice-it.buyPrice;it.roi=it.buyPrice?it.profit/it.buyPrice:null}
    else if(it.sold){it.profit=num(r['Profit']);it.roi=num(r['ROI%']??r['ROI']??r['ROI %'])}
    if(it.sold){
      it.days=(it.sellDate&&it.buyDate)?diffD(it.buyDate,it.sellDate):num(r['Days Held']);
      if(!it.sellDate)flag('warn',sheet,rowN,'Sale Date','Marked sold but has no sale date, so it is left out of date-range stats','Add the sale date');
      if(it.sellPrice==null)flag('warn',sheet,rowN,'Sale Price','Marked sold but has no sale price, so profit is unknown','Add the sale price');
      if(!it.buyer)flag('info',sheet,rowN,'Sold To','No buyer name recorded','Add the buyer if you want repeat-buyer stats');
      if(it.sellDate&&it.buyDate&&it.sellDate<it.buyDate)flag('warn',sheet,rowN,'Sale Date','Sale date is before the purchase date','Check both dates');
    }else{
      if(it.buyDate)it.age=diffD(it.buyDate,TODAY);
      if(it.sellPrice!=null||it.sellDate)flag('warn',sheet,rowN,'Status','Has a sale price or date but is still marked IN INVENTORY','Update the status or clear the sale fields');
    }
    if(it.buyPrice==null)flag('warn',sheet,rowN,'Purchase Price','No purchase price, so profit cannot be calculated','Add the purchase price');
    items.push(it);byId.set(it.id,{type:'item',o:it});
  }));
  /* ---- investments ---- */
  const investments=rowsOf('Investments').map((r,i)=>{
    const o={id:'v'+i,date:pd(r['Date'])||pd(r['Timestamp']),portfolio:(r['Investment Type']||'Other').toString().trim(),value:num(r['Total Portfolio Value']),pct:num(r['Percentage (All-Time)']),flow:num(r['Amount Added / Subtracted'])||0,notes:r['Notes']||null,type:r['Transaction Type']||null,row:i+2};

    byId.set(o.id,{type:'invest',o});return o}).filter(x=>x.date).sort((a,b)=>a.date-b.date);
  const issues=[...flags.values()].sort((a,b)=>({warn:0,info:1,fixed:2}[a.sev]-{warn:0,info:1,fixed:2}[b.sev]));
  const counts={Expenses:expenses.length,Phones:rowsOf('Phones').length,PCs:rowsOf('PCs').length,Accessories:rowsOf('Accessories').length,Investments:investments.length};
  return {expenses,items,investments,issues,counts,byId};
}

/* Reads through your Apps Script link first (works even if the sheet is private), then falls back to the public sheet feed. */
async function loadViaScript(url,tabs){
  const sec=LS.get('lgSecret')||'';
  const res=await fetch(url+(url.includes('?')?'&':'?')+'action=read&secret='+encodeURIComponent(sec)+'&_='+Date.now(),{redirect:'follow'});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const j=await res.json();
  if(!j||!j.ok)throw new Error((j&&j.error)||'script');
  if(!j.tabs)throw new Error('old script');
  const out={};
  for(const key of Object.keys(tabs)){const t=j.tabs[key];if(!t||t.missing||!Array.isArray(t.rows))throw new Error('tab '+tabs[key]);out[key]={sheet:t.sheet||tabs[key],headers:t.headers||[],rows:t.rows}}
  return out}
function GoogleSheetSource(sheetId,tabs=TABS){
  return {name:'Google Sheet',kind:'google',sheetId,async load(){
    const sUrl=LS.get('lgUrl');
    if(sUrl){try{return await loadViaScript(sUrl,tabs)}catch(e){if(!sheetId)throw e}}
    if(!sheetId)throw new Error('no source');
    const out={};
    for(const [key,tab] of Object.entries(tabs)){
      const res=await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`);
      if(!res.ok)throw new Error('HTTP '+res.status);
      const txt=await res.text();const m=txt.match(/setResponse\(([\s\S]*)\);?\s*$/);if(!m)throw new Error('private');
      const j=JSON.parse(m[1]);if(j.status==='error')throw new Error('private');
      const headers=j.table.cols.map(c=>(c.label||'').trim());
      const rows=j.table.rows.map(r=>{const o={};headers.forEach((h,i)=>{if(!h)return;const c=r.c&&r.c[i];let v=c?c.v:null;
        if(typeof v==='string'){const dm=v.match(/^Date\((\d+),(\d+),(\d+)/);if(dm)v=dm[1]+'-'+String(+dm[2]+1).padStart(2,'0')+'-'+String(+dm[3]).padStart(2,'0');else{v=v.trim();if(v===''||v==='-'||v==='N/A')v=null}}
        o[h]=v});return o});
      out[key]={sheet:tab,headers,rows};
    }
    return out}};
}

function resolveRange(S){
  const end=TODAY;let start;const y=TODAY.getFullYear(),m=TODAY.getMonth();
  const D=store.D;const allDates=[...D.expenses.map(e=>e.date),...D.items.flatMap(i=>[i.buyDate,i.sellDate]).filter(Boolean)];
  const first=allDates.length?new Date(Math.min(...allDates)):addD(TODAY,-364);
  switch(S.range){case'month':start=new Date(y,m,1);break;
    case'today':start=TODAY;break;
    case'wtd':start=addD(TODAY,-((TODAY.getDay()+6)%7));break;
    case'30d':start=addD(end,-29);break;case'90d':start=addD(end,-89);break;
    case'ytd':start=new Date(y,0,1);break;case'12m':start=addD(end,-364);break;case'all':start=first;break;
    case'custom':{const a=pd(S.cs),b=pd(S.ce);start=a||addD(end,-29);if(b)return mk(start,b);break}default:start=addD(end,-89)}
  return mk(start,end);
  function mk(s,e){const len=diffD(s,e)+1;return{start:s,end:e,len,pStart:addD(s,-len),pEnd:addD(s,-1)}}
}
const inR=(d,a,b)=>d&&d>=a&&d<=b;
function bucketsFor(R,gran,shift=false){
  const out=[];let s=shift?R.pStart:R.start;const e=shift?R.pEnd:R.end;
  if(gran==='week'){const wd=(s.getDay()+6)%7;s=addD(s,-wd)}
  if(gran==='month')s=new Date(s.getFullYear(),s.getMonth(),1);
  while(s<=e&&out.length<500){let n;
    if(gran==='day')n=addD(s,1);else if(gran==='week')n=addD(s,7);else n=new Date(s.getFullYear(),s.getMonth()+1,1);
    out.push({s,e:addD(n,-1),label:gran==='month'?MO[s.getMonth()]+(s.getMonth()===0?" '"+String(s.getFullYear()).slice(2):''):fd(s)});s=n}
  return out;
}
function autoGran(R){return R.len<=45?'day':R.len<=200?'week':'month'}

function spendRows(D,R,F,skip){

function tally(rows,keyf,valf=r=>r.amount){const m=new Map();rows.forEach(r=>{const k=keyf(r)||'—';const o=m.get(k)||{k,v:0,n:0};o.v+=valf(r);o.n++;m.set(k,o)});return [...m.values()].sort((a,b)=>b.v-a.v)}
function spendingStats(D,R,F,gran){
  const rows=spendRows(D,R,F);const prevRows=spendRows(D,{start:R.pStart,end:R.pEnd},F);
  const total=sum(rows,r=>r.amount),prevTotal=sum(prevRows,r=>r.amount);
  const refunds=D.expenses.filter(e=>e.isRefund&&inR(e.date,R.start,R.end));
  const B=bucketsFor(R,gran),PB=bucketsFor(R,gran,true);
  const cur=B.map(b=>sum(rows.filter(r=>r.date>=b.s&&r.date<=b.e),r=>r.amount));
  const off=R.len;
  const prev=B.map(b=>sum(D.expenses.filter(e=>!e.isRefund&&e.date>=addD(b.s,-off)&&e.date<=addD(b.e,-off)&&(!F.cat||e.category===F.cat)&&(!F.pay||e.payment===F.pay)&&(!F.tag||(e.tag||'Untagged')===F.tag)&&(!F.place||e.place===F.place)),r=>r.amount));

  const biggest=rows.reduce((a,r)=>!a||r.amount>a.amount?r:a,null);

  return{rows,total,prevTotal,days:R.len,perDay:total/R.len,count:rows.length,prevCount:prevRows.length,biggest,refunds,refundTotal:-sum(refunds,r=>r.amount),
    buckets:B,cur,prev,dow,freq,

    pays:tally(spendRows(D,R,F,'pay'),r=>r.payment),tags:tally(spendRows(D,R,F,'tag'),r=>r.tag||'Untagged'),

  const kinds=['Phone','PC','Accessory'].map(k=>{const g=sold.filter(i=>i.kind===k);return{k,n:g.length,tot:sum(g,i=>i.profit),avg:avg(g,i=>i.profit)}});
  const bw=[...sold].sort((a,b)=>b.profit-a.profit);

    sellThrough:all.length?allSold/all.length:null,win:sold.length?sold.filter(i=>i.profit>0).length/sold.length:null,spark:perB,cum,buckets:B,months,perM,lead,src,cond,kinds,best:bw.slice(0,5),worst:bw.slice(Math.max(5,bw.length-5)).reverse()};

function inventoryStats(D){

function investingStats(D){
  const P=[...groupBy(D.investments,i=>i.portfolio).entries()].map(([name,es])=>{
    const withV=es.filter(e=>e.value!=null);const last=withV[withV.length-1]||null;const flow=sum(es,e=>e.flow);
    return{name,entries:es,series:withV.map(e=>({x:e.date,y:e.value})),last,value:last?last.value:0,contrib:flow,gain:last?last.value-flow:null,ret:last&&flow?(last.value-flow)/flow:null,updated:last?last.date:null};
  }).sort((a,b)=>b.value-a.value);

function spark(arr){
  if(!arr||arr.length<2)return '<span class="spark"></span>';
  const mn=Math.min(...arr),mx=Math.max(...arr),rg=(mx-mn)||1;
  const pts=arr.map((v,i)=>[i/(arr.length-1)*96+2,24-((v-mn)/rg)*20]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 100 28" aria-hidden="true"><polygon points="2,26 ${line} 98,26" fill="var(--accent)" opacity=".12"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${l[0]}" cy="${l[1]}" r="2.6" fill="var(--accent)"/></svg>`;
}
function deltaChip(d,inverse){
  if(d===undefined)return '';

  if(Math.abs(d)<.005)return '<span class="chip">no change</span>';
  const up=d>0,good=inverse?!up:up;

}

}

function tableRows(id){

  if(st.q){const q=st.q.toLowerCase().split(/\s+/).filter(Boolean);rows=rows.filter(r=>{const t=cfg.text(r).toLowerCase();return q.every(w=>t.includes(w))})}

/* ================= EDIT / DELETE ONE SHEET ROW (Expenses) =================
   Writes go only through your entry script, one row at a time. The script re-checks that the row still holds the same
   item, amount and date before it changes anything, and it refuses protected tabs and rows that contain formulas. */
const isoDay=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let rowBusy=false;
const rowFootHtml=o=>`<div class="dfoot"><button type="button" class="btn danger" data-act="rowdel" data-id="${esc(o.id)}">Delete</button><button type="button" class="btn" data-act="rowedit" data-id="${esc(o.id)}">Edit</button></div>`;
/* What the sheet returned for this row when the page last loaded it. The script compares this with the live row first. */
function rowExpect(o){
  const base=store.base||store.raw,r=base&&base.Expenses&&base.Expenses.rows[o.row-2];
  if(!r||!Number.isInteger(o.row)||o.row<2)return null;
  return {'Item Purchased':r['Item Purchased']??null,'Amount':r['Amount']??null,'Date of Purchase':r['Date of Purchase']??null};
}
async function sheetCall(payload){
  const url=LS.get('lgUrl');if(!url)throw new Error('nourl');
  /* An older script would treat an edit as a new entry, so it must say it supports edits before anything is sent. */
  const chk=await fetch(url,{cache:'no-store',redirect:'follow'}).then(r=>r.json());
  if(!chk||chk.edit!==true)throw new Error('oldscript');
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({secret:LS.get('lgSecret')||''},payload)),redirect:'follow'});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'rejected');return j;
}
function rowErrText(e){
  const m=(e&&e.message)||'';
  if(m==='nourl')return 'Save your entry script link first (Log, then Sheet connection).';
  if(m==='oldscript')return 'Your entry script needs the newest version before it can edit or delete rows. Paste the updated script into Apps Script and redeploy it. Nothing was changed.';
  if(m==='row changed')return 'That row has changed in your sheet since this page loaded. Press Refresh, then try again. Nothing was changed.';
  if(m==='row has formulas')return 'That row contains formulas, so it is protected. Delete it directly in Google Sheets. Nothing was changed.';
  if(/tab not allowed/.test(m))return 'That tab is protected, so My Money will not change it. Nothing was changed.';
  if(m==='bad row'||m==='norow')return 'This entry has not reached your sheet yet. Press Refresh and try again. Nothing was changed.';
  if(m==='rejected'||/^expect|^no tab/.test(m))return 'Your sheet refused the change. Nothing was changed.';
  return 'Could not confirm with your sheet. Press Refresh to see whether the change went through.';
}
function rowShowErr(e){const n=$('#ed-msg');const t=rowErrText(e);if(n){n.textContent=t;n.hidden=false}else toast(t)}
function rowSetBusy(on){rowBusy=on;$$('#overlay button').forEach(b=>{b.disabled=on})}
/* Keep every screen in step straight away: patch the copy of the sheet the page holds, then quietly re-read the live sheet. */
function patchExpenses(mut){
  const base=store.base||store.raw;
  const raw=Object.assign({},base,{Expenses:Object.assign({},base.Expenses,{rows:base.Expenses.rows.map(r=>Object.assign({},r))})});
  mut(raw.Expenses.rows);store.set(raw);
}
function syncSoon(){if(store.source&&store.source.kind==='google')setTimeout(()=>{store.load(store.source).catch(()=>{})},1500)}

async function deleteRowGo(id){
  if(rowBusy)return;const rec=store.D.byId.get(id);if(!rec||rec.type!=='expense')return;const o=rec.o,ex=rowExpect(o);

async function saveRowEdit(id){
  if(rowBusy)return;const rec=store.D.byId.get(id);if(!rec||rec.type!=='expense')return;const o=rec.o;
  const g=k=>{const el=$('#'+k);return el?el.value:''};
  const amt=num(g('ed-amt')),date=g('ed-date'),where=g('ed-where').trim(),pay=g('ed-pay'),cat=g('ed-cat'),type=g('ed-type');
  let bad=false;
  const err=(k,m)=>{const w=$('[data-ed="'+k+'"]');if(!w)return;w.classList.toggle('bad',!!m);const x=$('.ed-err',w);x.textContent=m||'';x.hidden=!m;if(m)bad=true};
  err('Amount',amt==null?'Enter a number':'');

  const ch={};
  if(amt!==o.amount)ch['Amount']=amt;
  if(date!==isoDay(o.date))ch['Date of Purchase']={$date:date};
  if(where!==(o.place||''))ch['Establishment']=where;
  if(pay!==(o.payment||''))ch['Payment Method']=pay;
  if(cat!==o.category)ch['Category']=cat;
  if(type!==(o.tag||''))ch['Personal or Business Expense?']=type;
  if(!Object.keys(ch).length){toast('No changes to save');return}
  const ex=rowExpect(o);if(!ex){rowShowErr(new Error('norow'));return}
  rowSetBusy(true);
  try{
    await sheetCall({action:'edit',target:'Expenses',row:o.row,expect:ex,changes:ch});
    patchExpenses(rows=>{const r=rows[o.row-2];if(!r)return;
      if('Amount' in ch)r['Amount']=ch['Amount'];
      if('Date of Purchase' in ch)r['Date of Purchase']=ch['Date of Purchase'].$date;
      ['Establishment','Payment Method','Category','Personal or Business Expense?'].forEach(k=>{if(k in ch)r[k]=ch[k]||null})});
    closeOverlay();toast('Saved to your sheet');syncSoon();
  }catch(e){rowShowErr(e)}finally{rowSetBusy(false)}
}

function insightsLegacy(D,R,ss,rs){
  const out=[];

  if(ch)out.push({i:'spend',t:`<b>${esc(ch.k)}</b> is ${ch.d>0?'up':'down'} ${Math.abs(ch.d*100).toFixed(0)}% on the previous ${plural(R.len,'day')} (${SM(ch.cur-ch.prev)}).`,act:'goto',v:'spending',k:'cat',x:ch.k});
  const sold=D.items.filter(i=>i.sold&&i.days!=null);
  const byK=['Phone','PC','Accessory'].map(k=>({k,n:sold.filter(i=>i.kind===k).length,d:avg(sold.filter(i=>i.kind===k),i=>i.days)})).filter(x=>x.n>=3&&x.d!=null).sort((a,b)=>a.d-b.d);
  if(byK.length>=2)out.push({i:'clock',t:`<b>${kindWord(byK[0].k)}</b> sell in ${Math.round(byK[0].d)} days on average. <b>${kindWord(byK[byK.length-1].k)}</b> take ${Math.round(byK[byK.length-1].d)}.`,act:'goto',v:'reselling'});
  const flips=D.items.filter(i=>i.sold&&i.profit!=null).sort((a,b)=>b.profit-a.profit);
  if(flips.length)out.push({i:'up',t:`Best flip so far: <b>${esc(flips[0].name)}</b> for ${SM(flips[0].profit)}${flips[0].days!=null?' in '+plural(flips[0].days,'day'):''}.`,act:'open',id:flips[0].id});
  const src=[...groupBy(flips.filter(i=>i.seller),i=>i.seller.toLowerCase()).values()].map(g=>({k:g[0].seller,n:g.length,t:sum(g,i=>i.profit)})).filter(x=>x.n>=2).sort((a,b)=>b.t-a.t)[0];
  if(src)out.push({i:'user',t:`Top source: <b>${esc(src.k)}</b>, ${plural(src.n,'deal')} for ${SM(src.t)} profit.`,act:'goto',v:'reselling'});
  const old=D.items.filter(i=>!i.sold&&i.age!=null).sort((a,b)=>b.age-a.age)[0];
  if(old&&old.age>30)out.push({i:'alert',t:`<b>${esc(old.name)}</b> has been in stock ${old.age} days. Consider lowering the price.`,act:'open',id:old.id});

  return out.slice(0,6);
}
function attention(D){

}

/* ---------- Monthly burn rate (read-only) ---------- */
function burnCard(){
  try{
    const ex=store.D.expenses.filter(e=>e.date&&!e.isRefund&&e.amount>0);
    const y=TODAY.getFullYear(),m=TODAY.getMonth(),dom=TODAY.getDate(),dim=new Date(y,m+1,0).getDate();
    const inM=(e,yy,mm)=>e.date.getFullYear()===yy&&e.date.getMonth()===mm;
    const mtd=sum(ex.filter(e=>inM(e,y,m)&&e.date.getDate()<=dom),e=>e.amount);
    const hist=[1,2,3].map(p=>{const d=new Date(y,m-p,1),yy=d.getFullYear(),mm=d.getMonth();
      return{full:sum(ex.filter(e=>inM(e,yy,mm)),e=>e.amount),to:sum(ex.filter(e=>inM(e,yy,mm)&&e.date.getDate()<=dom),e=>e.amount)}}).filter(h=>h.full>0);
    const mname=MO[m];
    if(!hist.length)return card('Spending this month',`<div class="burn"><div class="big">${M(mtd)}</div><p class="hint" style="color:var(--muted)">Not enough earlier months yet to compare against.</p></div>`);
    const aFull=avg(hist,h=>h.full),aTo=avg(hist,h=>h.to),proj=mtd/dom*dim;
    const pace=aTo>0?mtd/aTo:null,fill=Math.min(100,mtd/aFull*100),tick=Math.min(100,aTo/aFull*100),over=mtd>aTo;
    return card('Spending this month',`<div class="burn"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><span class="big">${M(mtd)}</span><span class="hint" style="color:var(--muted)">${pace==null?'':pct(pace)+' of your usual pace for '+mname+' '+dom}</span></div>
      <div class="track" role="img" aria-label="${esc(mname)} spending so far is ${mny(mtd)} against a typical ${mny(aFull)} for the whole month"><i class="${over?'over':''}" style="width:${fill.toFixed(1)}%"></i><b style="left:calc(${tick.toFixed(1)}% - 1px)" title="Typical spend by this day"></b></div>
      <div class="meta"><span>Typical by today: ${M(aTo)}</span><span>On track for ${M(proj)}</span><span>Usual full month: ${M(aFull)}</span></div></div>`,`<span class="hint">vs your last ${plural(hist.length,'month')}</span>`);
  }catch(e){return ''}
}

/* Data health helpers: clickable ring segments, filter chips, and a READ-ONLY fix menu (never writes to the Sheet). */
function dhSegmentsSvg(warn,info,fixed,active){
  const total=warn+info+fixed;if(!total)return '';
  const C=2*Math.PI*33;let off=0;
  return [{key:'warn',n:warn,color:'var(--warn)',label:'to-fix issues'},{key:'info',n:info,color:'var(--accent)',label:'notes'},{key:'fixed',n:fixed,color:'var(--good)',label:'auto-cleaned issues'}].map(g=>{
    if(!g.n)return '';
    const share=C*g.n/total,len=Math.max(0.5,share-2),o=off;off+=share;const t=`Show ${g.n} ${g.label}`;
    return `<circle class="dh-seg${active===g.key?' on':''}" cx="50" cy="50" r="33" fill="none" stroke="${g.color}" stroke-width="5" transform="rotate(-90 50 50)" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-o).toFixed(2)}" data-act="dhfilter" data-f="${g.key}" tabindex="0" role="button" aria-label="${t}"><title>${t}</title></circle>`}).join('')}
function dhChipsHtml(warn,info,fixed,active){
  const c=(f,l,n)=>`<button type="button" class="dh-chip${active===f?' on':''}" data-act="dhfilter" data-f="${f}" aria-pressed="${active===f}"><i></i>${l}${n==null?'':' ('+n+')'}</button>`;
  return `<div class="dh-status">${c('all','All',warn+info+fixed)}${c('warn','To fix',warn)}${c('info','Notes',info)}${c('fixed','Auto-cleaned',fixed)}</div>`}
const issueMatches=(sev,f)=>!f||f==='all'||f===sev;

/* Data health ring: SVG so the arc can animate; same score and colours as before. */
function dhHtml(score,col,warn,info,fixed){
  const s=Math.max(0,Math.min(100,Math.round(score))),C=2*Math.PI*42,off=C*(1-s/100);

      <circle class="dh-arc${still?' still':''}" cx="50" cy="50" r="42" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" transform="rotate(-90 50 50)" style="--dh-c:${C.toFixed(2)};--dh-o:${off.toFixed(2)}"/>

        <button type="button" class="dh-stat${S.dhf==='info'?' on':''}" data-act="dhfilter" data-f="info" aria-pressed="${S.dhf==='info'}"><div class="dh-n">${info}</div><div class="dh-l">Notes</div></button>
        <button type="button" class="dh-stat${fixed>0?' good':''}${S.dhf==='fixed'?' on':''}" data-act="dhfilter" data-f="fixed" aria-pressed="${S.dhf==='fixed'}"><div class="dh-n">${fixed}</div><div class="dh-l">Auto-cleaned</div></button>

async function send(item){

/* ---------- Show new entries immediately ----------
   A sent entry is kept in a small on-device overlay and merged into what every screen reads, until the sheet itself
   returns a matching row. This never writes to the sheet. The sheet refresh then retries a few times (Google can
   take a while to show a new row) and always skips Google's cache. */
const OVL_KEY='lg.overlay',OVL_TABS={'Expenses':'Expenses','Investment Tracking Sheet':'Investments'};
const OVL_FIELDS={Expenses:['Item Purchased','Amount','Date of Purchase'],Investments:['Investment Type','Total Portfolio Value','Date']};
const ovlRead=()=>{const a=J(OVL_KEY,[]);return Array.isArray(a)?a:[]};
const ovlStr=v=>String(v==null?'':v).trim();
const ovlSame=(a,b)=>{const x=ovlStr(a),y=ovlStr(b),nx=parseFloat(x.replace(/[$,]/g,'')),ny=parseFloat(y.replace(/[$,]/g,''));return x===y||(!isNaN(nx)&&nx===ny)};
function ovlHit(key,r,o){const f=OVL_FIELDS[key];
  if(!ovlSame(r[f[0]],o[f[0]])||!ovlSame(r[f[1]],o[f[1]]))return false;
  const a=ovlStr(r[f[2]]).slice(0,10),b=ovlStr(o[f[2]]).slice(0,10),iso=/^\d{4}-\d{2}-\d{2}$/;
  return !(iso.test(a)&&iso.test(b))||a===b}
const ovlSig=e=>{const f=OVL_FIELDS[e.key],a=ovlStr(e.row[f[1]]).replace(/[$,]/g,'');return e.key+'|'+ovlStr(e.row[f[0]]).toLowerCase()+'|'+(parseFloat(a)||a)+'|'+ovlStr(e.row[f[2]]).slice(0,10)};
const ovlCount=(raw,key,row)=>{const t=raw&&raw[key];return t&&Array.isArray(t.rows)?t.rows.filter(r=>ovlHit(key,r,row)).length:0};
/* An entry counts as synced once the sheet holds more matching rows than it did when the entry was added
   (so a second identical expense still shows until the sheet really has both). */
function ovlMerge(raw){
  const now=Date.now(),keep=[],out=Object.assign({},raw),copied={},rank={};
  ovlRead().forEach(e=>{
    if(!e||!e.row||!(now-e.ts<864e5))return;
    const t=raw&&raw[e.key];
    if(!t||!Array.isArray(t.rows)){keep.push(e);return}
    const s=ovlSig(e),k=rank[s]||0;rank[s]=k+1;
    if(ovlCount(raw,e.key,e.row)>=(e.pre||0)+k+1)return;
    if(!copied[e.key]){out[e.key]=Object.assign({},t,{rows:t.rows.slice()});copied[e.key]=1}
    out[e.key].rows.push(e.row);keep.push(e)});
  return {raw:out,keep}}
const _storeSet=store.set.bind(store);
store.set=function(raw,source){store.base=raw;const m=ovlMerge(raw);if(m.keep.length!==ovlRead().length)W(OVL_KEY,m.keep);return _storeSet(m.raw,source)};
function addOverlay(it){try{const key=OVL_TABS[it.tab];if(!key||!it.values)return;
  const b=store.base||store.raw;if(b)W(OVL_KEY,ovlMerge(b).keep);   /* settle anything the sheet already returned first */
  const a=ovlRead();if(a.some(e=>e.id===it.id))return;
  const row={};Object.keys(it.values).forEach(k=>{const v=it.values[k];row[k]=v&&typeof v==='object'&&v.$date?v.$date:v});row.Timestamp=new Date().toISOString();
  a.push({id:it.id,key,row,pre:b?ovlCount(b,key,row):0,ts:Date.now()});W(OVL_KEY,a);
  if(b)store.set(b,store.source)}catch(e){}}
let rfBusy=false;
async function refreshAfterSend(){
  if(rfBusy)return;rfBusy=true;let tries=0,fails=0;
  try{
    const sid=LS.get('sheetId');
    const src=store.source&&store.source.kind==='google'?store.source:((sid||LS.get('lgUrl'))?GoogleSheetSource(sid||''):null);
    if(!src)return;
    const pending=ovlRead().length>0;
    for(const d of [3000,8000,20000,45000]){
      await new Promise(r=>setTimeout(r,d));tries++;
      try{await store.load(src);if(pending&&!ovlRead().length)return}catch(e){fails++}}
    if(tries&&fails===tries)toast('Saved. Could not refresh from Google yet, showing your new entry from this device.')
  }finally{rfBusy=false}}
function afterSend(){try{refreshAfterSend()}catch(e){}}
async function flush(silent){
  const url=LS.get('lgUrl');const q=J('lg.q',[]);if(!url||!q.length||flushing||navigator.onLine===false)return 0;
  flushing=true;let sent=0;const keep=[];
  for(let n=0;n<q.length;n++){const it=q[n];
    try{await send(it);sent++;addOverlay(it)}catch(e){it.err=e&&e.fatal?e.message:null;keep.push(it);if(!(e&&e.fatal)){keep.push(...q.slice(n+1));break}}}
  W('lg.q',keep);flushing=false;badge();
  if(sent){afterSend();if(!silent)toast(sent===1?'Sent 1 waiting entry':`Sent ${sent} waiting entries`)}
  return sent}

  show(`<div class="lg-top"><span></span>${xbtn()}</div><div class="lg-done"><div class="ok ${w?'w':''}">${ok?'✓':st==='unsure'?'✓':'•'}</div><h2>${st==='queued'?'Saved':'Logged'}</h2><p>${msg}</p>

function backupDue(){try{
  const now=Date.now();if(bkNum('bk.snooze')>now)return false;
  const ch=bkNum('bk.n'),last=bkNum('bk.last'),age=last?(now-last)/864e5:0,q=qn();
  return ch>=10||(q>0&&age>7)||(ch>=1&&age>30)}catch(e){return false}}

  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-money-backup-'+new Date().toISOString().slice(0,10)+'.json';

  LS.set('bk.last',String(Date.now()));LS.set('bk.n','0');LS.set('bk.snooze','0');removeBackupBanner();toast('Backup downloaded')}catch(e){}}

/* ================= WEEKLY CONTRIBUTION REMINDER (in-app only; device-local; never touches the sheet or network) ================= */
(()=>{try{
/* NOTIF-CORE-START */
const NOTIF_DEFAULTS={enabled:false,day:4,time:'17:00'};   // day = JS getDay(): 0=Sun..6=Sat, 4=Thursday

function notifNormalize(raw) {
  const r = (raw && typeof raw === 'object') ? raw : {};
  return {
    enabled: r.enabled === true,
    day: (Number.isInteger(r.day) && r.day >= 0 && r.day <= 6) ? r.day : NOTIF_DEFAULTS.day,
    time: (typeof r.time === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(r.time)) ? r.time : NOTIF_DEFAULTS.time
  };
}

function notifWeekKey(now) {
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function notifDue(cfg, now, lastShownWeek, lastDismissedWeek) {
  if (!cfg.enabled) return false;
  const order = x => (x + 6) % 7;
  const nowOrder = order(now.getDay());
  const cfgOrder = order(cfg.day);
  const mins = now.getHours() * 60 + now.getMinutes();
  const [hh, mm] = cfg.time.split(':').map(Number);
  const cfgMins = hh * 60 + mm;
  const dayReached = nowOrder > cfgOrder || (nowOrder === cfgOrder && mins >= cfgMins);
  return dayReached && notifWeekKey(now) !== lastDismissedWeek;
}
/* NOTIF-CORE-END */

function notifLoad(){ try{ return notifNormalize(JSON.parse(localStorage.getItem('mm.notif'))) }catch(e){ return notifNormalize(null) } }
function notifSave(cfg){ try{ localStorage.setItem('mm.notif',JSON.stringify(notifNormalize(cfg))) }catch(e){} }
function notifDismissedWeek(){ try{ return localStorage.getItem('mm.notif.dismissed')||'' }catch(e){ return '' } }

function notifSettingsHtml(){ const c=notifLoad();
  const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  return `
<section class="m3-card">
  <div class="m3-card-head"><span class="m3-icon" aria-hidden="true">notifications</span><div><div class="m3-card-title">In-App Reminders</div><div class="m3-card-sub">Weekly contribution reminder. Shown inside the app while it is open. Default Thursday at 5:00 PM. Stays on this device.</div></div></div>
  <div class="m3-row"><div><b>Weekly contribution reminder</b><small style="display:block">Show a banner when it is time</small></div><label><input type="checkbox" id="notif-on" ${c.enabled?'checked':''}> On</label></div>
  <div class="lg-f"><label class="lg-l" for="notif-day">Day</label><select class="lg-set" id="notif-day">${days.map((day, index) => `<option value="${index}" ${index===c.day?'selected':''}>${day}</option>`).join('')}</select></div>
  <div class="lg-f"><label class="lg-l" for="notif-time">Time</label><input type="time" class="lg-set" id="notif-time" value="${c.time}"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn sec" data-notif="test">Preview reminder</button></div>
</section>
  `;
}
function notifShowBanner(preview){
  let b=document.getElementById('notif-banner');
  if(!b){
    b=document.createElement('div');
    b.id='notif-banner';
    b.setAttribute('role','status');
    b.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:9998;max-width:340px;padding:14px 16px;border-radius:14px;border:1px solid var(--line,#2a303b);background:var(--surface,#14181f);color:var(--ink,#e9ecf1);box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:14px;line-height:1.4';
    b.innerHTML = '<div style="margin-bottom:10px"><b>Contribution reminder</b><br>Time to make this week\'s investment contribution.</div><button type="button" class="btn sec" data-notif="dismiss">Dismiss</button>';
    document.body.appendChild(b);
  }
  b.dataset.preview=preview?'1':'';
}
function notifHideBanner(){ const b=document.getElementById('notif-banner'); if(b) b.remove(); }

function notifCheck(){ try{ if(notifDue(notifLoad(),new Date(),'',notifDismissedWeek())) notifShowBanner(false); else if(!notifLoad().enabled){ const b=document.getElementById('notif-banner'); if(b&&!b.dataset.preview) notifHideBanner(); } }catch(e){} }

document.addEventListener('change',e=>{ try{ const t=e.target; if(!t||!t.id) return; if(t.id!=='notif-on'&&t.id!=='notif-day'&&t.id!=='notif-time') return;
  const c=notifLoad(); if(t.id==='notif-on') c.enabled=t.checked; if(t.id==='notif-day') c.day=Number(t.value); if(t.id==='notif-time') c.time=t.value; notifSave(c); try{ localStorage.removeItem('mm.notif.dismissed') }catch(e2){} notifCheck(); }catch(err){} });
document.addEventListener('click',e=>{ try{ const t=e.target&&e.target.closest?e.target.closest('[data-notif]'):null; if(!t) return;
  if(t.dataset.notif==='test') notifShowBanner(true);
  if(t.dataset.notif==='dismiss'){ const b=document.getElementById('notif-banner'); if(!(b&&b.dataset.preview)){ try{ localStorage.setItem('mm.notif.dismissed',notifWeekKey(new Date())) }catch(e2){} } notifHideBanner(); } }catch(err){} });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) notifCheck(); });
setTimeout(notifCheck,3000); setInterval(notifCheck,60000);
window.__mmNotifSettingsHtml=notifSettingsHtml;
}catch(err){console.error('Reminder module failed to start (site unaffected):',err)}})();

setTimeout(()=>flush(true),2500);
setInterval(()=>{if(qn()&&!document.hidden)flush(true)},60000);
}catch(err){console.error('Log module failed to start (site unaffected):',err)}
})();
</script>
