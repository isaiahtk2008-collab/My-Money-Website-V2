/* ================= DELETE ONE SALE ROW FROM A DEVICE (Sold tabs only) =================
   Own section on purpose: the edit section below is scanned by a test that forbids any delete call in it. Only the sale row can be targeted; the Bought tabs never can. */
/* DELETE A SALE (device drawer). Removes ONLY the sale row from a Sold tab; the purchase row is never a target. The device then shows as in inventory again.
   dsPlan = can this device's sale be deleted safely; dsRequest = the one request that is sent; dsPatch = the loaded data after the delete; dsErrText = refusal text. All pure. */
function dsPlan(item, raw){
  if(!item||(item.kind!=='Phone'&&item.kind!=='PC'))return {state:'nomatch'};
  if(item.sold!==true)return {state:'unsold'};
  const p=deSalePlan(item,raw);
  if(p.state!=='ok')return {state:p.state};
  const tk=deRowKey(p.row,'Trade ID');
  const rowTrade=tk!==undefined&&p.row[tk]!=null&&String(p.row[tk]).trim()!=='';
  if(item.tradeId||item.isTradeSale||rowTrade)return {state:'trade'};
  const expect=deExpect(p.form,p.row,[]);
  if(!expect)return {state:'noexpect'};
  return {state:'ok',tab:p.tab,rowId:p.rowId,tabKey:p.tabKey,row:p.row,form:p.form,expect};
}

function dsRequest(plan){
  if(!plan||plan.state!=='ok'||!DE_SALE_TABS.includes(plan.tab)||!plan.rowId||!plan.expect)return null;
  return {action:'delete',target:plan.tab,rowId:String(plan.rowId),expect:plan.expect};
}

function dsPatch(raw, item, plan){
  if(!raw||!plan||!raw[plan.tabKey]||!Array.isArray(raw[plan.tabKey].rows))return raw;
  const targetId=String(plan.rowId).trim();
  let matchIdx=-1,matches=0;
  const sRows=raw[plan.tabKey].rows;
  for(let i=0;i<sRows.length;i++){
    const k=deRowKey(sRows[i],'Row ID');
    if(k!==undefined&&sRows[i][k]!=null&&String(sRows[i][k]).trim()===targetId){
      matches++;
      matchIdx=i;
    }
  }
  if(matches!==1)return raw;
  const nextSaleRows=sRows.slice(0,matchIdx).concat(sRows.slice(matchIdx+1));
  let nextRaw=Object.assign({},raw,{[plan.tabKey]:Object.assign({},raw[plan.tabKey],{rows:nextSaleRows})});
  const invKey=item&&item.kind==='Phone'?'Phones':'PCs';
  const invTab=raw[invKey];
  const idx=item?item.row-2:-1;
  if(invTab&&Array.isArray(invTab.rows)&&idx>=0&&idx<invTab.rows.length){
    const r=invTab.rows[idx];
    const sk=deRowKey(r,'Status');
    if(sk!==undefined&&r[sk]!=null&&String(r[sk]).trim().toUpperCase()==='SOLD'){
      const copy=Object.assign({},r);
      copy[sk]='IN INVENTORY';
      const cols=['Sale Price','Sale Date','Sold To','Profit','ROI%','ROI','Days Held','Clicks on Listing','Asking Price'];
      for(let i=0;i<cols.length;i++){
        const ck=deRowKey(copy,cols[i]);
        if(ck!==undefined)copy[ck]=null;
      }
      const nextInvRows=invTab.rows.slice();
      nextInvRows[idx]=copy;
      nextRaw=Object.assign({},nextRaw,{[invKey]:Object.assign({},nextRaw[invKey],{rows:nextInvRows})});
    }
  }
  return nextRaw;
}

function dsErrText(e){
  const m=(e&&e.message)||'';
  if(m==='trade sale: edit it or fix it by hand')return "This is a trade sale, so it can't be deleted here. Edit it or fix it in Google Sheets. Nothing was changed.";
  if(m==='edit log unavailable'||m==='edit log write failed')return 'Your sheet could not write its safety log, so nothing was deleted.';
  if(m==='tab needs exactly one Trade ID column')return 'The sale tab needs exactly one Trade ID column, so the delete was refused. Nothing was changed.';
  if(/tab not allowed/.test(m))return 'Your entry script needs the newest version before it can delete sales. Paste the updated script into Apps Script and redeploy it. Nothing was changed.';
  return rowErrText(e);
}

function openDeviceSaleDelete(id){
  const rec=store.D.byId.get(id);if(!rec||rec.type!=='item')return;const o=rec.o;
  const s=dsPlan(o,store.base||store.raw);if(s.state!=='ok')return;
  const bk=deRowKey(s.row,"Buyer's Name")||deRowKey(s.row,'Sold to');
  const buyer=o.buyer||(bk&&s.row[bk])||'(no buyer recorded)';
  openOverlay(`<div class="palbox" style="padding:20px" role="alertdialog" aria-modal="true" aria-label="Delete this sale">
    <div class="dh"><h2>Delete this sale?</h2><button type="button" class="ibtn" data-act="close" aria-label="Close">${ICON.x}</button></div>
    <p>This removes only the sale from your Google Sheet. The device goes back to inventory. The purchase is not deleted.</p>
    <p class="hint" style="color:var(--muted)">${esc(o.name)} · sold for ${mny(o.sellPrice)} to ${esc(buyer)}<br>${esc(s.tab)} · ID ${esc(s.rowId)}</p>
    <p class="ed-msg" id="ed-msg" role="alert" hidden></p>
    <div class="ed-actions"><button type="button" class="btn sec" data-act="close" data-focus>Cancel</button><button type="button" class="btn danger" data-act="devdelgo" data-id="${esc(id)}">Delete sale</button></div></div>`,'pal');
}

async function deleteDeviceSaleGo(id){
  if(rowBusy)return;
  const rec=store.D.byId.get(id);
  const showErr=t=>{const n=$('#ed-msg');if(n){n.textContent=t;n.hidden=false}else toast(t)};
  const gone='Could not match this sale any more. Press Refresh and try again. Nothing was changed.';
  if(!rec||rec.type!=='item'){showErr(gone);return}
  const plan=dsPlan(rec.o,store.base||store.raw);
  if(plan.state!=='ok'){showErr(gone);return}
  const req=dsRequest(plan);
  if(!req){showErr(gone);return}
  rowSetBusy(true);
  try{
    await sheetCall(req);
    try{store.set(dsPatch(store.base||store.raw,rec.o,plan))}catch(_){}   /* the sheet has already deleted the row; the re-read below fixes the screen even if this local patch fails */
    closeOverlay();
    toast('Sale deleted. The device is back in inventory');
    syncSoon();
  }catch(e){
    showErr(dsErrText(e));
  }finally{
    rowSetBusy(false);
  }
}

/* ================= EDIT ONE PURCHASE ROW FROM A DEVICE (Phones and PCs) =================
   Writes go only to the device's own purchase row in "Form Responses - Bought" / "Form Responses - PCs", found by its Row ID.
   Never PnA, Master Inventory, PCs or Summary (formula tabs). Only fields the person touched AND changed are sent.
   Helpers below are pure (no DOM, no writes) so tests/device-edit.test.mjs can load them straight from this file. */
/* The logging form's definitions (BY, YN, numOf, sugList) are private to its module; it hands them over on window.MMLog. Missing = the editor stays off. */
const deL=()=>window.MMLog||{};
const deNum=s=>{const f=deL().numOf;return f?f(s):null};
const DE_FORM={Phone:'bphone',PC:'bpc',Accessory:'bacc'};
const DE_TYPES=['text','tel','int','money','date','radio','yn'];
const DE_TABS=['Form Responses - Bought','Form Responses - PCs','Bought Access - Form'];   /* the ONLY tabs this editor may ever target */
const deKey=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'');

function deRowKey(row,label){
  if(!row) return undefined;
  const target=deKey(label);
  return Object.keys(row).find(k=>deKey(k)===target);
}

/* ok = one safe purchase row with a Row ID; noid = matched but the row has no ID yet; nomatch = anything else. */
function dePlan(item,raw){
  const m=matchDeviceRows(item,raw);
  if(!m||!m.ok||!m.purchase) return {state:'nomatch'};
  if(!DE_TABS.includes(m.purchase.tab)) return {state:'nomatch'};
  let form=(deL().BY||{})[DE_FORM[item&&item.kind]];
  /* The accessory form's multi-pick fields (Connection Type, Included Accessories) are edited as plain comma-separated text. */
  if(form&&item.kind==='Accessory') form=Object.assign({},form,{f:form.f.map(x=>x.t==='multi'?Object.assign({},x,{t:'text'}):x)});
  if(!form||!form.f.every(x=>DE_TYPES.includes(x.t))) return {state:'nomatch'};
  if(!m.purchase.rowId) return {state:'noid'};
  return {state:'ok',form,tab:m.purchase.tab,rowId:String(m.purchase.rowId),row:m.purchase.row,tabKey:item.kind==='Phone'?'BoughtPhones':item.kind==='PC'?'BoughtPCs':'BoughtAccess'};
}

function deStr(x,v){
  if(v==null) return '';
  if(x.t==='date'){
    const s=String(v);
    return /^\d{4}-\d{2}-\d{2}/.test(s)?s.slice(0,10):'';
  }
  if(x.t==='money'||x.t==='int'){
    if(typeof v==='number'&&isFinite(v)) return String(v);
    const n=deNum(v);
    return n==null?String(v).trim():String(n);
  }
  return String(v).trim();
}

function deInit(form,row){
  const vals={},orig={};
  for(const x of form.f){
    const k=x.k;
    const o=deStr(x,row?row[deRowKey(row,k)]:undefined);
    orig[k]=o;
    if(x.t==='radio'||x.t==='yn'){
      const opts=x.t==='yn'?(deL().YN||[]):(x.o||[]);
      const match=opts.find(opt=>opt.trim().toLowerCase()===o.toLowerCase());
      vals[k]=match!==undefined?match:'';
    }else if(x.t==='money'){
      const n=deNum(o);
      vals[k]=n!=null?Number(n).toFixed(2):o;
    }else{
      vals[k]=o;
    }
  }
  return {vals,orig};
}

/* The same rules as validate() in the logging form, as a pure function. */
function deFieldError(x,s){
  if(!s){ return x.r ? 'Required' : ''; }
  if(x.t==='money'||x.t==='int'){ const n=deNum(s); if(n==null) return 'Enter a number'; if(n<0 && !x.neg) return "Can't be negative"; if(x.t==='int' && !Number.isInteger(n)) return 'Whole number please'; return ''; }
  if(x.t==='date' && !/^\d{4}-\d{2}-\d{2}$/.test(s)) return 'Pick a date';
  return '';
}

function deSame(x,a,b){
  const sa=String(a==null?'':a).trim(),sb=String(b==null?'':b).trim();
  if(x.t==='money'||x.t==='int'){
    const na=deNum(sa),nb=deNum(sb);
    if(na==null&&nb==null) return sa===sb;
    return na===nb;
  }
  if(x.t==='radio'||x.t==='yn'){
    return sa.toLowerCase()===sb.toLowerCase();
  }
  return sa===sb;
}

/* Only fields the person touched are checked, and only the ones that really differ are sent. */
function deCheck(form,vals,orig,touched){
  const changes={},errors={};
  for(const x of form.f){
    if(!touched.has(x.k)) continue;
    const s=String(vals[x.k]==null?'':vals[x.k]).trim();
    const e=deFieldError(x,s);
    if(e){errors[x.k]=e;continue;}
    if(deSame(x,s,orig[x.k]||'')) continue;
    if(s===''){
      changes[x.k]=null;
    }else if(x.t==='money'||x.t==='int'){
      changes[x.k]=deNum(s);
    }else if(x.t==='date'){
      changes[x.k]={$date:s};
    }else{
      changes[x.k]=s;
    }
  }
  return {changes,errors,count:Object.keys(changes).length};
}

/* 2 to 3 columns that are NOT being changed and are not empty, as the sheet returned them. The script re-checks them against the live row. */
function deExpect(form,row,changedKeys){
  if(!row) return null;
  const skip=new Set(changedKeys||[]);
  const expect={};
  let count=0;
  for(const x of form.f){
    if(skip.has(x.k)) continue;
    const v=row[deRowKey(row,x.k)];
    if(v==null||String(v).trim()==='') continue;
    expect[x.k]=v;
    if(++count===3) break;
  }
  return count>=2?expect:null;
}

/* A copy of the loaded sheet data with only that one row (found by Row ID) changed. Anything unclear returns the input untouched. */
function dePatch(raw,tabKey,rowId,changes){
  if(!raw||!raw[tabKey]||!Array.isArray(raw[tabKey].rows)) return raw;
  const targetId=String(rowId).trim();
  const rows=raw[tabKey].rows;
  let matchIdx=-1,matches=0;
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    const k=deRowKey(r,'Row ID');
    if(k!==undefined&&String(r[k]).trim()===targetId){
      matchIdx=i;
      matches++;
    }
  }
  if(matches!==1) return raw;
  const rowCopy={...rows[matchIdx]};
  for(const k of Object.keys(changes)){
    const targetKey=deRowKey(rowCopy,k)||k;
    const val=changes[k];
    rowCopy[targetKey]=(val&&typeof val==='object'&&val.$date!==undefined)?val.$date:val;
  }
  const nextRows=[...rows];
  nextRows[matchIdx]=rowCopy;
  return {...raw,[tabKey]:{...raw[tabKey],rows:nextRows}};
}

/* The SALE row of a sold device (Sold tabs only, never a formula tab). Same shapes as dePlan. The Device Label field is never editable: it links the sale to the device. */
const DE_SALE_TABS=['Form Responses - Sold','Form Responses - Sold PCs'];
const DE_SALE_FORM={Phone:'sphone',PC:'spc'};

function deSalePlan(item,raw){
  if(!item||item.sold!==true) return {state:'nomatch'};
  const m=matchDeviceRows(item,raw);
  if(!m||!m.ok||!m.sale) return {state:'nomatch'};
  if(!DE_SALE_TABS.includes(m.sale.tab)) return {state:'nomatch'};
  const base=(deL().BY||{})[DE_SALE_FORM[item.kind]];
  if(!base||!base.f) return {state:'nomatch'};
  const fields=base.f.filter(x=>x.t!=='item');
  if(!fields.length||!fields.every(x=>DE_TYPES.includes(x.t))) return {state:'nomatch'};
  if(!m.sale.rowId) return {state:'noid'};
  const form=Object.assign({},base,{f:fields});
  return {state:'ok',form,tab:m.sale.tab,rowId:String(m.sale.rowId),row:m.sale.row,tabKey:item.kind==='Phone'?'SoldPhones':'SoldPCs'};
}

/* Old value to new value for each changed field, for the confirmation screen. Pure. */
function deDiff(form,orig,changes){
  const res=[];
  if(!form||!form.f||!changes) return res;
  const fmt=(v,isMoney)=>{
    let s='';
    if(v!=null){
      if(typeof v==='object'&&v.$date!=null) s=String(v.$date);
      else s=String(v);
    }
    if(isMoney&&s.trim()!==''&&!isNaN(Number(s))) s=Number(s).toFixed(2);
    return s===''?'(empty)':s;
  };
  for(let i=0;i<form.f.length;i++){
    const f=form.f[i];
    if(f.k in changes){
      res.push({k:f.k,label:f.l,from:fmt(orig?orig[f.k]:undefined,f.t==='money'),to:fmt(changes[f.k],f.t==='money')});
    }
  }
  return res;
}

/* The original values of the given fields, in the same shape deCheck uses for changes. Used to roll back the local copy after an Undo. */
function deRevertChanges(form,orig,keys){
  const res={};
  if(!form||!form.f||!keys) return res;
  const map={};
  for(let i=0;i<form.f.length;i++) map[form.f[i].k]=form.f[i];
  for(let i=0;i<keys.length;i++){
    const k=keys[i];
    const f=map[k];
    if(!f) continue;
    let v=orig?orig[k]:undefined;
    if(typeof v==='object'&&v&&v.$date!=null) v=v.$date;
    if(v==null||v==='') res[k]=null;
    else if(f.t==='money'||f.t==='int') res[k]=deNum(v);
    else if(f.t==='date') res[k]={$date:String(v)};
    else res[k]=String(v);
  }
  return res;
}

function deUndoErrText(e){
  const m=(e&&e.message)||'';
  if(m.includes('cell changed since the edit')) return 'That cell changed since; nothing was changed.';
  if(m.includes('nothing to undo')) return 'Nothing left to undo.';
  if(m.includes('cell has a formula')) return 'That cell now holds a formula, so it was left alone. Nothing was changed.';
  if(m.startsWith('tab not allowed: undefined')||m.includes('oldscript')) return 'Your entry script needs the newest version before it can undo. Nothing was changed.';
  if(m.includes('log row changed')) return 'Another change was made after this one, so nothing was undone.';
  return rowErrText(e);
}

/* The device drawer footer and the "Edit purchase" popup. Delete stays disabled on purpose. Uses its own data-de / data-dk
   hooks so it can never touch the logging form's drafts (that form listens to .lg-in, data-ty and data-lg). */
let devEd=null;

function deviceFootHtml(o){
  const p=dePlan(o,store.base||store.raw);
  if(p.state==='nomatch') return `<div class="dfoot"><p class="hint" style="color:var(--muted)">Can't safely match this item to its sheet row</p></div>`;
  if(p.state==='noid') return `<div class="dfoot"><p class="hint" style="color:var(--muted)">Run the ID backfill first</p><button type="button" class="btn" data-act="idfill">Fill missing IDs</button></div>`;
  const s=(o.kind==='Accessory'&&o.sold!==true)?{state:'unsold'}:dsPlan(o,store.base||store.raw);
  const ok=s.state==='ok';
  const delBtn=ok?`<button type="button" class="btn danger" data-act="devdel" data-id="${esc(o.id)}" aria-describedby="de-delnote">Delete</button>`:`<button type="button" class="btn danger" disabled aria-describedby="de-delnote">Delete</button>`;
  const note=ok?'Deletes only the sale. The device goes back to inventory and the purchase stays.':s.state==='unsold'?'Delete purchases directly in Google Sheets':s.state==='trade'?"Trade sales can't be deleted here. Edit it or fix it in Google Sheets":s.state==='noid'?'Run the ID backfill first':"Can't safely match this sale to its sheet row";
  /* A sold item whose SALE row has no Row ID gets the same one-tap fill as the purchase case above. Every other state is unchanged. */
  const fillBtn=s.state==='noid'?`<button type="button" class="btn" data-act="idfill" style="margin-top:8px">Fill missing IDs</button>`:'';
  return `<div class="dfoot">${delBtn}<button type="button" class="btn" data-act="devedit" data-id="${esc(o.id)}">Edit</button></div><p class="hint" id="de-delnote" style="color:var(--muted);margin-top:8px">${esc(note)}</p>${fillBtn}`;
}

function deFieldHtml(x,i,val){
  const isChip=x.t==='radio'||x.t==='yn';
  const lbl=isChip?`<span class="lg-l${x.r?' req':''}">${esc(x.l)}</span>`:`<label class="lg-l${x.r?' req':''}" for="de-${i}">${esc(x.l)}</label>`;
  let ctrl='';
  if(isChip){
    const opts=x.t==='yn'?(deL().YN||[]):(x.o||[]);
    ctrl=`<div class="lg-chips" role="group" aria-label="${esc(x.k)}">`+opts.map(opt=>`<button type="button" class="chip-b" data-de="pick" data-dkey="${esc(x.k)}" data-dval="${esc(opt)}" aria-pressed="${val===opt}">${esc(opt)}</button>`).join('')+`</div>`;
  }else if(x.t==='money'){
    ctrl=`<div class="lg-aff money"><span>$</span><input type="text" id="de-${i}" data-dk="${esc(x.k)}" inputmode="decimal" autocomplete="off" value="${esc(val)}"></div>`;
  }else if(x.t==='date'){
    ctrl=`<input type="date" id="de-${i}" data-dk="${esc(x.k)}" value="${esc(val)}">`;
  }else{
    const im=x.t==='int'?'numeric':(x.t==='tel'?'tel':'text');
    ctrl=`<input type="text" id="de-${i}" data-dk="${esc(x.k)}" inputmode="${im}" autocomplete="off"${x.sug?` list="lg-dl-${x.sug}"`:''} value="${esc(val)}">`;
  }
  return `<div class="lg-f" data-df="${esc(x.k)}">${lbl}${ctrl}<p class="lg-em" data-derr hidden></p></div>`;
}

/* Match again against the CURRENT sheet copy, for the tab that is showing. */
function dePlanFor(o,tab){return tab==='sale'?deSalePlan(o,store.base||store.raw):dePlan(o,store.base||store.raw);}

/* Re-opening the overlay for another screen of the same popup must not lose the element that had focus before the popup opened. */
function deOverlay(html){
  const keep=devEd&&devEd.lf;
  openOverlay(html,'pal');
  if(devEd){ if(keep!==undefined) lastFocus=keep; else devEd.lf=lastFocus; }
}

/* devEd.plan / vals / orig / touched are always the ACTIVE tab's own objects (aliases, never copies): the input handlers below write straight into them. */
function deSwitchTab(tab){
  if(!devEd||!devEd.st[tab])return;
  devEd.active=tab;
  devEd.plan=devEd.st[tab].plan;
  devEd.vals=devEd.st[tab].vals;
  devEd.orig=devEd.st[tab].orig;
  devEd.touched=devEd.st[tab].touched;
  devEd.pending=null;
}

function renderDeviceEdit(){
  if(!devEd)return;
  const rec=store.D.byId.get(devEd.id);if(!rec)return;
  const o=rec.o,plan=devEd.plan,vals=devEd.vals;
  const sugs=[...new Set(plan.form.f.map(x=>x.sug).filter(Boolean))];
  const isSale=devEd.active==='sale';
  deOverlay(`<form class="palbox" style="padding:20px;max-height:90vh;overflow-y:auto" role="dialog" aria-modal="true" aria-label="${isSale?'Edit sale':'Edit purchase'}" data-deform="${esc(devEd.id)}" novalidate>
  <div class="dh"><div><h2>Edit device</h2><p class="hint" style="color:var(--muted)">${esc(o.name)} · ${esc(plan.tab)} · ID ${esc(plan.rowId)}</p></div><button type="button" class="ibtn" data-act="close" aria-label="Close">${ICON.x}</button></div>
  <div class="seg" role="tablist" style="margin-bottom:14px"><button type="button" role="tab" data-de="tab" data-tab="purchase" aria-selected="${!isSale}" aria-pressed="${!isSale}">Edit purchase</button>${devEd.st.sale?`<button type="button" role="tab" data-de="tab" data-tab="sale" aria-selected="${isSale}" aria-pressed="${isSale}">Edit sale</button>`:''}</div>
  ${plan.form.f.map((x,i)=>deFieldHtml(x,i,vals[x.k])).join('')}
  ${sugs.map(s=>`<datalist id="lg-dl-${esc(s)}">${(deL().sugList?deL().sugList(s):[]).map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`).join('')}
  <p class="ed-msg" id="ed-msg" role="alert" hidden></p>
  <div class="ed-actions"><button type="button" class="btn sec" data-act="close">Cancel</button><button type="submit" class="btn">Save changes</button></div></form>`);
}

function openDeviceEdit(id){
  const rec=store.D.byId.get(id);if(!rec||rec.type!=='item')return;
  const o=rec.o;
  const pPlan=dePlan(o,store.base||store.raw);if(pPlan.state!=='ok')return;
  const {vals:pVals,orig:pOrig}=deInit(pPlan.form,pPlan.row);
  const st={purchase:{plan:pPlan,vals:pVals,orig:pOrig,touched:new Set()},sale:null};
  /* The Edit sale tab exists ONLY for a sold device whose sale row was matched safely and has a Row ID. */
  const sPlan=deSalePlan(o,store.base||store.raw);
  if(sPlan.state==='ok'){
    const {vals:sVals,orig:sOrig}=deInit(sPlan.form,sPlan.row);
    st.sale={plan:sPlan,vals:sVals,orig:sOrig,touched:new Set()};
  }
  devEd={id,active:'purchase',st,plan:st.purchase.plan,vals:st.purchase.vals,orig:st.purchase.orig,touched:st.purchase.touched,pending:null};
  renderDeviceEdit();
}

/* Tab switch, and the two buttons on the confirmation screen. */
document.addEventListener('click',e=>{
  if(!devEd||rowBusy)return;
  const t=e.target.closest&&e.target.closest('[data-de]');
  if(!t)return;
  const act=t.dataset.de;
  if(act==='tab'){deSwitchTab(t.dataset.tab);renderDeviceEdit();}
  else if(act==='cancel'){devEd.pending=null;renderDeviceEdit();}
  else if(act==='confirm'){confirmDeviceEdit(devEd.id);}
});

function deShowErrors(errors){
  $$('#overlay [data-df]').forEach(el=>{
    const msg=errors[el.dataset.df]||'';
    const em=el.querySelector('[data-derr]');
    if(em){em.textContent=msg;em.hidden=!msg;}
    el.classList.toggle('bad',!!msg);
  });
  const m=$('#ed-msg');
  if(m) m.hidden=true;
}

document.addEventListener('click',e=>{
  if(!devEd) return;
  const t=e.target.closest&&e.target.closest('[data-de="pick"]');
  if(!t) return;
  const k=t.dataset.dkey, v=t.dataset.dval;
  devEd.vals[k]=devEd.vals[k]===v?'':v;
  devEd.touched.add(k);
  t.parentNode.querySelectorAll('[data-de="pick"]').forEach(btn=>{
    btn.setAttribute('aria-pressed',btn.dataset.dval===devEd.vals[k]);
  });
  const w=t.closest('[data-df]');
  if(w){
    const m=w.querySelector('[data-derr]');
    if(m){m.textContent='';m.hidden=true;}
    w.classList.remove('bad');
  }
});

function onDevEdInput(e){
  if(!devEd) return;
  const t=e.target;
  if(!t||!t.dataset||t.dataset.dk===undefined) return;
  const k=t.dataset.dk;
  devEd.vals[k]=t.value;
  devEd.touched.add(k);
  const w=t.closest('[data-df]');
  if(w){
    const m=w.querySelector('[data-derr]');
    if(m){m.textContent='';m.hidden=true;}
    w.classList.remove('bad');
  }
}
document.addEventListener('input',onDevEdInput);
document.addEventListener('change',onDevEdInput);

document.addEventListener('submit',e=>{
  if(!devEd) return;
  const f=e.target&&e.target.closest&&e.target.closest('[data-deform]');
  if(!f) return;
  e.preventDefault();
  saveDeviceEdit(f.dataset.deform);
});

async function saveDeviceEdit(id){
  if(rowBusy||!devEd||devEd.id!==id)return;
  const rec=store.D.byId.get(id);
  if(!rec||rec.type!=='item')return;
  const plan=dePlanFor(rec.o,devEd.active);   /* match again right now: the sheet may have been re-read since the popup opened */
  if(plan.state==='noid'){rowShowErr(new Error('noid'));return;}
  if(plan.state!=='ok'||plan.tab!==devEd.plan.tab||plan.rowId!==devEd.plan.rowId){rowShowErr(new Error('norow'));return;}
  const r=deCheck(plan.form,devEd.vals,devEd.orig,devEd.touched);
  deShowErrors(r.errors);
  if(Object.keys(r.errors).length){toast('Check the highlighted fields');return;}
  if(!r.count){toast('No changes to save');return;}
  const keys=Object.keys(r.changes);
  const ex=deExpect(plan.form,plan.row,keys);
  if(!ex){rowShowErr(new Error('noexpect'));return;}
  /* Nothing is sent yet: show old value to new value and wait for Confirm. */
  devEd.pending={changes:r.changes,keys,ex};
  const diffs=deDiff(plan.form,devEd.orig,r.changes);

async function confirmDeviceEdit(id){
  if(rowBusy||!devEd||devEd.id!==id||!devEd.pending)return;
  const rec=store.D.byId.get(id);
  if(!rec||rec.type!=='item')return;
  const plan=dePlanFor(rec.o,devEd.active);   /* and once more, right before anything is sent */
  if(plan.state==='noid'){rowShowErr(new Error('noid'));return;}
  if(plan.state!=='ok'||plan.tab!==devEd.plan.tab||plan.rowId!==devEd.plan.rowId){rowShowErr(new Error('norow'));return;}
  const expect=deExpect(plan.form,plan.row,devEd.pending.keys);
  if(!expect){rowShowErr(new Error('noexpect'));return;}
  rowSetBusy(true);
  try{
    const j=await sheetCall({action:'edit',target:plan.tab,rowId:plan.rowId,expect,changes:devEd.pending.changes});
    /* The script can answer ok yet skip a column (a formula or a missing header). Only what it says it wrote counts as saved. */
    const done=Array.isArray(j.updated)?j.updated:devEd.pending.keys;
    const skipped=Array.isArray(j.skipped)?j.skipped:[];
    const doneKeys=new Set(done.map(deKey));
    const applied={};
    for(const k of devEd.pending.keys)if(doneKeys.has(deKey(k)))applied[k]=devEd.pending.changes[k];
    const appliedKeys=Object.keys(applied);
    if(appliedKeys.length)store.set(dePatch(store.base||store.raw,plan.tabKey,plan.rowId,applied));
    /* What Undo needs: how many cells were written (one undo call each), in order, and their original values. */
    const info={n:appliedKeys.length,keys:appliedKeys,tabKey:plan.tabKey,rowId:plan.rowId,revert:deRevertChanges(plan.form,devEd.orig,appliedKeys)};
    devEd=null;
    closeOverlay();
    const msg=skipped.length?'Saved, but your sheet skipped: '+skipped.join(', ')+'. Check Google Sheets.':'Saved to your sheet';
    if(appliedKeys.length)toastUndo(msg,info);else toast(msg);
    syncSoon();
  }catch(e){
    rowShowErr(e);
  }finally{
    rowSetBusy(false);
  }
}

/* A toast with an Undo button. The script undoes ONE cell per {action:'undo'} call, so an edit of N cells takes N calls. */
function toastUndo(msg,info){
  const p=$('#toasts');if(!p)return;
  const el=document.createElement('div');el.className='toast';
  const span=document.createElement('span');span.textContent=msg;
  const btn=document.createElement('button');btn.type='button';btn.className='toast-undo';btn.textContent='Undo';
  el.appendChild(span);el.appendChild(btn);
  const timer=setTimeout(()=>{el.remove()},12000);
  btn.addEventListener('click',()=>{
    btn.disabled=true;
    clearTimeout(timer);
    undoEdit(info,el);
  });
  p.appendChild(el);
}

let deUndoing=false;
async function undoEdit(info,el){
  if(deUndoing)return;
  deUndoing=true;
  try{
    let k=0,err=null;
    for(let i=0;i<info.n;i++){
      try{await sheetCall({action:'undo'});k++;}catch(e){err=e;break;}
    }
    if(k>0){
      /* Undo reverses the newest cell first, so the cells put back are the LAST k written. */
      const rev={};
      info.keys.slice(-k).forEach(x=>{rev[x]=info.revert[x];});
      store.set(dePatch(store.base||store.raw,info.tabKey,info.rowId,rev));
    }
    if(el)el.remove();
    if(k===info.n)toast('Undone. Your sheet is back to how it was.');
    else if(k===0)toast(deUndoErrText(err));
    else toast('Undid '+k+' of '+info.n+' changes. The rest changed since, so they were left as they are.');
    syncSoon();
  }catch(e){
    toast(deUndoErrText(e));
  }finally{
    deUndoing=false;
  }
}

    if(i.sold&&i.sellDate)ev.push({d:i.sellDate,i:'tag',t:'Sold '+i.name,s:i.buyer?'To '+i.buyer:i.kind,r:`<span class="${i.profit>=0?'pos':'neg'}">${SM(i.profit)}</span>`,id:i.id})});
  D.investments.forEach(v=>ev.push({d:v.date,i:'invest',t:v.portfolio,s:v.value!=null?'Value '+mny(v.value):'Entry logged',r:v.flow?'+'+M(v.flow):'',id:v.id}));
  return ev.sort((a,b)=>b.d-a.d).slice(0,9);
}
/* mm-mobile-v3: Home hero START (additive; mobile Home graph card with Profit / Spending / Net / Invested) */
function mmHomeHero(o) {
  try {
    if (!o) throw new Error("Missing data");
    var profitTotal = o.profitTotal || 0;
    var profitPrev = o.profitPrev != null ? o.profitPrev : null;
    var spendTotal = o.spendTotal || 0;
    var spendPrev = o.spendPrev != null ? o.spendPrev : null;
    var netTotal = profitTotal - spendTotal;
    var netPrev = (profitPrev == null || spendPrev == null) ? null : (profitPrev - spendPrev);
    var inv = o.inv || { vals: [], labels: [], total: 0, gain: 0 };
    var dProfit = dlt(profitTotal, profitPrev);
    var dSpend = dlt(spendTotal, spendPrev);
    var dNet = dlt(netTotal, netPrev);
    var rangeStr = (o.R && o.R.start && o.R.end) ? (fdy(o.R.start) + ' – ' + fdy(o.R.end)) : '';

    var html = '<section class="card mm3-hero" id="mm3Hero" aria-label="Summary graph">' +
      '<div class="mm3-hl"><span class="mm3-lab" id="mm3Lab">Reselling profit</span><span class="mm3-rng">' + esc(rangeStr) + '</span></div>' +
      '<div class="mm3-big" id="mm3Big" aria-live="polite"></div>' +
      '<div class="mm3-dl" id="mm3Dl"></div>' +
      '<div class="mm3-chart" id="mm3Chart">' +
        '<svg id="mm3Svg" viewBox="0 0 360 130" preserveAspectRatio="none" role="img" aria-label="Summary chart">' +
          '<defs><linearGradient id="mm3Grad" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.32"/>' +
            '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>' +
          '</linearGradient></defs>' +
          '<path id="mm3Area" fill="url(#mm3Grad)" d=""/>' +
          '<path id="mm3Line" class="mm3-ln" pathLength="1" fill="none" d=""/>' +
          '<line id="mm3Cur" x1="0" y1="0" x2="0" y2="130" style="display:none;"/>' +
        '</svg>' +
        '<i class="mm3-ep" id="mm3Ep"></i>' +
        '<div class="mm3-tip" id="mm3Tip" hidden></div>' +
      '</div>' +
      '<div class="mm3-seg" role="group" aria-label="Show on graph">' +
        '<button type="button" data-m="profit" aria-pressed="true">Profit</button>' +
        '<button type="button" data-m="spend" aria-pressed="false">Spending</button>' +
        '<button type="button" data-m="net" aria-pressed="false">Net</button>' +
        '<button type="button" data-m="inv" aria-pressed="false">Invested</button>' +
      '</div>' +
    '</section>';

    var mount = function() {
      try {
        var card = document.getElementById('mm3Hero');
        if (!card) return;
        var labEl = document.getElementById('mm3Lab');
        var bigEl = document.getElementById('mm3Big');
        var dlEl = document.getElementById('mm3Dl');
        var chartEl = document.getElementById('mm3Chart');
        var svgEl = document.getElementById('mm3Svg');
        var areaEl = document.getElementById('mm3Area');
        var lineEl = document.getElementById('mm3Line');
        var curEl = document.getElementById('mm3Cur');
        var epEl = document.getElementById('mm3Ep');
        var tipEl = document.getElementById('mm3Tip');
        var btns = Array.prototype.slice.call(card.querySelectorAll('.mm3-seg button'));
        var isFirstDraw = true;

        var getMetricData = function(mKey) {
          if (mKey === 'spend') {
            return { lab: 'Spending', vals: o.spend || [], labels: o.labels || [], tot: spendTotal, delta: dSpend, inverse: true,
              sub: mny(o.perDay || 0) + '/day', fmtBig: function(v) { return M(v); }, aria: 'Spending: ' + mny(spendTotal) };
          } else if (mKey === 'net') {
            var pArr = o.profit || [], sArr = o.spend || [], nArr = [];
            var len = Math.max(pArr.length, sArr.length);
            for (var i = 0; i < len; i++) nArr.push((pArr[i] || 0) - (sArr[i] || 0));
            return { lab: 'Net (profit minus spending)', vals: nArr, labels: o.labels || [], tot: netTotal, delta: dNet, inverse: false,
              sub: 'profit minus spending', fmtBig: function(v) { return SM(v); }, aria: 'Net: ' + mny(netTotal) };
          } else if (mKey === 'inv') {
            var gainStr = (inv.gain >= 0 ? '+' : '') + mny(inv.gain);
            return { lab: 'Invested', vals: inv.vals || [], labels: inv.labels || [], tot: inv.total || 0, delta: null, inverse: false,
              sub: '<span class="amt">' + gainStr + '</span> all-time', fmtBig: function(v) { return M(v); }, aria: 'Invested: ' + mny(inv.total || 0) };
          }
          return { lab: 'Reselling profit', vals: o.profit || [], labels: o.labels || [], tot: profitTotal, delta: dProfit, inverse: false,
            sub: plural(o.sales || 0, 'sale'), fmtBig: function(v) { return SM(v); }, aria: 'Reselling profit: ' + mny(profitTotal) };
        };

        var getPoints = function(vals) {
          var n = vals.length;
          if (n === 0) return [];
          var min = vals[0], max = vals[0], i;
          for (i = 1; i < n; i++) { if (vals[i] < min) min = vals[i]; if (vals[i] > max) max = vals[i]; }
          var pts = [];
          for (i = 0; i < n; i++) {
            var x = n === 1 ? 180 : 6 + (i / (n - 1)) * 348;
            var y = 65;
            if (max > min) y = 118 - ((vals[i] - min) / (max - min)) * 106;
            pts.push({ x: x, y: y });
          }
          return pts;
        };

        var getBezierPath = function(pts) {
          if (pts.length === 0) return '';
          if (pts.length === 1) return 'M6,' + pts[0].y + ' L354,' + pts[0].y;
          if (pts.length === 2) return 'M' + pts[0].x + ',' + pts[0].y + ' L' + pts[1].x + ',' + pts[1].y;
          var d = 'M' + pts[0].x.toFixed(2) + ',' + pts[0].y.toFixed(2), t = 1 / 6;
          for (var i = 0; i < pts.length - 1; i++) {
            var p0 = pts[i === 0 ? i : i - 1], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] ? pts[i + 2] : p2;
            d += ' C' + (p1.x + (p2.x - p0.x) * t).toFixed(2) + ',' + (p1.y + (p2.y - p0.y) * t).toFixed(2) + ' ' +
                 (p2.x - (p3.x - p1.x) * t).toFixed(2) + ',' + (p2.y - (p3.y - p1.y) * t).toFixed(2) + ' ' +
                 p2.x.toFixed(2) + ',' + p2.y.toFixed(2);
          }
          return d;
        };

        var currentData = null, currentPts = [];

        var resetScrub = function() {
          curEl.style.display = 'none';
          tipEl.hidden = true;
          if (currentPts.length > 0) {
            var lastPt = currentPts[currentPts.length - 1];
            epEl.style.left = (lastPt.x / 360 * 100) + '%';
            epEl.style.top = (lastPt.y / 130 * 100) + '%';
            epEl.style.display = 'block';
          } else {
            epEl.style.display = 'none';
          }
        };

        var draw = function(mKey) {
          try {
            var data = getMetricData(mKey);
            currentData = data;
            labEl.textContent = data.lab;
            svgEl.setAttribute('aria-label', data.aria);
            var chip = data.delta != null ? deltaChip(data.delta, data.inverse) : '';
            dlEl.innerHTML = chip + (chip ? ' ' : '') + '<span>' + data.sub + '</span>';
            btns.forEach(function(btn) { btn.setAttribute('aria-pressed', btn.getAttribute('data-m') === mKey ? 'true' : 'false'); });
            currentPts = getPoints(data.vals);
            var lineD = getBezierPath(currentPts);
            lineEl.setAttribute('d', lineD);
            areaEl.setAttribute('d', currentPts.length ? lineD + ' L354,130 L6,130 Z' : '');
            lineEl.classList.remove('mm3-go');
            void lineEl.getBoundingClientRect();
            lineEl.classList.add('mm3-go');
            resetScrub();
            var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (isFirstDraw && !reduced) {
              isFirstDraw = false;
              var endVal = data.tot, startTime = null;
              var step = function(ts) {
                if (!startTime) startTime = ts;
                var p = Math.min((ts - startTime) / 700, 1), e = 1 - Math.pow(1 - p, 4);
                if (p < 1) { bigEl.innerHTML = '<span class="amt">' + mny(endVal * e) + '</span>'; requestAnimationFrame(step); }
                else bigEl.innerHTML = data.fmtBig(data.tot);
              };
              requestAnimationFrame(step);
            } else {
              isFirstDraw = false;
              bigEl.innerHTML = data.fmtBig(data.tot);
            }
          } catch (err) {}
        };

        var handleMove = function(e) {
          if (!currentData || !currentPts.length) return;
          var rect = chartEl.getBoundingClientRect();
          if (rect.width <= 0) return;
          var relX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
          var x360 = (relX / rect.width) * 360, idx = 0, best = Math.abs(x360 - currentPts[0].x);
          for (var i = 1; i < currentPts.length; i++) { var dd = Math.abs(x360 - currentPts[i].x); if (dd < best) { best = dd; idx = i; } }
          var pt = currentPts[idx];
          curEl.setAttribute('x1', pt.x); curEl.setAttribute('x2', pt.x); curEl.style.display = 'block';
          epEl.style.left = (pt.x / 360 * 100) + '%'; epEl.style.top = (pt.y / 130 * 100) + '%';
          var label = (currentData.labels && currentData.labels[idx]) ? currentData.labels[idx] : '';
          tipEl.innerHTML = esc(label) + (label ? ' · ' : '') + '<span class="amt">' + mny(currentData.vals[idx]) + '</span>';
          tipEl.hidden = false;
          var tw = tipEl.offsetWidth || 80, px = (pt.x / 360) * rect.width - tw / 2;
          tipEl.style.left = Math.max(24, Math.min(px, rect.width - tw - 24)) + 'px';
        };

        chartEl.addEventListener('pointerdown', function(e) { try { chartEl.setPointerCapture(e.pointerId); } catch (_) {} handleMove(e); });
        chartEl.addEventListener('pointermove', handleMove);
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(function(n) { chartEl.addEventListener(n, resetScrub); });

        var seg = card.querySelector('.mm3-seg');
        seg.addEventListener('click', function(e) {
          var btn = e.target.closest('button');
          if (btn && btn.dataset.m) draw(btn.dataset.m);
        });
        seg.addEventListener('keydown', function(e) {
          if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
          var idx = btns.indexOf(document.activeElement);
          if (idx === -1) return;
          e.preventDefault();
          var next = e.key === 'ArrowRight' ? (idx + 1) % btns.length : (idx - 1 + btns.length) % btns.length;
          btns[next].focus(); draw(btns[next].dataset.m);
        });
        draw('profit');
      } catch (err) {}
    };
    return { html: html, mount: mount };
  } catch (err) {
    return { html: '', mount: function() {} };
  }
}

/* ---------- Monthly burn rate (read-only) ---------- */
function burnCard(){
  try{
    const ex=store.D.expenses.filter(e=>e.date&&!e.isRefund&&e.amount>0);
    const y=TODAY.getFullYear(),m=TODAY.getMonth(),dom=TODAY.getDate(),dim=new Date(y,m+1,0).getDate();
    const inM=(e,yy,mm)=>e.date.getFullYear()===yy&&e.date.getMonth()===mm;
    const mtd=sum(ex.filter(e=>inM(e,y,m)&&e.date.getDate()<=dom),e=>e.amount);
    const hist=[1,2,3].map(p=>{const d=new Date(y,m-p,1),yy=d.getFullYear(),mm=d.getMonth();
      return{full:sum(ex.filter(e=>inM(e,yy,mm)),e=>e.amount),to:sum(ex.filter(e=>inM(e,yy,mm)&&e.date.getDate()<=dom),e=>e.amount)}}).filter(h=>h.full>0);
    const mname=MO[m];
    if(!hist.length)return card('Spending this month',`<div class="burn"><div class="big">${M(mtd)}</div><p class="hint" style="color:var(--muted)">Not enough earlier months yet to compare against.</p></div>`);
    const aFull=avg(hist,h=>h.full),aTo=avg(hist,h=>h.to),proj=mtd/dom*dim;
    const pace=aTo>0?mtd/aTo:null,fill=Math.min(100,mtd/aFull*100),tick=Math.min(100,aTo/aFull*100),over=mtd>aTo;
    return card('Spending this month',`<div class="burn"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><span class="big">${M(mtd)}</span><span class="hint" style="color:var(--muted)">${pace==null?'':pct(pace)+' of your usual pace for '+mname+' '+dom}</span></div>
      <div class="track" role="img" aria-label="${esc(mname)} spending so far is ${mny(mtd)} against a typical ${mny(aFull)} for the whole month"><i class="${over?'over':''}" style="width:${fill.toFixed(1)}%"></i><b style="left:calc(${tick.toFixed(1)}% - 1px)" title="Typical spend by this day"></b></div>
      <div class="meta"><span>Typical by today: ${M(aTo)}</span><span>On track for ${M(proj)}</span><span>Usual full month: ${M(aFull)}</span></div></div>`,`<span class="hint">vs your last ${plural(hist.length,'month')}</span>`);
  }catch(e){return ''}
}

/* ---------- Turnaround velocity (read-only analytics) ---------- */
const VBK=[['≤1 wk',0,7],['1–2 wk',8,14],['2–4 wk',15,30],['1–2 mo',31,60],['2 mo+',61,1e9]];
function velocityHtml(rs,kind){
  const sold=rs.sold.filter(i=>i.days!=null&&isFinite(i.days)&&i.days>=0);
  const kinds=[...new Set(sold.map(i=>i.kind))];
  const names={Phone:'Phones',PC:'PCs',Accessory:'Accessories'};
  const heat=sold.length?`<div class="vh-wrap"><div class="vh" role="table" aria-label="Days to sell by type"><span></span>${VBK.map(b=>`<span class="hd">${b[0]}</span>`).join('')}<span class="hd">Avg days</span>`+
    kinds.map(k=>{const rows=sold.filter(i=>i.kind===k),n=rows.length;
      return `<span class="rl">${esc(names[k]||k)}<small style="color:var(--muted);font-weight:500"> ${n}</small></span>`+VBK.map(b=>{const c=rows.filter(i=>i.days>=b[1]&&i.days<=b[2]).length;return `<span class="c" style="--a:${(c/n).toFixed(2)}" title="${c} of ${n}">${c||''}</span>`}).join('')+`<span class="av">${Math.round(avg(rows,i=>i.days))}</span>`}).join('')+`</div></div>`
    :'<div class="empty">No completed sales in this range yet.</div>';
  const stock=store.D.items.filter(i=>!i.sold&&i.age!=null&&(kind==='All'||i.kind===kind)).sort((a,b)=>b.age-a.age);
  const tied=sum(stock,i=>i.cashSpent!=null?i.cashSpent:i.buyPrice);
  const list=stock.length?`<div class="list">${stock.slice(0,6).map(i=>`<button class="li" data-act="open" data-id="${esc(i.id)}"><span class="tx"><b>${esc(i.name)}</b><span>${plural(i.age,'day')} in stock${i.buyPrice!=null?' · paid '+mny(i.buyPrice):''}</span></span></button>`).join('')}</div><p class="hint" style="color:var(--muted);margin-top:8px">${M(tied)} tied up across ${plural(stock.length,'item')} in stock</p>`:'<div class="empty">Nothing in stock.</div>';
  return `<div class="grid g2">${card('How fast things sell',heat,'<span class="hint">Darker = more of that type</span>')}${card('Sitting the longest',list)}</div>`;
}

    if(!g.n)return '';
    const share=C*g.n/total,len=Math.max(0.5,share-2),o=off;off+=share;const t=`Show ${g.n} ${g.label}`;

  return `<div class="dh-wrap">
    <div class="dh-ring"><svg viewBox="0 0 100 100" role="img" aria-label="Data health score ${s} out of 100">
      <circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface2)" stroke-width="9"/>

        <button type="button" class="dh-stat${warn>0?' warn':''}${S.dhf==='warn'?' on':''}" data-act="dhfilter" data-f="warn" aria-pressed="${S.dhf==='warn'}"><div class="dh-n">${warn}</div><div class="dh-l">To fix</div></button>
        <button type="button" class="dh-stat${S.dhf==='info'?' on':''}" data-act="dhfilter" data-f="info" aria-pressed="${S.dhf==='info'}"><div class="dh-n">${info}</div><div class="dh-l">Notes</div></button>
        <button type="button" class="dh-stat${fixed>0?' good':''}${S.dhf==='fixed'?' on':''}" data-act="dhfilter" data-f="fixed" aria-pressed="${S.dhf==='fixed'}"><div class="dh-n">${fixed}</div><div class="dh-l">Auto-cleaned</div></button>

/* ===== OWED START =====
   Loans and Deposits screen. Reads ONE sheet tab named "Owed" (raw.Owed, absent until you add the tab). Its Type column says Loan or Deposit.
   New entries go through the normal Log drawer (forms 'loan' and 'dep', both writing to Owed). Updates use the existing edit-by-Row-ID request
   with a safety check (expect), and can only target Owed. Nothing here can delete a row. */
const OWED_LOAN_STATUSES = ['Out', 'Returned', 'Written off'];
const OWED_DEP_STATUSES = ['Waiting', 'Picked Up', 'Forfeited', 'Refunded'];
const OWED_HEADERS = 'Timestamp\tRow ID\tType\tPerson\tPhone / Email\tItem / Device\tTotal Amount\tAmount Paid\tDate Out\tDue Date\tStatus\tDate Closed\tNotes';
const owedStr = v => String(v == null ? '' : v).trim();

/* One sheet tab ("Owed") holds both kinds of entry; the Type column (Loan or Deposit) says which. Rows with a Person but no usable Type are counted in `untyped`, never shown, never changed. */
function owedModel(raw, today = TODAY) {
  const hasOwed = Boolean(raw && raw.Owed && Array.isArray(raw.Owed.rows));
  const rows = hasOwed ? raw.Owed.rows : [];

  const loans = [];
  const deps = [];
  let untyped = 0;

  for (const r of rows) {
    if (!r) continue;

    const person = owedStr(r['Person']);
    const typeRaw = owedStr(r['Type']).toLowerCase();
    const totRaw = r['Total Amount'];
    const totPresent = totRaw !== null && totRaw !== undefined && owedStr(totRaw) !== '';

    // Skip empty spare rows
    if (!person && !typeRaw && !totPresent) continue;

    // Skip rows with Type but blank Person (not counted in untyped)
    if (!person) continue;

    // Classify Type
    const isLoan = typeRaw === 'loan';
    const isDep = typeRaw === 'deposit' || typeRaw === 'dep';

    if (!isLoan && !isDep) {
      untyped++;
      continue;
    }

    const id = owedStr(r['Row ID']);
    const rowNum = r._row;
    const contact = owedStr(r['Phone / Email']);
    const itemDevice = owedStr(r['Item / Device']);
    const paidRaw = r['Amount Paid'];
    const hadPaid = paidRaw !== null && paidRaw !== undefined && owedStr(paidRaw) !== '';
    const datePrimary = pd(r['Date Out']) || pd(r['Timestamp']);
    const due = pd(r['Due Date']);
    const closed = pd(r['Date Closed']);
    const status = owedStr(r['Status']);
    const statusLower = status.toLowerCase();
    const notes = owedStr(r['Notes']);

    const daysLeft = due ? diffD(today, due) : null;

    if (isLoan) {
      const loaned = num(totRaw) || 0;
      const repaid = num(paidRaw) || 0;
      const owed = Math.max(0, loaned - repaid);
      const open = statusLower === '' || statusLower === 'out' || statusLower === 'open';
      const daysOut = datePrimary ? Math.max(0, diffD(datePrimary, today)) : null;
      const overdue = Boolean(open && daysLeft !== null && daysLeft < 0);

      loans.push({
        id,
        row: rowNum,
        name: person,
        contact,
        item: itemDevice,
        loaned,
        repaid,
        owed,
        dateOut: datePrimary,
        due,
        closed,
        status,
        open,
        daysOut,
        daysLeft,
        overdue,
        notes,
        _hadLoaned: totPresent,
        _hadRepaid: hadPaid
      });
    } else {
      const total = num(totRaw) || 0;
      const paid = num(paidRaw) || 0;
      const balance = Math.max(0, total - paid);
      const open = statusLower === '' || statusLower === 'waiting' || statusLower === 'open';
      const daysIn = datePrimary ? Math.max(0, diffD(datePrimary, today)) : null;
      const overdue = Boolean(open && daysLeft !== null && daysLeft < 0);

      deps.push({
        id,
        row: rowNum,
        name: person,
        contact,
        device: itemDevice,
        total,
        paid,
        balance,
        dateIn: datePrimary,
        pickup: due,
        closed,
        status,
        open,
        daysIn,
        daysLeft,
        overdue,
        notes,
        _hadTotal: totPresent,
        _hadPaid: hadPaid
      });
    }
  }

  // Sort: open first (earliest due, no due after, row desc), then closed (row desc)
  const sortFn = (a, b) => {
    if (a.open !== b.open) return a.open ? -1 : 1;
    if (a.open) {
      const aDue = a.due || a.pickup;
      const bDue = b.due || b.pickup;
      if (aDue && bDue) {
        const diff = aDue.getTime() - bDue.getTime();
        if (diff !== 0) return diff;
      } else if (aDue && !bDue) {
        return -1;
      } else if (!aDue && bDue) {
        return 1;
      }
    }
    return (b.row || 0) - (a.row || 0);
  };

  loans.sort(sortFn);
  deps.sort(sortFn);

  // Compute totals
  let owedToMe = 0;
  let loansOpen = 0;
  let loansOverdue = 0;
  for (const l of loans) {
    if (l.open) {
      owedToMe += l.owed;
      loansOpen++;
      if (l.overdue) loansOverdue++;
    }
  }

  let depHeld = 0;
  let depBalance = 0;
  let depOpen = 0;
  let depOverdue = 0;
  for (const d of deps) {
    if (d.open) {
      depHeld += d.paid;
      depBalance += d.balance;
      depOpen++;
      if (d.overdue) depOverdue++;
    }
  }

  const totals = {
    owedToMe,
    loansOpen,
    loansOverdue,
    depHeld,
    depBalance,
    depOpen,
    depOverdue,
    overdue: loansOverdue + depOverdue
  };

  return {
    hasLoans: hasOwed,
    hasDeps: hasOwed,
    hasOwed,
    loans,
    deps,
    untyped,
    totals
  };
}

function owedDue(item) {
  if (!item || !item.open || item.daysLeft == null) return { text: 'No date set', tone: '' };
  const d = item.daysLeft, s = n => (n === 1 ? '' : 's');
  if (d < 0) return { text: `${-d} day${s(-d)} overdue`, tone: 'bad' };
  if (d === 0) return { text: 'Due today', tone: 'warn' };
  return { text: `Due in ${d} day${s(d)}`, tone: d <= 3 ? 'warn' : 'good' };
}

/* Shared by both kinds: amount parsing and date checking. Returns {error} or the parsed values. */
function owedParse(amountText, dateText, amountMsg, dateMsg) {
  const a = owedStr(amountText);
  let amt = 0;
  if (a !== '') { amt = num(a); if (amt == null || amt < 0) return { error: amountMsg }; }
  const d = owedStr(dateText);
  if (d !== '' && (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !pd(d))) return { error: dateMsg };
  return { amt, date: d };
}

function owedLoanChanges(item, input, today = TODAY) {
  const p = owedParse(input && input.repay, input && input.due, 'Enter a repayment of 0 or more', 'Enter a valid return date');
  if (p.error) return { error: p.error };
  const changes = {}, patch = {};
  const newRepaid = item.repaid + p.amt;
  if (p.amt > 0) { changes['Amount Paid'] = newRepaid; patch['Amount Paid'] = newRepaid; }
  if (p.date && p.date !== (item.due ? isoDay(item.due) : '')) { changes['Due Date'] = { $date: p.date }; patch['Due Date'] = p.date; }
  let chosen = owedStr(input && input.status) || 'Out';
  const cur = (item.status || 'Out').toLowerCase() === 'open' ? 'out' : (item.status || 'Out').toLowerCase();
  if (item.loaned > 0 && newRepaid >= item.loaned && chosen.toLowerCase() === 'out' && item.open) chosen = 'Returned';
  if (chosen.toLowerCase() !== cur) { changes['Status'] = chosen; patch['Status'] = chosen; }
  const fin = chosen.toLowerCase();
  const todayIso = isoDay(today);
  if ((fin === 'returned' || fin === 'written off') && item.open) { changes['Date Closed'] = { $date: todayIso }; patch['Date Closed'] = todayIso; }
  else if (!item.open && fin === 'out') { changes['Date Closed'] = null; patch['Date Closed'] = null; }
  if (!Object.keys(changes).length) return { error: 'No changes to save' };
  const expect = {};
  if (item.id) expect['Row ID'] = item.id;
  expect['Type'] = 'Loan';
  expect['Person'] = item.name;
  if (item._hadLoaned) expect['Total Amount'] = item.loaned;
  if (item._hadRepaid) expect['Amount Paid'] = item.repaid;
  if (item.status) expect['Status'] = item.status;
  return { changes, expect, patch };
}

function owedDepChanges(item, input, today = TODAY) {
  const p = owedParse(input && input.pay, input && input.pickup, 'Enter a payment of 0 or more', 'Enter a valid pickup date');
  if (p.error) return { error: p.error };
  const changes = {}, patch = {};
  const newPaid = item.paid + p.amt;
  if (p.amt > 0) { changes['Amount Paid'] = newPaid; patch['Amount Paid'] = newPaid; }
  if (p.date && p.date !== (item.pickup ? isoDay(item.pickup) : '')) { changes['Due Date'] = { $date: p.date }; patch['Due Date'] = p.date; }
  const chosen = owedStr(input && input.status) || 'Waiting';
  const cur = (item.status || 'Waiting').toLowerCase() === 'open' ? 'waiting' : (item.status || 'Waiting').toLowerCase();
  if (chosen.toLowerCase() !== cur) { changes['Status'] = chosen; patch['Status'] = chosen; }
  const fin = chosen.toLowerCase();
  const todayIso = isoDay(today);
  if ((fin === 'picked up' || fin === 'forfeited' || fin === 'refunded') && item.open) { changes['Date Closed'] = { $date: todayIso }; patch['Date Closed'] = todayIso; }
  else if (!item.open && fin === 'waiting') { changes['Date Closed'] = null; patch['Date Closed'] = null; }
  if (!Object.keys(changes).length) return { error: 'No changes to save' };
  const expect = {};
  if (item.id) expect['Row ID'] = item.id;
  expect['Type'] = 'Deposit';
  expect['Person'] = item.name;
  if (item._hadTotal) expect['Total Amount'] = item.total;
  if (item._hadPaid) expect['Amount Paid'] = item.paid;
  if (item.status) expect['Status'] = item.status;
  return { changes, expect, patch };
}

/* A NEW raw object with one row (found by Row ID) changed. Never mutates its input; anything unclear returns the input untouched. */
function owedPatchRaw(raw, tabKey, rowId, patch) {
  if (!raw || !raw[tabKey] || !Array.isArray(raw[tabKey].rows)) return raw;
  const want = owedStr(rowId);
  let hit = false;
  const rows = raw[tabKey].rows.map(r => { if (r && want && owedStr(r['Row ID']) === want) { hit = true; return Object.assign({}, r, patch); } return r; });
  if (!hit) return raw;
  return Object.assign({}, raw, { [tabKey]: Object.assign({}, raw[tabKey], { rows }) });
}

function owedRows(items, kind, openN) {
  const open = items.filter(x => x.open).slice(0, 50), closed = items.filter(x => !x.open);
  const isLoan = kind === 'loan';
  const line = 'display:flex;border-bottom:1px solid var(--line);padding:12px 0;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center';
  let html = open.length ? open.map(x => {
    const due = owedDue(x);
    const meta = isLoan
      ? [x.daysOut != null ? `Out ${x.daysOut} day${x.daysOut === 1 ? '' : 's'}` : '', `borrowed ${mny(x.loaned)}`, `repaid ${mny(x.repaid)}`, x.due ? `Return by ${fdy(x.due)}` : '']
      : [`Deposit ${mny(x.paid)} of ${mny(x.total)}`, x.dateIn ? `taken ${fdy(x.dateIn)}` : '', x.pickup ? `Pick up by ${fdy(x.pickup)}` : ''];
    const act = x.id ? `<button type="button" class="btn sec" data-owed-edit="${kind}" data-oid="${esc(x.id)}">Update</button>` : `<span class="hint">Needs a Row ID</span>`;
    return `<div style="${line}"><div style="min-width:220px;flex:1"><div><b>${esc(x.name)}</b>${(isLoan ? x.item : x.device) ? ` <span class="hint" style="color:var(--muted)">· ${esc(isLoan ? x.item : x.device)}</span>` : ''}</div>`
      + `<div class="hint">${esc(meta.filter(Boolean).join(' · '))}</div></div>`
      + `<div style="display:flex;align-items:center;gap:10px"><div style="text-align:right"><div>${M(isLoan ? x.owed : x.balance)}</div><div class="hint">${isLoan ? 'balance' : 'to pay'}</div></div>`
      + `<span class="chip ${due.tone}${due.tone==='bad'?' glow-urgent':''}">${esc(due.text)}</span>${act}</div></div>`;
  }).join('') : `<div class="empty"><b>Nothing here</b>${isLoan ? 'No open loans right now.' : 'No deposits waiting for pickup.'}</div>`;
  if (closed.length) {
    html += `<details style="margin-top:14px"><summary style="cursor:pointer;color:var(--muted);font-weight:600">Closed (${closed.length})</summary><div style="margin-top:8px">`
      + closed.slice(0, 10).map(x => {
        const dt = x.closed ? fdy(x.closed) : '';
        return `<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"><span>${esc(x.name)}${(isLoan ? x.item : x.device) ? ` <span class="hint" style="color:var(--muted)">(${esc(isLoan ? x.item : x.device)})</span>` : ''}</span><span class="hint">${esc(x.status || 'Closed')}${dt ? ' · ' + esc(dt) : ''}</span></div>`;
      }).join('') + `</div></details>`;
  }
  return html;
}

function vOwed() {
  const m = owedModel(store.base || store.raw);
  if (!m.hasOwed) {
    const pre = x => `<pre style="background:var(--surface2);padding:10px;overflow-x:auto;border:1px solid var(--line);border-radius:8px;font-size:12px;text-align:left">${esc(x)}</pre>`;
    return { html: card('Loans and deposits', `<div class="empty"><b>One tab to add first</b>Add a tab named <b style="display:inline">Owed</b> to your Google Sheet. Paste this header row into cell A1 of that tab, then press Refresh. The Type column holds Loan or Deposit.`
      + `${pre(OWED_HEADERS)}</div>`) };
  }
  const t = m.totals;
  const kpis = `<div class="grid g4">`
    + kpi({ label: 'Owed to you', val: M(t.owedToMe), sub: `${t.loansOpen} open loan${t.loansOpen === 1 ? '' : 's'}` })
    + kpi({ label: 'Overdue', val: t.overdue > 0 ? `<span style="color:var(--bad)">${t.overdue}</span>` : String(t.overdue), sub: 'loans and deposits past their date' })
    + kpi({ label: 'Deposits held', val: M(t.depHeld), sub: `${t.depOpen} waiting for pickup` })
    + kpi({ label: 'Due at pickup', val: M(t.depBalance), sub: 'still owed on deposit devices' }) + `</div>`;
  const missing = (title, tab) => `<div class="empty"><b>${title} tab missing</b>Add a tab named "${tab}" to your sheet, then press Refresh.</div>`;
  const loanCard = card('Loans out', m.hasLoans ? owedRows(m.loans, 'loan') : missing('Loans', 'Loans'), `<button type="button" class="btn sec" data-lg="open" data-id="loan">Add loan</button>`);
  const depCard = card('Deposits waiting', m.hasDeps ? owedRows(m.deps, 'dep') : missing('Deposits', 'Deposits'), `<button type="button" class="btn sec" data-lg="open" data-id="dep">Add deposit</button>`);
  const untypedNote = m.untyped ? `<p class="hint" style="margin-top:12px">${m.untyped} row${m.untyped === 1 ? '' : 's'} in the Owed tab ${m.untyped === 1 ? 'has' : 'have'} a name but no Type (Loan or Deposit), so ${m.untyped === 1 ? 'it is' : 'they are'} not shown here.</p>` : '';
  return { html: `${kpis}${untypedNote}<div style="display:flex;flex-direction:column;gap:20px;margin-top:20px">${loanCard}${depCard}</div>` };
}

function owedOpenEdit(kind, id) {
  const m = owedModel(store.base || store.raw), isLoan = kind === 'loan';
  const item = (isLoan ? m.loans : m.deps).find(x => x.id === id);
  if (!item) { toast('That entry is no longer there. Press Refresh.'); return; }
  const title = isLoan ? 'Update loan' : 'Update deposit';
  const summary = isLoan ? `${item.item || 'Loan'} · balance ${mny(item.owed)}` : `${item.device || 'Deposit'} · ${mny(item.balance)} still to pay`;
  const curDate = isLoan ? (item.due ? isoDay(item.due) : '') : (item.pickup ? isoDay(item.pickup) : '');
  const statuses = isLoan ? OWED_LOAN_STATUSES : OWED_DEP_STATUSES;
  const cur = (item.status || '').toLowerCase() === 'open' || !item.status ? statuses[0].toLowerCase() : item.status.toLowerCase();
  const opts = statuses.map(s => `<option value="${esc(s)}"${s.toLowerCase() === cur ? ' selected' : ''}>${esc(s)}</option>`).join('');
  openOverlay(`<form class="palbox" style="padding:20px" role="dialog" aria-modal="true" aria-label="${title}" data-owedform="${kind}" data-oid="${esc(id)}" novalidate>
    <div class="dh"><div><h2>${title}</h2><p class="hint" style="color:var(--muted)">${esc(item.name)} · ${esc(summary)}</p></div><button type="button" class="ibtn" data-act="close" aria-label="Close">${ICON.x}</button></div>
    <div class="ed-grid">
      <div class="ed-f"><label for="owed-pay">${isLoan ? 'Repayment received' : 'Extra payment received'}</label><input type="text" id="owed-pay" inputmode="decimal" autocomplete="off" placeholder="0" data-focus></div>
      <div class="ed-f"><label for="owed-date">${isLoan ? 'Return by' : 'Pick up by'}</label><input type="date" id="owed-date" value="${esc(curDate)}"></div>
    </div>
    <div class="ed-f"><label for="owed-status">Status</label><select id="owed-status">${opts}</select></div>
    <p class="ed-msg" id="ed-msg" role="alert" hidden></p>
    <div class="ed-actions"><button type="button" class="btn sec" data-act="close">Cancel</button><button type="submit" class="btn">Save changes</button></div></form>`, 'pal');
}

async function owedSave(kind, id) {
  if (rowBusy) return;
  const m = owedModel(store.base || store.raw), isLoan = kind === 'loan';
  const item = (isLoan ? m.loans : m.deps).find(x => x.id === id);
  if (!item) { toast('That entry is no longer there. Press Refresh.'); return; }
  const g = k => { const el = document.getElementById(k); return el ? el.value : ''; };

    ? owedLoanChanges(item, { repay: g('owed-pay'), due: g('owed-date'), status: g('owed-status') }, TODAY)
    : owedDepChanges(item, { pay: g('owed-pay'), pickup: g('owed-date'), status: g('owed-status') }, TODAY);
  const msg = document.getElementById('ed-msg');

}

/* Read-only. Works out which "Log an entry" rows need attention. Never writes to the sheet or to any data. */
const SS_DEFAULTS = { graceDays: 0, openMode: 'direct', hover: true };

function ssNormPrefs(p) {
  try {
    const rawP = (p && typeof p === 'object') ? p : {};
    let graceDays = parseInt(rawP.graceDays, 10);
    if (isNaN(graceDays)) graceDays = 0;
    graceDays = Math.max(0, Math.min(365, graceDays));

    const openMode = rawP.openMode === 'filtered' ? 'filtered' : 'direct';

    let hover = true;
    if (rawP.hover === false || rawP.hover === 'false' || rawP.hover === 0) {
      hover = false;
    }

    return { graceDays, openMode, hover };
  } catch (e) {
    return { graceDays: 0, openMode: 'direct', hover: true };
  }
}

function ssLoadPrefs() {
  try {
    const raw = LS.get('ss.prefs');
    if (!raw) return ssNormPrefs({});
    return ssNormPrefs(JSON.parse(raw));
  } catch (e) {
    return ssNormPrefs({});
  }
}

function ssSavePrefs(p) {
  const norm = ssNormPrefs(p);
  try {
    LS.set('ss.prefs', JSON.stringify(norm));
  } catch (e) {}
  return norm;
}

const SS_LEVEL_RANK = { pending: 1, issue: 2, overdue: 3 };

function ssWorst(levels) {
  try {
    if (!Array.isArray(levels)) return null;
    let maxRank = 0;
    let worst = null;
    for (let i = 0; i < levels.length; i++) {
      const lvl = levels[i];
      const rank = SS_LEVEL_RANK[lvl] || 0;
      if (rank > maxRank) {
        maxRank = rank;
        worst = lvl;
      }
    }
    return worst;
  } catch (e) {
    return null;
  }
}

function ssBuild(ctx) {
  const mkEmpty = () => ({
    loan: { level: null, count: 0, entries: [] },
    dep: { level: null, count: 0, entries: [] },
    bpc: { level: null, count: 0, entries: [] },
    sphone: { level: null, count: 0, entries: [] }
  });

  try {
    if (!ctx) return mkEmpty();

    const prefs = ssNormPrefs(ctx.prefs);
    const today = ctx.today instanceof Date ? ctx.today : new Date();
    const fmt = ctx.fmt || {};
    const fMoney = typeof fmt.mny === 'function' ? fmt.mny : (v => String(v));
    const fDate = typeof fmt.fdy === 'function' ? fmt.fdy : (v => v ? new Date(v).toLocaleDateString() : '');

    const getDupRowIds = (rawTab) => {
      const counts = {};
      try {
        const rows = rawTab && Array.isArray(rawTab.rows) ? rawTab.rows : [];
        for (let i = 0; i < rows.length; i++) {
          const val = rows[i] ? rows[i]['Row ID'] : null;
          if (val !== undefined && val !== null) {
            const s = String(val).trim();
            if (s !== '') counts[s] = (counts[s] || 0) + 1;
          }
        }
      } catch (e) {}
      return counts;
    };

    const owedDupCounts = getDupRowIds(ctx.raw && ctx.raw.Owed);
    const bpcDupCounts = getDupRowIds(ctx.raw && ctx.raw.BoughtPCs);
    const sphoneDupCounts = getDupRowIds(ctx.raw && ctx.raw.SoldPhones);

    const sortEntries = (entries) => entries.sort((a, b) => {
      const rA = SS_LEVEL_RANK[a.level] || 0;
      const rB = SS_LEVEL_RANK[b.level] || 0;
      if (rA !== rB) return rB - rA;
      return (a.title || '').localeCompare(b.title || '');
    });

    const result = mkEmpty();

    /* One loan or deposit record. cfg tells it which fields to use. */
    const owedEntries = (records, cfg) => {
      const out = [];
      for (let i = 0; i < records.length; i++) {
        const rec = records[i];
        if (!rec) continue;

        const issues = cfg.issues(rec);
        const rowId = rec.id !== undefined && rec.id !== null ? String(rec.id).trim() : '';
        if (!rowId) issues.push('No Row ID, so it cannot be updated');
        else if (owedDupCounts[rowId] > 1) issues.push('Row ID is used by another row');

        const dueDate = rec[cfg.dateField];
        let isOverdue = false;
        let daysPast = 0;
        if (rec.open && dueDate instanceof Date) {
          daysPast = Math.round((today - dueDate) / 86400000);
          if (daysPast > prefs.graceDays) isOverdue = true;
        }

        let level = null;
        let reasons = issues;
        if (isOverdue) {
          level = 'overdue';
          reasons = [`${daysPast} ${daysPast === 1 ? 'day' : 'days'} past ${cfg.dateWord}`].concat(issues);
        } else if (issues.length > 0) {
          level = 'issue';
        } else if (rec.open) {
          level = 'pending';
          let pStr = cfg.pendingText(rec, fMoney);
          if (dueDate instanceof Date) pStr += `, ${cfg.byWord} ${fDate(dueDate)}`;
          reasons = [pStr];
        }
        if (!level) continue;

        const titleName = rec.name || 'Unnamed';
        const sub = rec[cfg.subField];
        out.push({
          key: `${cfg.kind}_${rec.id}_${rec.row}`,
          title: sub ? `${titleName} · ${sub}` : titleName,
          reasons,
          level,
          target: { type: 'owed', kind: cfg.kind, id: rec.id, row: rec.row }
        });
      }
      return out;
    };

    const finish = (entries) => {
      const sorted = sortEntries(entries);
      return { level: ssWorst(sorted.map(e => e.level)), count: sorted.length, entries: sorted };
    };

    /* Loans */
    try {
      if (ctx.owed && ctx.owed.hasOwed && Array.isArray(ctx.owed.loans)) {
        result.loan = finish(owedEntries(ctx.owed.loans, {
          kind: 'loan', dateField: 'due', dateWord: 'return date', byWord: 'return by', subField: 'item',
          issues: rec => {
            const a = [];
            if (!rec.loaned) a.push('No loan amount');
            if (rec.open && !rec.due) a.push('No return date');
            if (rec.repaid > rec.loaned) a.push('Repaid is more than the amount loaned');
            return a;
          },
          pendingText: (rec, money) => `owes ${money(rec.owed)}`
        }));
      }
    } catch (e) {}

    /* Deposits */
    try {
      if (ctx.owed && ctx.owed.hasOwed && Array.isArray(ctx.owed.deps)) {
        result.dep = finish(owedEntries(ctx.owed.deps, {
          kind: 'dep', dateField: 'pickup', dateWord: 'pickup date', byWord: 'pick up by', subField: 'device',
          issues: rec => {
            const a = [];
            if (!rec.total) a.push('No total price');
            if (rec.open && !rec.pickup) a.push('No pickup date');
            if (rec.paid > rec.total) a.push('Deposit paid is more than the total');
            return a;
          },
          pendingText: (rec, money) => `${money(rec.balance)} still to pay`
        }));
      }
    } catch (e) {}

    const dupEntries = (counts, prefix, where) => {
      const out = [];
      for (const rId of Object.keys(counts)) {
        if (counts[rId] > 1) {
          out.push({
            key: `${prefix}_dup_${rId}`,
            title: `Duplicate Row ID ${rId}`,
            reasons: [`Used by ${counts[rId]} rows in the ${where} tab`],
            level: 'issue',
            target: { type: 'view', view: 'data' }
          });
        }
      }
      return out;
    };

    const items = Array.isArray(ctx.items) ? ctx.items : [];

    /* Bought PC */
    try {
      const entries = [];
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (!item || item.kind !== 'PC') continue;
        const issues = [];
        if (item.buyPrice == null) issues.push('No purchase price, so profit cannot be worked out');
        if (!item.buyDate) issues.push('No purchase date');
        if (item.name === 'Unnamed') issues.push('No PC model');
        if (issues.length) {
          entries.push({
            key: `bpc_${item.id}`,
            title: item.row ? `${item.name} · row ${item.row}` : item.name,
            reasons: issues,
            level: 'issue',
            target: { type: 'item', id: item.id }
          });
        }
      }
      result.bpc = finish(entries.concat(dupEntries(bpcDupCounts, 'bpc', 'Bought PC')));
    } catch (e) {}

    /* Sold phone */
    try {
      const entries = [];
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (!item || item.kind !== 'Phone' || item.sold !== true) continue;
        const issues = [];
        if (item.sellPrice == null) issues.push('No sale price');
        if (!item.sellDate) issues.push('No sale date');
        if (item.sellDate && item.buyDate && item.sellDate < item.buyDate) issues.push('Sale date is before the purchase date');
        if (item.buyPrice == null) issues.push('No purchase price, so profit cannot be worked out');
        if (issues.length) {
          entries.push({
            key: `sphone_${item.id}`,
            title: item.name,
            reasons: issues,
            level: 'issue',
            target: { type: 'item', id: item.id }
          });
        }
      }
      result.sphone = finish(entries.concat(dupEntries(sphoneDupCounts, 'sphone', 'Sold phone')));
    } catch (e) {}

    return result;
  } catch (e) {
    return mkEmpty();
  }
}
/* ===== STATUS SIGNALS ENGINE END ===== */

/* Read-only. Builds the live summaries and the per-row look. Never writes anything. */
function ssSummaries() {
  const empty = () => ({
    loan: { level: null, count: 0, entries: [] }, dep: { level: null, count: 0, entries: [] },
    bpc: { level: null, count: 0, entries: [] }, sphone: { level: null, count: 0, entries: [] }
  });
  try {
    const rawData = store.base || store.raw || {};
    return ssBuild({
      items: (store.D && Array.isArray(store.D.items)) ? store.D.items : [],
      owed: owedModel(rawData),
      raw: rawData,
      today: TODAY,
      prefs: ssLoadPrefs(),
      fmt: { mny: mny, fdy: fdy }
    }) || empty();
  } catch (e) {
    return empty();
  }
}

const SS_FORM_LABEL = { loan: 'Loan out', dep: 'Deposit taken', bpc: 'Bought PC', sphone: 'Sold phone' };

function ssRowDecor(formId, summaries) {
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const none = { cls: '', iconAttrs: '', badge: '' };
  if (!summaries || !formId || !summaries[formId]) return none;
  const level = summaries[formId].level;
  const count = Number(summaries[formId].count) || 0;
  if (!level || count <= 0) return none;
  const phrase = level === 'overdue' ? count + ' overdue' : level === 'issue' ? count + ' to fix' : count + ' open';
  const label = phrase + ' in ' + (SS_FORM_LABEL[formId] || formId) + ', press to see the list';
  const shown = count > 99 ? '99+' : String(count);
  return {
    cls: ' ss ss-' + esc(level),
    iconAttrs: ' tabindex="0" role="button" data-ss="pop" data-ss-form="' + esc(formId) + '" aria-label="' + esc(label) + '"',
    badge: '<i class="ss-b ss-b-' + esc(level) + '" aria-hidden="true">' + esc((level === 'overdue' ? '!' : '') + shown) + '</i>'
  };
}

/* Read-only. Shows the list under a flagged row and opens a record. Only changes the screen, never the sheet. */
const ssState = { activeForm: null, pinned: false, timer: null, hideTimer: null, lastIcon: null };

/* True only while a pinned popover is really on screen (the menu can redraw and remove it). */
function ssPinnedLive() { return !!(ssState.pinned && document.querySelector('.ss-pop')); }

function ssPopHtml(formId, summaries, pinned) {
  const label = (typeof SS_FORM_LABEL !== 'undefined' && SS_FORM_LABEL[formId]) || formId || '';
  const sum = (summaries && summaries[formId]) || { count: 0, entries: [] };
  const count = sum.count || 0;
  const entries = Array.isArray(sum.entries) ? sum.entries : [];
  const closeBtn = pinned ? '<button type="button" class="ss-pop-x" data-ss="close" aria-label="Close list">✕</button>' : '';
  const itemsHtml = entries.map(e => {
    return '<button type="button" class="ss-it" data-ss="item" data-ss-form="' + esc(formId) + '" data-ss-key="' + esc(e.key || '') + '">'
      + '<span class="ss-dot ss-dot-' + esc(e.level || 'pending') + '"></span><span class="ss-it-m"><span class="ss-it-t">' + esc(e.title || '')
      + '</span><span class="ss-it-r">' + esc(Array.isArray(e.reasons) ? e.reasons.join(' · ') : '') + '</span></span></button>';
  }).join('');
  return '<div class="ss-pop' + (pinned ? '' : ' ss-preview') + '" role="dialog" aria-label="' + esc(label) + ' status details" data-ss-pop="' + esc(formId) + '">'
    + '<div class="ss-pop-h"><span>' + esc(label) + ' · ' + esc(count) + '</span>' + closeBtn + '</div><div class="ss-pop-bdy">' + itemsHtml + '</div></div>';
}

function ssClearTimers() {
  if (ssState.timer) { clearTimeout(ssState.timer); ssState.timer = null; }
  if (ssState.hideTimer) { clearTimeout(ssState.hideTimer); ssState.hideTimer = null; }
}

function ssClosePop(restoreFocus) {
  ssClearTimers();
  const existing = document.querySelector('.ss-pop');
  if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
  const prevIcon = ssState.lastIcon;
  ssState.activeForm = null; ssState.pinned = false; ssState.lastIcon = null;
  if (restoreFocus && prevIcon && typeof prevIcon.focus === 'function') { try { prevIcon.focus(); } catch (_) {} }
}

function ssShowPop(formId, iconEl, pinned, focusFirst) {
  try {
    if (ssPinnedLive() && !pinned) return;   /* hover never replaces a pinned list */
    ssClosePop(false);
    const li = iconEl ? iconEl.closest('.li') : null;
    if (!li || !li.parentNode) return;
    const temp = document.createElement('div');
    temp.innerHTML = ssPopHtml(formId, ssSummaries(), !!pinned);
    const popEl = temp.firstElementChild;
    if (!popEl) return;
    li.insertAdjacentElement('afterend', popEl);
    ssState.activeForm = formId; ssState.pinned = !!pinned; ssState.lastIcon = iconEl;
    if (pinned && focusFirst) { const f = popEl.querySelector('.ss-it'); if (f) { try { f.focus(); } catch (_) {} } }
  } catch (err) { /* a failed popover must never break the menu */ }
}

function ssTogglePop(formId, iconEl, focusFirst) {
  if (ssPinnedLive() && ssState.activeForm === formId) ssClosePop(true);
  else ssShowPop(formId, iconEl, true, !!focusFirst);
}

function ssOpenTarget(target, entry, mode) {
  try {
    ssClosePop(false);
    if (!target) return;
    if (mode === 'filtered') {
      closeOverlay();
      go(target.type === 'owed' ? 'owed' : target.type === 'item' ? 'inventory' : (target.view || 'data'));
      setTimeout(() => {
        try {
          if (target.type === 'view') return;
          const name = String((entry && entry.title) || '').split(' · ')[0].trim();
          if (!name) return;
          const inp = Array.from(document.querySelectorAll('input[data-q]')).find(i => i.getClientRects().length > 0);
          if (inp) { inp.value = name; inp.dispatchEvent(new Event('input', { bubbles: true })); toast('Showing the list for ' + name); }
        } catch (_) {}
      }, 60);
      return;
    }
    if (target.type === 'item') {
      if (store.D && store.D.byId && store.D.byId.has(target.id)) openDetail(target.id);
      else toast('That record is no longer there. Press Refresh.');
    } else if (target.type === 'owed') {
      if (target.id !== undefined && target.id !== null && target.id !== '') owedOpenEdit(target.kind, target.id);
      else { toast('This entry has no Row ID yet, so it cannot be opened from here. Opening the Owed list instead.'); closeOverlay(); go('owed'); }
    } else if (target.type === 'view') {
      closeOverlay(); go(target.view || 'data');
    }
  } catch (err) { try { toast('Could not open that entry.'); } catch (_) {} }
}

function ssInitEvents() {
  if (window.__ssBound) return;
  window.__ssBound = true;
  const near = (e, sel) => (e.target && e.target.closest ? e.target.closest(sel) : null);

  document.addEventListener('click', (e) => {
    const icon = near(e, '[data-ss="pop"]');
    if (icon) {
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      ssTogglePop(icon.getAttribute('data-ss-form'), icon, false);
      return;
    }
    const closeBtn = near(e, '[data-ss="close"]');
    if (closeBtn) { e.preventDefault(); e.stopPropagation(); ssClosePop(true); return; }
    const itemBtn = near(e, '[data-ss="item"]');
    if (itemBtn) {
      e.preventDefault(); e.stopPropagation();
      const formId = itemBtn.getAttribute('data-ss-form'), key = itemBtn.getAttribute('data-ss-key');
      const sum = ssSummaries()[formId];
      const entry = sum && Array.isArray(sum.entries) ? sum.entries.find(x => String(x.key) === String(key)) : null;
      if (entry) ssOpenTarget(entry.target, entry, ssLoadPrefs().openMode); else ssClosePop(false);
      return;
    }
    if (ssPinnedLive() && !near(e, '.ss-pop')) ssClosePop(false);
  }, true);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.querySelector('.ss-pop')) {
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      ssClosePop(true);
      return;
    }
    const icon = near(e, '[data-ss="pop"]');
    if (icon && (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar')) {
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      ssTogglePop(icon.getAttribute('data-ss-form'), icon, true);
    }
  }, true);

  document.addEventListener('mouseover', (e) => {
    const prefs = ssLoadPrefs();
    if (!prefs.hover || !(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches)) return;
    if (ssPinnedLive()) return;
    if (near(e, '.ss-pop')) { if (ssState.hideTimer) { clearTimeout(ssState.hideTimer); ssState.hideTimer = null; } return; }
    const icon = near(e, '[data-ss="pop"]');
    if (!icon) return;
    if (ssState.hideTimer) { clearTimeout(ssState.hideTimer); ssState.hideTimer = null; }
    const formId = icon.getAttribute('data-ss-form');
    if (ssState.activeForm === formId && document.querySelector('.ss-pop')) return;
    if (ssState.timer) clearTimeout(ssState.timer);
    ssState.timer = setTimeout(() => { ssState.timer = null; ssShowPop(formId, icon, false, false); }, 150);
  });

  document.addEventListener('mouseout', (e) => {
    if (ssPinnedLive()) return;
    if (!near(e, '[data-ss="pop"]') && !near(e, '.ss-pop')) return;
    const rel = e.relatedTarget;
    if (rel && rel.closest && (rel.closest('[data-ss="pop"]') || rel.closest('.ss-pop'))) return;
    if (ssState.timer) { clearTimeout(ssState.timer); ssState.timer = null; }
    if (ssState.hideTimer) clearTimeout(ssState.hideTimer);
    ssState.hideTimer = setTimeout(() => { if (!ssPinnedLive()) ssClosePop(false); }, 250);
  });
}
ssInitEvents();
