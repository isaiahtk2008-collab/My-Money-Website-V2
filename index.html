/* Status of the top-bar "Check matching" button. Read-only: runs the existing matchAudit and never writes anything.
   Level mapping: only missing Row IDs = pending (yellow); any device that cannot be matched = issue (red);
   outdated script, or at least half the devices cannot be matched = overdue (blinking red). Memoized on the loaded data. */
let __mfD = null, __mfRaw = null, __mfSync = null, __mfVal = null;
function matchfixStatus() {
  const base = { level: null, count: 0, cls: '', label: 'Check matching', title: 'Check that every device matches its sheet row', badge: '' };
  try {
    const curD = (typeof store !== 'undefined' && store.D) || null;
    const curRaw = (typeof store !== 'undefined' && (store.base || store.raw)) || null;
    const curSync = (typeof store !== 'undefined' && store.syncedAt) || null;
    if (__mfVal && __mfD === curD && __mfRaw === curRaw && __mfSync === curSync) return __mfVal;
    const remember = v => { __mfD = curD; __mfRaw = curRaw; __mfSync = curSync; __mfVal = v; return v; };
    if (store.source && store.source.kind === 'embedded') return remember(base);   // demo snapshot: there is no sheet to match against, so no alarm
    const audit = typeof matchAudit === 'function' ? matchAudit((curD && curD.items) || [], curRaw) : null;
    if (!audit || !Array.isArray(audit.problems) || audit.problems.length === 0) return remember(base);
    const problems = audit.problems, count = problems.length;
    const total = typeof audit.total === 'number' ? audit.total : count;
    const hard = problems.filter(p => p && p.reason !== 'noid').length;
    const noScript = problems.some(p => p && p.reason === 'no-script-tabs');
    let level = 'issue';
    if (problems.every(p => p && p.reason === 'noid')) level = 'pending';
    else if (noScript || (total >= 2 && hard >= total / 2)) level = 'overdue';
    const dev = count === 1 ? '1 device' : count + ' devices', verb = count === 1 ? 'needs' : 'need';
    const phrase = level === 'pending' ? dev + ' ' + verb + ' a Row ID' : level === 'issue' ? dev + ' ' + verb + ' attention' : 'urgent, ' + dev + ' cannot be matched';
    const shown = count > 99 ? '99+' : String(count);
    return remember({ level, count, cls: ' mf mf-' + level, label: 'Check matching: ' + phrase, title: 'Check that every device matches its sheet row \u00b7 ' + phrase,
      badge: '<i class="ss-b ss-b-' + level + '" aria-hidden="true">' + esc((level === 'overdue' ? '!' : '') + shown) + '</i>' });
  } catch (_) { return base; }
}

?a$/i.test(t) || /^#(N\\/A|REF!|VALUE!|DIV\\/0!|NAME\\?|NUM!|NULL!|ERROR!)/.test(t)) return null;\n  const d = parseDateText(t);\n  if (d) return d;\n  let m = t.match(/^(-?)\\s*\\$\\s*(-?)\\s*(\\d[\\d,]*(?:\\.\\d+)?|\\.\\d+)$/);          // $1,000.00  -$5  $-325.00\n  if (m) return (m[1] || m[2] ? -1 : 1) * parseFloat(m[3].replace(/,/g, ''));\n  m = t.match(/^\\(\\s*\\$?\\s*(\\d[\\d,]*(?:\\.\\d+)?)\\s*\\)$/);                         // (12.50)\n  if (m) return -parseFloat(m[1].replace(/,/g, ''));\n  m = t.match(/^(-?\\d+(?:\\.\\d+)?)\\s*%$/);                                        // 12.5%  ->  0.125\n  if (m) return parseFloat(m[1]) / 100;\n  return t;\n}\n\nfunction readTab(ss, spec, tz) {\n  const sheet = findSheet(ss, spec.tab);\n  if (!sheet) return { sheet: spec.tab, headers: [], rows: [], missing: true };\n  const lastRow = sheet.getLastRow(), lastCol = sheet.getLastColumn();\n  if (lastRow < 1 || lastCol < 1) return { sheet: spec.tab, headers: [], rows: [] };\n  const values = sheet.getRange(1, 1, lastRow, lastCol).getValues();\n  const headers = values[0].map(h => String(h).replace(/ /g, ' ').trim());\n  const rows = [];\n  for (let r = 1; r < values.length; r++) {\n    const o = {};\n    headers.forEach((h, i) => { if (h) o[h] = cleanCell(values[r][i], tz); });\n    if (o._row === undefined) o._row = r + 1; // the row's number in the sheet (every header, \"Row ID\" included, is already a key above)\n    rows.push(o);\n  }\n  // Formula tabs can stretch far below the real data. Drop rows at the very bottom that have none of the key columns.\n  let keys = spec.keys.filter(k => headers.indexOf(k) >= 0);\n  if (!keys.length) keys = headers.filter(Boolean);\n  const real = row => keys.some(k => row[k] !== null && row[k] !== undefined);\n  while (rows.length && !real(rows[rows.length - 1])) rows.pop();\n  return { sheet: spec.tab, headers, rows };\n}\n\nfunction readAll() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  const tz = ss.getSpreadsheetTimeZone();\n  const tabs = {};\n  Object.keys(READ_TABS).forEach(key => { tabs[key] = readTab(ss, READ_TABS[key], tz); });\n  return tabs;\n}\n\n// Reports what it read and anything the website could not use. Shows a few example cells, never the whole sheet.\nfunction checkAll() {\n  const tabs = readAll(), out = {};\n  const isDateCol = h => /date|timestamp/i.test(h), isMoneyCol = h => /amount|price|profit|portfolio value/i.test(h);\n  Object.keys(tabs).forEach(key => {\n    const t = tabs[key], problems = [];\n    t.headers.filter(Boolean).forEach(h => {\n      let bad = 0; const samples = [];\n      t.rows.forEach((r, i) => {\n        const v = r[h];\n        if (v === null || v === undefined) return;\n        const wrong = isDateCol(h) ? !(typeof v === 'string' && /^\\d{4}-\\d{2}-\\d{2}/.test(v)) : isMoneyCol(h) ? typeof v !== 'number' : false;\n        if (wrong) { bad++; if (samples.length < 3) samples.push({ row: i + 2, value: v, type: typeof v }); }\n      });\n      if (bad) problems.push({ column: h, notUsable: bad, examples: samples });\n    });\n    out[key] = { tab: t.sheet, found: !t.missing, rows: t.rows.length, columns: t.headers.filter(Boolean).length, problems };\n    // Report only (nothing is written): real data rows whose \"Row ID\" cell is empty. null when the tab has no \"Row ID\" column.\n    const ridHeader = t.headers.find(h => normHeader(h) === 'rowid');\n    let dataKeys = READ_TABS[key].keys.filter(k => t.headers.indexOf(k) >= 0);\n    if (!dataKeys.length) dataKeys = t.headers.filter(h => h && h !== ridHeader);\n    const filled = v => v !== null && v !== undefined;\n    out[key].hasRowId = ridHeader !== undefined;\n    out[key].missingRowId = ridHeader === undefined ? null : t.rows.filter(r => dataKeys.some(k => filled(r[k])) && !filled(r[ridHeader])).length;\n  });\n  return out;\n}\n\n/* ---------- SETTINGS SYNC (themes, appearance and the saved login record, shared by every device) ----------\n   Uses ONE tab called \"MM Settings\". It is created only when the first setting is saved, and this code never reads, writes or\n   changes any other tab. Each setting is one row: key, value (JSON text, so it can never turn into a formula), time changed.\n   The newest change to each setting wins. The saved-login record is only stored when SECRET (top of this file) is set. */\nconst SETTINGS_TAB = 'MM Settings';\nconst SETTINGS_HEADER = ['Key', 'Value (JSON)', 'UpdatedAt (ms)', 'UpdatedAt (ISO)'];\nconst SETTINGS_ALLOWED = [\n  'mm.theme', 'mm.privacy', 'mm.dense', 'mm.nav.order', 'mm.ss.prefs',   // not synced on purpose: the date-range filter and open/closed panels change constantly\n  'mm.hfx.s', 'mm.hfx.dir', 'mm.hfx.col', 'mm.hfx.acc', 'mm.hfx.tile', 'mm.hfx.out', 'mm.hoverfx',\n  'mm.hfx.round', 'mm.hfx.text', 'mm.hfx.enl', 'mm.hfx.bg', 'mm.hfx.anim', 'mm.hfx.amoled', 'mm.hfx.ink',\n  'mm.clr.accent', 'mm.clr.glow', 'mm.clr.outline', 'mm.clr.tile.dark', 'mm.clr.tile.light',\n  'mm.fold.corner', 'mm.fold.on', 'mm.notif', 'mm.auth.cred'\n];\nconst SETTINGS_NEEDS_SECRET = ['mm.auth.cred']; // the salted login hash is only kept/returned when SECRET is not empty\nconst SETTINGS_MAX_ITEMS = 40;\nconst SETTINGS_MAX_LEN = 2000;\n\nfunction settingsKeyOk_(k) {\n  if (SETTINGS_ALLOWED.indexOf(k) < 0) return false;\n  if (SETTINGS_NEEDS_SECRET.indexOf(k) >= 0 && !SECRET) return false;\n  return true;\n}\n\n// Returns the settings tab. create=false never creates it (undefined if missing). null = a tab with that name exists but is not ours.\nfunction settingsSheet_(ss, create) {\n  let sh = ss.getSheetByName(SETTINGS_TAB);\n  if (!sh) {\n    if (!create) return undefined;\n    sh = ss.insertSheet(SETTINGS_TAB, ss.getNumSheets());\n    sh.getRange(1, 1, 1, SETTINGS_HEADER.length).setValues([SETTINGS_HEADER]);\n    sh.getRange('B:B').setNumberFormat('@');\n    sh.setFrozenRows(1);\n    return sh;\n  }\n  const have = sh.getRange(1, 1, 1, SETTINGS_HEADER.length).getValues()[0];\n  for (let i = 0; i < SETTINGS_HEADER.length; i++) if (String(have[i]) !== SETTINGS_HEADER[i]) return null;\n  return sh;\n}\n\n// { key: { v: string|null, t: ms } } for allowed keys only. Never creates the tab.\nfunction readSettings_(ss) {\n  const out = {};\n  const sh = settingsSheet_(ss, false);\n  if (!sh) return out;\n  const n = sh.getLastRow() - 1;\n  if (n < 1) return out;\n  sh.getRange(2, 1, n, 3).getValues().forEach(function (r) {\n    const k = String(r[0]);\n    if (!settingsKeyOk_(k)) return;\n    const t = Number(r[2]);\n    if (!isFinite(t) || t <= 0) return;\n    let v;\n    try { v = JSON.parse(String(r[1])); } catch (e) { return; }\n    if (v !== null && typeof v !== 'string') return;\n    out[k] = { v: v, t: t };\n  });\n  return out;\n}\n\n// items: [{k, v, t}] with v a string or null (null = setting removed). Newest t wins. The script lock is already held by doPost.\nfunction writeSettings_(ss, items) {\n  const sh = settingsSheet_(ss, true);\n  if (!sh) return { ok: false, error: 'settings tab conflict' };\n  const rowOf = {}, tOf = {};\n  const last = sh.getLastRow();\n  if (last > 1) {\n    sh.getRange(2, 1, last - 1, 3).getValues().forEach(function (r, i) {\n      const k = String(r[0]);\n      if (!(k in rowOf)) { rowOf[k] = i + 2; tOf[k] = Number(r[2]) || 0; }\n    });\n  }\n  const now = Date.now();\n  const applied = [], skipped = [], pending = {}, order = [];\n  items.slice(0, SETTINGS_MAX_ITEMS).forEach(function (it) {\n    const k = it && it.k;\n    const skip = function (why) { skipped.push({ k: typeof k === 'string' ? k : null, reason: why }); };\n    if (typeof k !== 'string' || SETTINGS_ALLOWED.indexOf(k) < 0) return skip('key not allowed');\n    if (SETTINGS_NEEDS_SECRET.indexOf(k) >= 0 && !SECRET) return skip('secret required');\n    if (!(it.v === null || typeof it.v === 'string')) return skip('bad value');\n    if (typeof it.v === 'string' && it.v.length > SETTINGS_MAX_LEN) return skip('too long');\n    const t = it.t;\n    if (typeof t !== 'number' || !isFinite(t) || Math.floor(t) !== t || t <= 0) return skip('bad time');\n    if (t > now + 10 * 60 * 1000) return skip('time in future');\n    if (t <= (k in tOf ? tOf[k] : 0)) return skip('older');\n    tOf[k] = t;\n    if (!(k in pending)) { order.push(k); applied.push(k); }\n    pending[k] = [k, JSON.stringify(it.v), t, new Date(t).toISOString()];\n  });\n  const fresh = [];\n  order.forEach(function (k) {\n    if (k in rowOf) sh.getRange(rowOf[k], 1, 1, 4).setValues([pending[k]]);\n    else fresh.push(pending[k]);\n  });\n  if (fresh.length) sh.getRange(sh.getLastRow() + 1, 1, fresh.length, 4).setValues(fresh);\n  return { ok: true, applied: applied, skipped: skipped, settings: readSettings_(ss) };\n}\n\n// A plain GET only ever answers the harmless status ping below. It never returns sheet data and never needs a token, so it\n// cannot leak anything. Reading, checking and settings are POST requests that must carry a valid token (see doPost).\nfunction doGet(e) {\n  return json({ ok: true, service: 'my-money-entry', version: 3, read: true, edit: true, backfill: true, trade: true, settings: true, settingsSecret: !!SECRET, auth: 'session', guests: true });\n}\n\n// The read-type answers. Only doPost calls this, and only after authOk_ passed.\n// guest = null for the owner, or { preset, exp } for a guest key (doPost only ever lets a guest reach plain \"read\").\nfunction readReply_(body, guest) {\n  try {\n    if (guest) {\n      if (body.action !== 'read') return { ok: false, error: 'view-only' };   // belt and braces: settings and check are never shown to guests\n      const gtabs = filterForGuest_(readAll(), guest.preset);\n      const greply = { ok: true, version: 3, at: new Date().toISOString(), tabs: gtabs, guest: { preset: guest.preset, exp: guest.exp } };\n      if (body.flat === '1' || body.flat === 1 || body.flat === true) greply.data = flatten(gtabs);\n      return greply;\n    }\n    if (body.action === 'settings_get') {\n      return { ok: true, version: 3, secretSet: !!SECRET, settings: readSettings_(SpreadsheetApp.getActiveSpreadsheet()) };\n    }\n    if (body.action === 'check') return { ok: true, version: 3, at: new Date().toISOString(), tabs: checkAll() };\n    const tabs = readAll();\n    const reply = { ok: true, version: 3, at: new Date().toISOString(), tabs: tabs };\n    if (body.flat === '1' || body.flat === 1 || body.flat === true) reply.data = flatten(tabs); // action \"read\" with flat -> { status: \"success\", data: [...] }\n    return reply;\n  } catch (err) {\n    return { ok: false, error: String(err) };\n  }\n}\n\n/* ---------- writing (unchanged behaviour: only ever ADDS a row, never overwrites) ---------- */\nfunction seenId(id) {\n  if (!id) return false;\n  const cache = CacheService.getScriptCache();\n  if (cache.get('id:' + id)) return true;\n  try {\n    const map = JSON.parse(PropertiesService.getScriptProperties().getProperty('SEEN_IDS') || '{}');\n    if (map[id]) { cache.put('id:' + id, '1', 21600); return true; }\n  } catch (e) {}\n  return false;\n}\n\nfunction markId(id) {\n  if (!id) return;\n  CacheService.getScriptCache().put('id:' + id, '1', 21600);\n  const props = PropertiesService.getScriptProperties();\n  let map = {};\n  try { map = JSON.parse(props.getProperty('SEEN_IDS') || '{}') || {}; } catch (e) {}\n  const now = Date.now();\n  map[id] = now;\n  let entries = Object.keys(map).map(k => [k, map[k]]).filter(p => p[1] >= now - 30 * 86400000);\n  if (entries.length > 200) { entries.sort((a, b) => b[1] - a[1]); entries = entries.slice(0, 200); }\n  const out = {};\n  entries.forEach(p => { out[p[0]] = p[1]; });\n  props.setProperty('SEEN_IDS', JSON.stringify(out));\n}\n\n/* ---------- TRADE: one sold row + one received-device row as ONE request, all or nothing ----------\n   planAddRow follows exactly the same rules as the plain add in doPost (header match, next free row, optional Row ID, never overwrite)\n   but only READS. addTrade plans both rows first, writes only if both are safe, undoes its own writes if anything fails midway,\n   and remembers the id only after both rows landed, so a retry of the same id can never add a second pair. */\nfunction planAddRow(ss, tabName, inVals) {\n  const sheet = findSheet(ss, tabName);\n  if (!sheet) return { ok: false, error: 'no tab: ' + tabName };\n\n  const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');\n  const headers = sheet.getRange(1, 1, 1, sheet.getLastColumn() || 1).getValues()[0].map(norm);\n  const inputVals = inVals || {};\n  const matchedCols = {}, matchedKeys = new Set();\n\n  headers.forEach((h, idx) => {\n    if (h === 'timestamp') {\n      matchedCols[idx + 1] = new Date();\n    } else if (h) {\n      const k = Object.keys(inputVals).find(key => norm(key) === h);\n      if (k !== undefined) {\n        matchedKeys.add(k);\n        let v = inputVals[k];\n        if (v && typeof v === 'object' && v.$date) {\n          const [y, m, d] = v.$date.split('-').map(Number);\n          v = new Date(y, m - 1, d);\n        }\n        matchedCols[idx + 1] = v;\n      }\n    }\n  });\n  const unmatched = Object.keys(inputVals).filter(k => !matchedKeys.has(k));\n\n  const cols = Object.keys(matchedCols).map(Number);\n  let targetRow = 2;\n  const maxRows = sheet.getMaxRows();\n  if (maxRows > 1 && cols.length > 0) {\n    const data = sheet.getRange(2, 1, maxRows - 1, sheet.getLastColumn()).getValues();\n    for (let r = data.length - 1; r >= 0; r--) {\n      if (cols.some(c => data[r][c - 1] !== '')) {\n        targetRow = r + 3;\n        break;\n      }\n    }\n  }\n\n  const ridCol = headers.indexOf('rowid') + 1;\n  let rowId;\n  if (ridCol > 0 && cols.length > 0) {\n    const given = matchedCols[ridCol];\n    if (given === undefined || given === null || String(given).trim() === '') {\n      rowId = makeRowId();\n      matchedCols[ridCol] = rowId;\n      if (cols.indexOf(ridCol) < 0) cols.push(ridCol);\n    } else {\n      rowId = String(given);\n    }\n  }\n\n  if (targetRow <= maxRows) {\n    const clash = cols.some(c => { const cell = sheet.getRange(targetRow, c); return cell.getFormula() !== '' || cell.getValue() !== ''; });\n    if (clash) return { ok: false, error: 'target row not empty' };\n  }\n\n  return { ok: true, sheet: sheet, targetRow: targetRow, maxRows: maxRows, cols: cols, matchedCols: matchedCols, rowId: rowId, unmatched: unmatched };\n}\n\nfunction addTrade(ss, body) {\n  const id = body && body.id;\n  if (typeof id !== 'string' || !id.trim()) return { ok: false, error: 'trade needs an id' };\n\n  // Ignore retries of a trade that already landed\n  if (seenId(id)) return { ok: true, dup: true };\n\n  const soldTabStr = String((body && body.soldTab) || '').trim().toLowerCase();\n  if (!TRADE_SOLD_TABS.some(t => t.toLowerCase() === soldTabStr)) return { ok: false, error: 'tab not allowed: ' + body.soldTab };\n  const boughtTabStr = String((body && body.boughtTab) || '').trim().toLowerCase();\n  if (!TRADE_BOUGHT_TABS.some(t => t.toLowerCase() === boughtTabStr)) return { ok: false, error: 'tab not allowed: ' + body.boughtTab };\n\n  const isObjectWithKeys = obj => obj && typeof obj === 'object' && !Array.isArray(obj) && Object.keys(obj).length > 0;\n  if (!isObjectWithKeys(body.soldValues) || !isObjectWithKeys(body.boughtValues)) return { ok: false, error: 'trade needs soldValues and boughtValues' };\n\n  // Plan BOTH rows before writing anything (reads only).\n  const soldPlan = planAddRow(ss, body.soldTab, body.soldValues);\n  if (!soldPlan.ok) return { ok: false, error: soldPlan.error, which: 'sold' };\n  const boughtPlan = planAddRow(ss, body.boughtTab, body.boughtValues);\n  if (!boughtPlan.ok) return { ok: false, error: boughtPlan.error, which: 'bought' };\n\n  // Write sold, then bought. If anything throws, put back every cell we wrote (each was verified empty, so '' restores it exactly).\n  const written = [];\n  try {\n    const plans = [soldPlan, boughtPlan];\n    for (let i = 0; i < plans.length; i++) {\n      const p = plans[i];\n      if (p.targetRow > p.maxRows) p.sheet.insertRowsAfter(p.maxRows, p.targetRow - p.maxRows);\n      for (let j = 0; j < p.cols.length; j++) {\n        const c = p.cols[j];\n        p.sheet.getRange(p.targetRow, c).setValue(tx_(p.matchedCols[c]));\n        written.push([p.sheet, p.targetRow, c]);\n      }\n    }\n  } catch (err) {\n    let rolledBack = true;\n    for (let k = written.length - 1; k >= 0; k--) {\n      try { written[k][0].getRange(written[k][1], written[k][2]).setValue(''); } catch (rbErr) { rolledBack = false; }\n    }\n    if (rolledBack) return { ok: false, error: 'trade write failed, nothing was kept: ' + String(err), rolledBack: true };\n    markId(id); // the undo failed too: remember the id so a retry can never add a second pair\n    return { ok: false, error: 'trade partly written, check the Sold and Bought tabs: ' + String(err) + '. Do not retry: this trade will not be added again.', partial: true };\n  }\n\n  markId(id);\n  const res = { ok: true, trade: true, id: id, soldRow: soldPlan.targetRow, boughtRow: boughtPlan.targetRow, unmatchedSold: soldPlan.unmatched, unmatchedBought: boughtPlan.unmatched };\n  if (soldPlan.rowId !== undefined) res.soldRowId = soldPlan.rowId;\n  if (boughtPlan.rowId !== undefined) res.boughtRowId = boughtPlan.rowId;\n  return res;\n}\n\n/* ---------- editing and deleting ONE existing row (new requests use `target` and `changes`, never `tab` and `values`,\n   so an older copy of this script can only reject them, never mistake them for a new entry) ---------- */\nconst normHeader = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');\n\n// Is the cell the website saw still what the sheet holds right now?\nfunction sameCell(live, want) {\n  const blank = v => v === null || v === undefined || String(v).trim() === '';\n  if (blank(live) || blank(want)) return blank(live) && blank(want);\n  const iso = /^\\d{4}-\\d{2}-\\d{2}/;\n  if (typeof live === 'string' && iso.test(live) && iso.test(String(want))) return live.slice(0, 10) === String(want).slice(0, 10);\n  if (typeof live === 'number') { const n = parseFloat(String(want).replace(/[$,]/g, '')); return !isNaN(n) && Math.abs(n - live) < 0.005; }\n  return String(live).trim().toLowerCase() === String(want).trim().toLowerCase();\n}\n\n// Finds the one row the website means and proves it is still the same row. Any doubt = refuse, change nothing.\n// A request may carry `rowId`. Then the row is found by its \"Row ID\" cell (exactly one match, otherwise refuse) and the `row` number is ignored,\n// so rows deleted above it cannot shift the target. The `expect` check below STILL runs on that row, as a second lock.\n// Without `rowId` nothing is different: the `row` number plus `expect`, exactly as before.\nfunction lockRow(ss, body, allowEditOnly, allowSaleDelete) {\n  const reqTab = String(body.target || '').trim().toLowerCase();\n  // allowEditOnly adds EDIT_ONLY_TABS. Only editRow passes it. allowSaleDelete adds SALE_DELETE_TABS. Only deleteRow passes it.\n  // Bought tabs are therefore never allowed for delete (they are in EDIT_ONLY_TABS but not in SALE_DELETE_TABS).\n  let allowed = EDITABLE_TABS;\n  if (allowEditOnly === true) allowed = allowed.concat(EDIT_ONLY_TABS);\n  if (allowSaleDelete === true) allowed = allowed.concat(SALE_DELETE_TABS);\n  if (!allowed.some(t => t.toLowerCase() === reqTab)) return { error: 'tab not allowed: ' + body.target };\n  const sheet = findSheet(ss, reqTab);\n  if (!sheet) return { error: 'no tab: ' + body.target };\n  const byId = body.rowId !== undefined && body.rowId !== null;\n  let row;\n  if (!byId) {\n    row = Number(body.row);\n    if (!Number.isInteger(row) || row < 2 || row > sheet.getLastRow()) return { error: 'bad row' };\n  }\n  const expect = body.expect && typeof body.expect === 'object' ? body.expect : {};\n  const keys = Object.keys(expect);\n  if (keys.length < 2) return { error: 'expect needs at least 2 columns' };\n  const lastCol = sheet.getLastColumn();\n  const headers = sheet.getRange(1, 1, 1, lastCol).getValues()[0].map(normHeader);\n  if (byId) {\n    const id = typeof body.rowId === 'string' || typeof body.rowId === 'number' ? String(body.rowId).trim() : '';\n    if (id === '') return { error: 'bad row id' };\n    if (headers.filter(h => h === 'rowid').length !== 1) return { error: 'tab needs exactly one Row ID column' };\n    const ridIdx = headers.indexOf('rowid'), lastRow = sheet.getLastRow();\n    const ids = lastRow >= 2 ? sheet.getRange(2, ridIdx + 1, lastRow - 1, 1).getValues() : [];\n    const hits = [];\n    ids.forEach((cell, i) => { if (String(cell[0]).trim() === id) hits.push(i + 2); });\n    if (hits.length === 0) return { error: 'row id not found' };\n    if (hits.length > 1) return { error: 'row id not unique' };\n    row = hits[0];\n  }\n  const live = sheet.getRange(row, 1, 1, lastCol).getValues()[0];\n  const tz = ss.getSpreadsheetTimeZone();\n  const changed = keys.some(k => { const c = headers.indexOf(normHeader(k)); return c < 0 || !sameCell(cleanCell(live[c], tz), expect[k]); });\n  if (changed) return { error: 'row changed' };\n  return { sheet, row, headers, lastCol };\n}\n\n// Finds the \"Edit Log\" tab, or creates it (with its header row) if it does not exist. This is the ONLY tab the script may create.\n// An existing Edit Log is never changed here; headers are written only into a brand-new or completely empty one.\nfunction ensureEditLog(ss) {\n  let sheet = findSheet(ss, EDIT_LOG_TAB);\n  if (!sheet) sheet = ss.insertSheet(EDIT_LOG_TAB);\n  if (sheet.getLastRow() === 0) sheet.getRange(1, 1, 1, EDIT_LOG_HEADERS.length).setValues([EDIT_LOG_HEADERS]);\n  return sheet;\n}\n\n// Writes only the named cells of that one row. Formula cells and the Timestamp are never touched.\n// Before each cell is written, one row (old value, new value) is added to the Edit Log. If that cannot be done, the cell is NOT written.\nfunction editRow(ss, body) {\n  const g = lockRow(ss, body, true);\n  if (g.error) return { ok: false, error: g.error };\n  let logSheet;\n  try { logSheet = ensureEditLog(ss); } catch (logErr) { return { ok: false, error: 'edit log unavailable' }; }\n  const rawHeaders = g.sheet.getRange(1, 1, 1, g.lastCol).getValues()[0];\n  const ridCols = g.headers.map((h, i) => (h === 'rowid' ? i + 1 : 0)).filter(Boolean);\n  const rowIdValue = ridCols.length === 1 ? g.sheet.getRange(g.row, ridCols[0]).getValue() : g.row;\n  const changes = body.changes && typeof body.changes === 'object' ? body.changes : {};\n  const updated = [], skipped = [];\n  const names = Object.keys(changes);\n  for (let n = 0; n < names.length; n++) {\n    const k = names[n];\n    const c = g.headers.indexOf(normHeader(k));\n    if (c < 0 || normHeader(k) === 'timestamp') { skipped.push(k); continue; }\n    const cell = g.sheet.getRange(g.row, c + 1);\n    if (cell.getFormula() !== '') { skipped.push(k); continue; }\n    let v = changes[k];\n    if (v && typeof v === 'object' && v.$date) { const [y, m, d] = String(v.$date).split('-').map(Number); v = new Date(y, m - 1, d); }\n    if (v !== null && typeof v === 'object' && !(v instanceof Date)) { skipped.push(k); continue; }\n    const newValue = v === null ? '' : v;\n    try {\n      logSheet.appendRow([new Date(), g.sheet.getName(), rowIdValue, rawHeaders[c] || k, tx_(cell.getValue()), tx_(newValue), 'edit']);\n    } catch (logErr) {\n      return { ok: false, error: 'edit log write failed', row: g.row, updated, skipped };\n    }\n    cell.setValue(tx_(newValue));\n    updated.push(k);\n  }\n  return { ok: true, row: g.row, updated, skipped };\n}\n\n// Removes exactly that one row, and only if it holds no formulas.\n// Allowed tabs: Expenses, and the three Sold tabs (SALE_DELETE_TABS). Never passes allowEditOnly to lockRow, so the three Bought tabs can never have a row deleted.\n// Expenses: deleted as before (no log row). A Sold tab row is also refused if it has a Trade ID (trade sales are fixed by editing or by hand),\n// and its full old row is written to the Edit Log (Action 'delete') BEFORE it is removed. If the log cannot be written, nothing is deleted.\nfunction deleteRow(ss, body) {\n  const g = lockRow(ss, body, false, true);\n  if (g.error) return { ok: false, error: g.error };\n  for (let c = 1; c <= g.lastCol; c++) if (g.sheet.getRange(g.row, c).getFormula() !== '') return { ok: false, error: 'row has formulas' };\n\n  const isSale = SALE_DELETE_TABS.some(t => t.toLowerCase() === String(g.sheet.getName()).trim().toLowerCase());\n  if (!isSale) {\n    g.sheet.deleteRow(g.row);\n    return { ok: true, row: g.row, deleted: true };\n  }\n\n  // Sale row: exactly one Trade ID column, and this row's Trade ID must be empty.\n  const tradeCols = g.headers.map((h, i) => (h === 'tradeid' ? i + 1 : 0)).filter(Boolean);\n  if (tradeCols.length !== 1) return { ok: false, error: 'tab needs exactly one Trade ID column' };\n  if (String(g.sheet.getRange(g.row, tradeCols[0]).getValue()).trim() !== '') return { ok: false, error: 'trade sale: edit it or fix it by hand' };\n\n  let logSheet;\n  try { logSheet = ensureEditLog(ss); } catch (logErr) { return { ok: false, error: 'edit log unavailable' }; }\n\n  // The full old row as {header: value}, so it can be re-created by hand.\n  const rawHeaders = g.sheet.getRange(1, 1, 1, g.lastCol).getValues()[0];\n  const values = g.sheet.getRange(g.row, 1, 1, g.lastCol).getValues()[0];\n  const old = {};\n  for (let i = 0; i < g.lastCol; i++) {\n    let key = String(rawHeaders[i] || '').trim() || 'col ' + (i + 1);\n    if (Object.prototype.hasOwnProperty.call(old, key)) key = key + ' (col ' + (i + 1) + ')';\n    old[key] = values[i];\n  }\n  const ridCols = g.headers.map((h, i) => (h === 'rowid' ? i + 1 : 0)).filter(Boolean);\n  const rowIdValue = ridCols.length === 1 ? g.sheet.getRange(g.row, ridCols[0]).getValue() : g.row;\n\n  try {\n    logSheet.appendRow([new Date(), g.sheet.getName(), rowIdValue, 'ALL COLUMNS (row deleted)', JSON.stringify(old), '', /* Pure check for the Sold forms' Payment Type: for Trade or Mixed, Cash Received + Trade-In Value must equal Sale Price (tolerance 0.005).

function checkTradeTotals(type,sale,cash,trade){
  if(type!=='Trade'&&type!=='Mixed')return {ok:true,diff:0,msg:''};
  if(sale===null||!Number.isFinite(sale)||cash===null||!Number.isFinite(cash)||trade===null||!Number.isFinite(trade))return {ok:false,diff:null,msg:''};
  const rawDiff=cash+trade-sale;
  const diff=Math.round(rawDiff*100)/100+0;
  if(Math.abs(rawDiff)<=0.005+1e-9)return {ok:true,diff,msg:''};
  const rel=rawDiff>0?'over':'short';
  return {ok:false,diff,msg:`Cash + Trade-In = $${(cash+trade).toFixed(2)}, but Sale Price is $${sale.toFixed(2)} (${rel} by $${Math.abs(diff).toFixed(2)})`};
}

/* Trade-in margin calculations */
function tradeCalc(all, k, tgt, trade, floorPct = 30) {
  const list = Math.ceil((all * (1 + tgt / 100)) / k);
  const floorPrice = Math.ceil(Math.round(((all * (1 + floorPct / 100)) / k) * 100 * 1e6) / 1e6) / 100;
  const profit = Math.round((list * k - all) * 100) / 100;
  const cashAtList = Math.max(0, Math.round((list - trade) * 100) / 100);
  const cashForFloor = Math.max(0, Math.round((floorPrice - trade) * 100) / 100);
  const coveredByTrade = trade >= floorPrice;
  return { trade, list, profit, cashAtList, floorPrice, cashForFloor, coveredByTrade };
}
function calcUpdate(){
  const g=id=>{const el=$('#'+id);return el?numOf(el.value):null};
  const out=$('#mc-out');if(!out)return;
  const cost=g('mc-cost'),tgt=g('mc-tgt'),fee=g('mc-fee')||0,ext=g('mc-ext')||0;
  if(cost==null||cost<=0||tgt==null||fee<0||fee>=100){out.innerHTML='Enter what you paid and a target to see the price.';return}
  const all=cost+ext,k=1-fee/100;
  const be=all/k,price=(all*(1+tgt/100))/k,net=price*k-all;
  let html=`<div>List at <b style="font-size:20px">${M(Math.ceil(price))}</b></div>
   <div>Break-even price: ${M(Math.ceil(be*100)/100)}</div>
   <div>Net profit at that price: <b class="${net>=0?'pos':'neg'}">${sgn(Math.round((Math.ceil(price)*k-all)*100)/100)}</b> · Markup ${pct((Math.ceil(price)*k-all)/all,0)} · Margin ${pct((Math.ceil(price)*k-all)/Math.ceil(price),0)}</div>`;
  const tv=g('mc-trade');
  if(tv!=null&&tv>0){
    const t=tradeCalc(all,k,tgt,tv);
    html+=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--surface2)">
  <div>Trade-in value: <b>${M(t.trade)}</b></div>
  <div>Cash to collect at the list price: <b>${M(t.cashAtList)}</b></div>
  <div>Profit on the sale (trade-in counted at its value): <b class="${t.profit>=0?'pos':'neg'}">${sgn(t.profit)}</b></div>
  <div>Cash needed to keep a 30% ROI floor: <b>${M(t.cashForFloor)}</b>${t.coveredByTrade?' (the trade-in alone covers it)':''}</div>
  <div class="hint" style="color:var(--muted)">Trade-in value is not cash until you resell that device.</div>
</div>`;
  }
  out.innerHTML=html;
}

/* ---------- Show new entries immediately ----------
   A sent entry is kept in a small on-device overlay and merged into what every screen reads, until the sheet itself
   returns a matching row. This never writes to the sheet. The sheet refresh then retries a few times (Google can
   take a while to show a new row) and always skips Google's cache. */
const OVL_KEY='lg.overlay',OVL_TABS={'Expenses':'Expenses','Investment Tracking Sheet':'Investments'};
const OVL_FIELDS={Expenses:['Item Purchased','Amount','Date of Purchase'],Investments:['Investment Type','Total Portfolio Value','Date']};
const ovlRead=()=>{const a=J(OVL_KEY,[]);return Array.isArray(a)?a:[]};
const ovlStr=v=>String(v==null?'':v).trim();
const ovlSame=(a,b)=>{const x=ovlStr(a),y=ovlStr(b),nx=parseFloat(x.replace(/[$,]/g,'')),ny=parseFloat(y.replace(/[$,]/g,''));return x===y||(!isNaN(nx)&&nx===ny)};
function ovlHit(key,r,o){const f=OVL_FIELDS[key];
  if(!ovlSame(r[f[0]],o[f[0]])||!ovlSame(r[f[1]],o[f[1]]))return false;
  const a=ovlStr(r[f[2]]).slice(0,10),b=ovlStr(o[f[2]]).slice(0,10),iso=/^\d{4}-\d{2}-\d{2}$/;
  return !(iso.test(a)&&iso.test(b))||a===b}
const ovlSig=e=>{const f=OVL_FIELDS[e.key],a=ovlStr(e.row[f[1]]).replace(/[$,]/g,'');return e.key+'|'+ovlStr(e.row[f[0]]).toLowerCase()+'|'+(parseFloat(a)||a)+'|'+ovlStr(e.row[f[2]]).slice(0,10)};
const ovlCount=(raw,key,row)=>{const t=raw&&raw[key];return t&&Array.isArray(t.rows)?t.rows.filter(r=>ovlHit(key,r,row)).length:0};
/* An entry counts as synced once the sheet holds more matching rows than it did when the entry was added
   (so a second identical expense still shows until the sheet really has both). */
function ovlMerge(raw){
  const now=Date.now(),keep=[],out=Object.assign({},raw),copied={},rank={};
  ovlRead().forEach(e=>{
    if(!e||!e.row||!(now-e.ts<864e5))return;
    const t=raw&&raw[e.key];
    if(!t||!Array.isArray(t.rows)){keep.push(e);return}
    const s=ovlSig(e),k=rank[s]||0;rank[s]=k+1;
    if(ovlCount(raw,e.key,e.row)>=(e.pre||0)+k+1)return;
    if(!copied[e.key]){out[e.key]=Object.assign({},t,{rows:t.rows.slice()});copied[e.key]=1}
    out[e.key].rows.push(e.row);keep.push(e)});
  return {raw:out,keep}}
const _storeSet=store.set.bind(store);
store.set=function(raw,source){store.base=raw;const m=ovlMerge(raw);if(m.keep.length!==ovlRead().length)W(OVL_KEY,m.keep);return _storeSet(m.raw,source)};
function addOverlay(it){try{const key=OVL_TABS[it.tab];if(!key||!it.values)return;
  const b=store.base||store.raw;if(b)W(OVL_KEY,ovlMerge(b).keep);   /* settle anything the sheet already returned first */
  const a=ovlRead();if(a.some(e=>e.id===it.id))return;
  const row={};Object.keys(it.values).forEach(k=>{const v=it.values[k];row[k]=v&&typeof v==='object'&&v.$date?v.$date:v});row.Timestamp=new Date().toISOString();
  a.push({id:it.id,key,row,pre:b?ovlCount(b,key,row):0,ts:Date.now()});W(OVL_KEY,a);
  if(b)store.set(b,store.source)}catch(e){}}
let rfBusy=false;
async function refreshAfterSend(){
  if(rfBusy)return;rfBusy=true;let tries=0,fails=0;
  try{
    const sid=LS.get('sheetId');

    const pending=ovlRead().length>0;
    for(const d of [3000,8000,20000,45000]){
      await new Promise(r=>setTimeout(r,d));tries++;
      try{await store.load(src);if(pending&&!ovlRead().length)return}catch(e){fails++}}
    if(tries&&fails===tries)toast('Saved. Could not refresh from Google yet, showing your new entry from this device.')
  }finally{rfBusy=false}}
function afterSend(){try{refreshAfterSend()}catch(e){}}
async function flush(silent){
  const url=LS.get('lgUrl');const q=J('lg.q',[]);if(!url||!q.length||flushing||navigator.onLine===false)return 0;
  flushing=true;let sent=0;const keep=[];
  for(let n=0;n<q.length;n++){const it=q[n];
    try{await send(it);sent++;addOverlay(it)}catch(e){it.err=e&&e.fatal?e.message:null;keep.push(it);if(!(e&&e.fatal)){keep.push(...q.slice(n+1));break}}}
  W('lg.q',keep);flushing=false;badge();
  if(sent){afterSend();if(!silent)toast(sent===1?'Sent 1 waiting entry':`Sent ${sent} waiting entries`)}
  return sent}

/* ---------- Draft age and sync urgency (pure: no storage, no DOM) ----------
   A saved draft is 'fresh' (calm violet) until it has sat for 24 hours, then 'stale' (it glows).
   A queued entry that failed to send, or has waited 24 hours, makes the sync status urgent (red glow). */
function draftState(d, now = Date.now()) {
  if (!d || !d.v) return null;
  if (typeof d.ts === 'number' && Number.isFinite(d.ts) && (now - d.ts >= 24 * 3600 * 1000)) {
    return 'stale';
  }
  return 'fresh';
}

function syncUrgency(q, now = Date.now()) {
  let n = 0, failed = 0, stale = 0;
  if (Array.isArray(q)) {
    for (const x of q) {
      if (x && typeof x === 'object') {
        n++;
        if (typeof x.err === 'string' && x.err !== '') {
          failed++;
        }
        if (typeof x.ts === 'number' && Number.isFinite(x.ts) && (now - x.ts >= 24 * 3600 * 1000)) {
          stale++;
        }
      }
    }
  }
  return { n, failed, stale, urgent: failed > 0 || stale > 0 };
}

/* ---------- Unsaved-edit glow on "Save changes" (UI only: never submits, never writes anything) ---------- */
(function(){
  try {
    const snaps = new WeakMap();

    function getSig(form) {
      const els = Array.from(form.elements).filter(el =>
        el.tagName && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) && el.type !== 'button' && el.type !== 'submit'
      );
      return JSON.stringify(els.map(el => (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value));
    }

    function getSubmitBtn(form) {
      return form.querySelector('.ed-actions button[type="submit"]');
    }

    document.addEventListener('focusin', function(e) {
      const form = e.target && e.target.closest && e.target.closest('form');
      if (!form) return;
      const btn = getSubmitBtn(form);
      if (!btn) return;
      if (!snaps.has(form)) {
        snaps.set(form, getSig(form));
      }
    }, true);

    function checkDirty(e) {
      const form = e.target && e.target.closest && e.target.closest('form');
      if (!form) return;
      const btn = getSubmitBtn(form);
      if (!btn) return;
      if (!snaps.has(form)) return;
      const dirty = getSig(form) !== snaps.get(form);
      btn.classList.toggle('glow-draft', dirty);
      btn.setAttribute('data-dirty', dirty ? 'true' : 'false');
    }

    document.addEventListener('input', checkDirty);
    document.addEventListener('change', checkDirty);

    document.addEventListener('submit', function(e) {
      const form = e.target && e.target.closest && e.target.closest('form');
      if (!form) return;
      const btn = getSubmitBtn(form);
      if (btn) {
        btn.classList.remove('glow-draft');
        btn.setAttribute('data-dirty', 'false');
      }
    });
  } catch (err) {}
})();

const NOTIF_DEFAULTS={enabled:false,day:4,time:'17:00'};   // day = JS getDay(): 0=Sun..6=Sat, 4=Thursday

function notifNormalize(raw) {
  const r = (raw && typeof raw === 'object') ? raw : {};
  return {
    enabled: r.enabled === true,
    day: (Number.isInteger(r.day) && r.day >= 0 && r.day <= 6) ? r.day : NOTIF_DEFAULTS.day,
    time: (typeof r.time === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(r.time)) ? r.time : NOTIF_DEFAULTS.time
  };
}

function notifWeekKey(now) {
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function notifDue(cfg, now, lastShownWeek, lastDismissedWeek) {
  if (!cfg.enabled) return false;
  const order = x => (x + 6) % 7;
  const nowOrder = order(now.getDay());
  const cfgOrder = order(cfg.day);
  const mins = now.getHours() * 60 + now.getMinutes();
  const [hh, mm] = cfg.time.split(':').map(Number);
  const cfgMins = hh * 60 + mm;
  const dayReached = nowOrder > cfgOrder || (nowOrder === cfgOrder && mins >= cfgMins);
  return dayReached && notifWeekKey(now) !== lastDismissedWeek;
}
/* NOTIF-CORE-END */

<script id="mm-fold-js">

(function () {

    if (window.__mmFoldApply) return;

    function lsSet(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }
    function isOn() { return lsGet(K_ON) !== '0'; }
    function corner() { var c = lsGet(K_CORNER); return CORNERS.indexOf(c) >= 0 ? c : 'tr'; }
    function readState() {
      try { var o = JSON.parse(lsGet(K_STATE) || '{}'); return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {}; } catch (e) { return {}; }
    }

              '<svg class="mm-fold-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="12" x2="18" y2="12"></line><line x1="12" y1="6" x2="12" y2="18"></line></svg>';

    function view() { return document.getElementById('view'); }
    function eligible(v) {
      var all = v.querySelectorAll('.card'), out = [];
      for (var i = 0; i < all.length; i++) {
        var c = all[i];
        if (c.classList.contains('kpi')) continue;
        if (c.parentElement && c.parentElement.closest && c.parentElement.closest('.card')) continue;   // not nested in another card
        var h = null, kids = c.children;
        for (var j = 0; j < kids.length; j++) { if (kids[j].tagName === 'HEADER') { h = kids[j]; break; } }

    }
    function titleOf(head) {
      var t = head.querySelector('h3, h2, h4');

    }

    function cap120(str) { return !str ? '' : (str.length > 120 ? str.substring(0, 119) + '…' : str); }
    function previewText(card) {
      try {
        if (!card) return '';

          if (txt) return /^\s*0\s+rows\b/i.test(txt) ? 'Nothing here right now' : cap120(txt);
        }

        if (card.querySelector('.bars') || barEls.length > 0) {

            var nmEl = barEls[b].querySelector('.nm'), nvEl = barEls[b].querySelector('.nv');
            var label = nmEl ? (nmEl.textContent || '').trim() : '', val = '';
            if (nvEl) {

                if (nvEl.childNodes[c].nodeType === 3) { var t = (nvEl.childNodes[c].nodeValue || '').trim(); if (t) { val = t; break; } }
              }

      var ps = v.querySelectorAll('.mm-fold-prev'); for (var pp = 0; pp < ps.length; pp++) ps[pp].parentNode.removeChild(ps[pp]);
      var cs = v.querySelectorAll('.mm-fold-card');
      for (var j = 0; j < cs.length; j++) cs[j].classList.remove('mm-fold-card', 'mm-folded', 'mm-fold-rel', 'mm-fold-head-set');
      var hs = v.querySelectorAll('.mm-fold-head'); for (var k = 0; k < hs.length; k++) hs[k].classList.remove('mm-fold-head');
    }

      try {
        var doc = document.documentElement, v = view();

        for (var i = 0; i < items.length; i++) {

          card.setAttribute('data-fold-title', title || 'card');
          card.classList.add('mm-fold-card');
          head.classList.add('mm-fold-head');
          if (getComputedStyle(card).position === 'static') card.classList.add('mm-fold-rel');
          var btn = null, kids = card.children;
          for (var j = 0; j < kids.length; j++) { if (kids[j].classList && kids[j].classList.contains('mm-fold-btn')) { btn = kids[j]; break; } }
          if (!btn) {
            btn = document.createElement('button');

            card.appendChild(btn);

    }

    document.addEventListener('mm-clr-applied', function () { applyInkSoon(); });

    var raf = null;
    function pass() { raf = null; try { if (card()) renderFix(); } catch (e) {} }
    function schedule() { if (!raf && window.requestAnimationFrame) raf = requestAnimationFrame(pass); }
    function start() {
      try {
        if (window.MutationObserver && document.body) new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
        if (window.MutationObserver) new MutationObserver(applyInkSoon).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-accent', 'data-tile', 'data-outline', 'style'] });
        applyInk(); schedule();
      } catch (e) {}
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

    /* small read-only view (used by the tests) */
    window.__mmAp3 = {
      state: function () { return { round: cur.round, text: cur.text, enl: cur.enl, bg: cur.bg, anim: cur.anim, amoled: cur.amoled, ink: cur.ink }; },
      transform: transform, tabify: tabify, reload: reload, reset: resetAll
    };
  } catch (err) {}
})();
</script>
<script id="mm-sc-js">
(function() {
  try {
    var STORAGE_KEY = 'mm.setfold';
    function getOpenTitles() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        var parsed = JSON.parse(raw);
        if (Object.prototype.toString.call(parsed) === '[object Array]') return parsed;
      } catch (e) {}
      return [];
    }
    function saveOpenTitles(titles) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(titles)); } catch (e) {} }
    function getCardTitle(card) {
      try { var t = card.querySelector('.m3-card-title'); if (t) return (t.textContent || '').trim(); } catch (e) {}
      return '';
    }
    function setCardState(card, isOpen) {
      try {
        var head = card.querySelector('.m3-card-head');
        if (isOpen) { card.classList.remove('mm-sc-closed'); card.classList.add('mm-sc-open'); if (head) head.setAttribute('aria-expanded', 'true'); }
        else { card.classList.remove('mm-sc-open'); card.classList.add('mm-sc-closed'); if (head) head.setAttribute('aria-expanded', 'false'); }
      } catch (e) {}
    }
    function toggleCard(card) {
      try {
        var title = getCardTitle(card), openList = getOpenTitles();
        var nextOpen = !card.classList.contains('mm-sc-open');
        setCardState(card, nextOpen);
        var idx = -1;
        for (var i = 0; i < openList.length; i++) { if (openList[i] === title) { idx = i; break; } }
        if (nextOpen) { if (idx === -1 && title) openList.push(title); }
        else { if (idx !== -1) openList.splice(idx, 1); }
        saveOpenTitles(openList);
      } catch (e) {}
    }
    function handleHeadClick(e) {
      try {
        var target = e.target;
        while (target && target !== this) {
          var tag = (target.tagName || '').toLowerCase();
          if (tag === 'button' || tag === 'a' || tag === 'input' || tag === 'select' || tag === 'textarea') return;
          target = target.parentNode;
        }
        var card = this.parentNode;
        if (card) toggleCard(card);
      } catch (err) {}
    }
    function handleHeadKeydown(e) {
      try {
        var key = e.key || e.keyCode;
        if (key === 'Enter' || key === 13 || key === ' ' || key === 32) {
          var tag = (e.target.tagName || '').toLowerCase();
          if (tag === 'button' || tag === 'a' || tag === 'input' || tag === 'select' || tag === 'textarea') return;
          e.preventDefault();
          var card = this.parentNode;
          if (card) toggleCard(card);
        }
      } catch (err) {}
    }
    function ensureTools(drawer) {
      try {
        if (!drawer || drawer.querySelector('.mm-sc-tools') || !drawer.querySelector('.m3-scope')) return;
        var topBlock = drawer.querySelector('.lg-top');
        if (!topBlock) return;
        var toolsDiv = document.createElement('div');
        toolsDiv.className = 'mm-sc-tools';
        var expBtn = document.createElement('button');
        expBtn.type = 'button'; expBtn.className = 'mm-sc-tool-btn'; expBtn.textContent = 'Expand all';
        expBtn.onclick = function(e) {
          try {
            e.preventDefault();
            var cards = drawer.querySelectorAll('.m3-scope > .m3-card'), titles = [];
            for (var i = 0; i < cards.length; i++) { setCardState(cards[i], true); var t = getCardTitle(cards[i]); if (t) titles.push(t); }
            saveOpenTitles(titles);
          } catch (err) {}
        };
        var colBtn = document.createElement('button');
        colBtn.type = 'button'; colBtn.className = 'mm-sc-tool-btn'; colBtn.textContent = 'Collapse all';
        colBtn.onclick = function(e) {
          try {
            e.preventDefault();
            var cards = drawer.querySelectorAll('.m3-scope > .m3-card');
            for (var i = 0; i < cards.length; i++) setCardState(cards[i], false);
            saveOpenTitles([]);
          } catch (err) {}
        };
        toolsDiv.appendChild(expBtn); toolsDiv.appendChild(colBtn);
        if (topBlock.nextSibling) drawer.insertBefore(toolsDiv, topBlock.nextSibling); else drawer.appendChild(toolsDiv);
      } catch (e) {}
    }
    function decorateCards() {
      try {
        var drawer = document.querySelector('#overlay .drawer.lg');
        if (!drawer) return;
        ensureTools(drawer);
        var undecorated = drawer.querySelectorAll('.m3-scope > .m3-card:not([data-sc-ready])');
        if (!undecorated || !undecorated.length) return;
        var openList = getOpenTitles();
        for (var i = 0; i < undecorated.length; i++) {
          var card = undecorated[i];
          card.setAttribute('data-sc-ready', '1');
          var head = card.querySelector('.m3-card-head');
          if (!head) continue;
          head.setAttribute('role', 'button'); head.setAttribute('tabindex', '0');
          if (!head.querySelector('.mm-sc-chevron')) {
            var chevron = document.createElement('span');
            chevron.className = 'mm-sc-chevron'; chevron.setAttribute('aria-hidden', 'true');
            chevron.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
            head.appendChild(chevron);
          }
          head.onclick = handleHeadClick; head.onkeydown = handleHeadKeydown;
          var title = getCardTitle(card), isOpen = false;
          for (var j = 0; j < openList.length; j++) { if (openList[j] === title) { isOpen = true; break; } }
          setCardState(card, isOpen);
        }
      } catch (e) {}
    }
    window.__mmSettingsFoldApply = decorateCards;
    var rafId = null;
    function schedulePass() {
      try {
        if (rafId) return;
        rafId = window.requestAnimationFrame(function() {
          rafId = null;
          var needsWork = document.querySelector('#overlay .m3-scope > .m3-card:not([data-sc-ready])');
          var drawer = document.querySelector('#overlay .drawer.lg');
          var needsTools = drawer && drawer.querySelector('.m3-scope') && !drawer.querySelector('.mm-sc-tools');
          if (needsWork || needsTools) decorateCards();
        });
      } catch (e) { rafId = null; }
    }
    if (window.MutationObserver) { new MutationObserver(function() { schedulePass(); }).observe(document.body, { childList: true, subtree: true }); }
    schedulePass();
  } catch (err) {}
})();
</script>
